[package]
name = "vokra-bert"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "BERT-family encoder + tokenizer for Vokra (clean-room Apache-2.0)."

[lib]

[dependencies]
vokra-core = { path = "../vokra-core" }
vokra-mmap = { path = "../vokra-mmap" }

[dev-dependencies]
# Wave-4 DEBERTA-CONV-NAMES: verify converter → loader round-trip. First-party
# vokra-* dev-only edge — no runtime dependency, no external crate added.
vokra-convert = { path = "../vokra-convert" }
