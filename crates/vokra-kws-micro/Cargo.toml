# Vokra microWakeWord-style keyword-spotting forward core as a no_std(+alloc)
# subset. Sister crate to `vokra-vad-micro` (M5-03 案1 topology), following the
# same pattern: one crate that isolates the no_std-capable forward from the
# std-heavy `vokra-models`, so the Cortex-M55 IoT Tier 3 build (thumbv8m,
# NFR-PT-03) can name this crate directly without pulling std-only
# `vokra-ops` / `vokra-backend-cpu`.
#
# `KwsMicro::detect()` runs a real forward (log-mel -> INT8 quantise -> INT8
# chain -> threshold) for any chain attached via `set_chain`, and refuses
# loudly when none is. What is still missing is the join to an upstream
# checkpoint: nothing builds a `ChainConfig` from a loaded `Model`, because the
# offline sidecar emits dequantised F32 tensors with no per-tensor
# (scale, zero_point). See `src/lib.rs`'s crate docs.
# `publish = false` until that lands — the crate cannot yet load the
# microWakeWord models (Apache 2.0, https://github.com/kahrendt/microWakeWord)
# its name implies.
[package]
name = "vokra-kws-micro"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

# ZERO external dependencies (NFR-DS-02): only `vokra-core`, with
# `default-features = false` so the no_std subset (error + GGUF reader) is what
# compiles. Transcendentals come from the crate-local `scalar` module, a
# self-contained mirror of the sister crate's (no `libm` — deny.toml bans it).
# Root Cargo.lock stays `vokra-*` only.
# A DIRECT path dep (not `vokra-core.workspace = true`) because cargo forbids
# a workspace-inherited dep from overriding `default-features`, and the no_std
# subset requires `default-features = false`. Still a first-party `vokra-*`
# path dep; the `version` alongside `path` tracks the shared workspace version
# for future `cargo publish` (a no-op for local path resolution today).
[dependencies]
vokra-core = { path = "../vokra-core", version = "0.1.0-alpha.0", default-features = false }

# Mirror of `vokra-vad-micro`'s feature layout: `std` (default-ON) forwards to
# `vokra-core/std`. This crate's own `lib.rs` uses
# `#![cfg_attr(not(feature = "std"), no_std)]` so it becomes `#![no_std]` when
# `--no-default-features` is passed (thumbv8m cross-build). `std` adds NO
# dependency — a cfg flag, not a crate — so the zero-dep invariant (NFR-DS-02)
# and the root Cargo.lock are unaffected.
[features]
default = ["std"]
std = ["vokra-core/std"]

# Inherit workspace lints: `unsafe_code = "deny"` (this crate contains none)
# and `missing_docs = "warn"` (promoted to error by CI's
# `cargo clippy -- -D warnings`).
[lints]
workspace = true
