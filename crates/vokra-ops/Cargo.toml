[package]
name = "vokra-ops"
description = "Speech-specialized operators for the Vokra runtime (STFT/iSTFT, Mel, vocoder chains, ... — implemented from M0-04 onwards)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = true
# crates.io listing metadata inherited from [workspace.package] (X-07-T09).
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
vokra-core.workspace = true
# WP-08 (2026-08-10): SBV2 hot-path libm swap — route the terminal
# HiFi-GAN `tanh` head through `vokra_math::tanh` for cross-plat
# bit-identity within Vokra (owner scope decision 2026-08-09, SBV2
# hot-path only, `docs/adr/sbv2-libm-strategy.md` §3.2.1). First-party
# `vokra-*` crate; root `Cargo.lock` still lists only `vokra-*`
# packages (NFR-DS-02 preserved).
vokra-math.workspace = true

# M2-04-T07: log-mel fused-vs-unfused parity harness (see
# `tests/fused_logmel_parity.rs`). Workspace-internal only (no third-party
# crate), so the zero-dep invariant (NFR-DS-02) is preserved — the root
# `Cargo.lock` continues to list only `vokra-*` packages. This edge is a
# dev-only edge: it never enters the default build graph of `vokra-ops`, and
# `./scripts/check-zero-deps.sh` audits the release lock.
[dev-dependencies]
vokra-models = { path = "../vokra-models" }
# WP-07 wiring pin (tests/vokra_math_shared_primitives.rs): prove that
# `vokra-ops` — and by extension every non-backend first-party crate — can
# call the shared scalar transcendentals in `vokra-math` WITHOUT depending
# on `vokra-backend-cpu`. Dev-only edge: this dependency exists solely to
# link the smoke test; production code inside `vokra-ops` picks up the
# same crate through its own future runtime edge as the SBV2 hot-path
# migration lands. First-party `vokra-*` crate, so the root `Cargo.lock`
# continues to list only `vokra-*` packages (NFR-DS-02).
vokra-math.workspace = true

# M0-04-T19: FFT / RFFT / STFT micro-benchmarks. `harness = false` uses a plain
# `fn main()` binary (std timing) instead of the unstable libtest `#[bench]`
# harness or an external bench crate (criterion is an external dependency and
# the workspace keeps zero third-party deps).
[[bench]]
name = "fft_bench"
harness = false

# M2-05-T11: streaming iSTFT vs batch istft micro-benchmarks. `harness = false`
# for the same zero-dependency reason as fft_bench (no criterion/libtest bench).
[[bench]]
name = "istft_streaming_bench"
harness = false

# M2-04-T11: fused-vs-unfused log-mel micro-benchmarks. `harness = false` for
# the same zero-dependency reason as fft_bench (no criterion/libtest bench).
# The imperative reference path lives in `vokra-models` (`whisper::mel::log_mel`
# under `VOKRA_DISABLE_FUSION=1`); the fused kernel is `fused_log_mel_scalar`
# in this crate.
[[bench]]
name = "fused_logmel_bench"
harness = false

# M4-03-T11: AEC per-frame timing + real-time budget ratio (RTF hook).
# `harness = false` for the same zero-dependency reason; no absolute perf
# gate (relative-regression thinking, M3-01).
[[bench]]
name = "aec_bench"
harness = false

# Opt-in cfg-only features. Cargo features are Cargo's own primitive, not new
# crates: no dependency is added here, so the zero-dep invariant (NFR-DS-02)
# and the root `Cargo.lock` are unaffected — `./scripts/check-zero-deps.sh`
# inspects that lock and is untouched by a feature toggle.
[features]
# ITN/TN (`src/itn/`): forwards `vokra-core/vokra-wfst` so the two FST stages
# of the WeTextProcessing tagger -> verbalizer pipeline can reuse
# `vokra_core::decode::wfst` (the tropical semiring, the `Fst` type and the
# byte-verified `read_openfst_vector`). Default OFF, mirroring the
# `vokra-core` flag it forwards.
#
# The gate covers ONLY `src/itn/compose.rs` and the two composition call
# sites. The tagged-token parser, the per-language field-order tables, the
# `Reorder` rewrite, the grammar container and the OpenFST header probe are
# unconditional, so the default `cargo test --workspace` build compiles and
# exercises them. With the feature off, every FST-touching entry point
# returns a loud `VokraError::UnsupportedOp` naming the flag (FR-EX-08) —
# it never silently degrades to the rule-based helper.
#
# CI runs the feature-ON leg explicitly (see the "WFST feature gate" step in
# `.github/workflows/ci.yml`); without that, `src/itn/compose.rs` would
# compile in no CI job at all and a break there would be a vacuous green.
vokra-wfst = ["vokra-core/vokra-wfst"]

[lints]
workspace = true
