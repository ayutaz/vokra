# Dependabot 設定 (SoT: このファイル)
#
# 対象 ecosystem:
#   - GitHub Actions（全 `uses:` は immutable 40-hex SHA）
#   - root から除外された `integrations/*` Cargo workspaces
#   - uv 管理の Python tool / parity environments
#
# root Cargo workspace は対象外: `Cargo.lock` が first-party `vokra-*` のみという
# NFR-DS-02 を維持する。外部依存更新は独立 lockfile を持つ integration / fuzz
# tooling に閉じ込め、Dependency Review と各 workspace の CI で検査する。
#
# schedule:
#   毎週月曜 UTC 00:00 = JST 09:00。週次 parity cron 群 (Monday 04:00-10:00 UTC =
#   §3 stagger、workflows/README.md 参照) より前に投げるので、PR がその週の parity
#   結果を巻き込みで反映しやすい。
#
# limit / labels / ownership:
#   - open-pull-requests-limit: 5 (同時にレビュー可能な上限を controlled に保つ)
#   - labels: ci + dependencies (Kill switch 監視や release note で機械的に filter するため)
#   - owner: `.github/CODEOWNERS` の `* @ayutaz` で一元管理
#
# grouping:
#   `production-actions` に全 action を集約し、major/minor/patch を 1 PR に束ねる。
#   個別 PR が量産されるのを防ぎ、branch protection の required check 消費を最小化する。

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "00:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "ci"
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    # ignore:
    #   下記は「単なる version tag ではない」pin で、dependabot に自動 bump
    #   させると CI が false-pass 化 (msrv) or hard fail (cibuildwheel) する。
    #
    #   - dtolnay/rust-toolchain@1.89
    #       MSRV pin。2026-07-23 の PR #14 で `@1.89` → `@1.100` に誤 bump
    #       されて msrv job が事実上 stable check になっていた実績。
    #       MSRV 変更は docs/abi-changelog.md + X-08-T32 の owner 判断で手動更新。
    #
    #   - pypa/cibuildwheel@v2.23.4
    #       v3.0.0 が「hybrid pure-python wheel = pre-built native lib inject」
    #       スキームを hard reject する破壊的変更を導入 (Vokra はまさに
    #       hatchling + `src/vokra/_lib/` に cdylib inject する hybrid スキーム
    #       ゆえ v3+ 移行は CIBW_REPAIR_WHEEL_COMMAND 追加設計が必要)。
    #       詳細は .github/workflows/ci.yml:660-676 のコメント。
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
      - dependency-name: "pypa/cibuildwheel"
    groups:
      production-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  - package-ecosystem: "cargo"
    directories:
      - "/fuzz"
      - "/integrations/vokra-android"
      - "/integrations/vokra-cli-bench-server"
      - "/integrations/vokra-godot"
      - "/integrations/vokra-misaki-g2p"
      - "/integrations/vokra-piper-g2p"
      - "/integrations/vokra-server"
      - "/integrations/vokra-server-bench"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "00:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels:
      - "ci"
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      isolated-cargo:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  - package-ecosystem: "uv"
    directories:
