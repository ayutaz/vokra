name: kyutai-candle-applied-advisory

on:
  # The applied profile remains the current pull-request audit gate.
  pull_request:
    paths:
      - ".github/workflows/kyutai-candle-applied-advisory.yml"
      - ".github/workflows/kyutai-candle-source-advisory.yml"
      - ".github/workflows/kyutai-candle-candidate-advisory.yml"
      - ".github/workflows/kyutai-candle-paste-application.yml"
      - "tools/parity/kyutai_candle_reference/audit_lock.py"
      - "tools/parity/kyutai_candle_reference/current_artifact.py"
      - "tools/parity/kyutai_candle_reference/test_current_artifact.py"
      - "tools/parity/kyutai_candle_reference/test_audit_lock.py"
      - "tools/parity/kyutai_candle_reference/test_applied_audit_lock.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: kyutai-candle-applied-advisory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-application:
    name: current source-only Candle producer
    uses: ./.github/workflows/kyutai-candle-paste-application.yml
    with:
      caller: applied-advisory
    permissions:
      contents: read
      actions: read

  applied-advisory:
    name: source-only Candle applied advisory evidence
    needs: source-application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout bounded first-party wrapper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/workflows/kyutai-candle-applied-advisory.yml
            .github/workflows/kyutai-candle-source-advisory.yml
            .github/workflows/kyutai-candle-candidate-advisory.yml
            tools/parity/kyutai_candle_reference/audit_lock.py
            tools/parity/kyutai_candle_reference/current_artifact.py
            tools/parity/kyutai_candle_reference/test_current_artifact.py
            tools/parity/kyutai_candle_reference/test_audit_lock.py
            tools/parity/kyutai_candle_reference/test_applied_audit_lock.py
          sparse-checkout-cone-mode: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.8.17"

      - name: Install Python 3.12 for stdlib checks
        run: uv python install 3.12

      - name: Run bounded wrapper self-tests
        env:
          UV_OFFLINE: "1"
          UV_CACHE_DIR: ${{ runner.temp }}/vokra-uv-cache
        run: |
          set -euo pipefail
          uv run --no-project --offline --python 3.12 \
            tools/parity/kyutai_candle_reference/test_audit_lock.py --self-test
          uv run --no-project --offline --python 3.12 \
            tools/parity/kyutai_candle_reference/test_current_artifact.py
          uv run --no-project --offline --python 3.12 \
            tools/parity/kyutai_candle_reference/test_applied_audit_lock.py

      - name: Download current-run application producer artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.source-application.outputs.primary_artifact_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/vokra-candle-applied-advisory-artifact
          digest-mismatch: error

      - name: Download current-run evidence envelope
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.source-application.outputs.envelope_artifact_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/vokra-candle-current-envelope
          digest-mismatch: error

      - name: Re-run applied artifact tests against downloaded evidence
        env:
          UV_OFFLINE: "1"
          UV_CACHE_DIR: ${{ runner.temp }}/vokra-uv-cache
          VOKRA_CANDLE_APPLIED_ARTIFACT_ROOT: ${{ runner.temp }}/vokra-candle-applied-advisory-artifact
          VOKRA_CANDLE_CURRENT_ENVELOPE_ROOT: ${{ runner.temp }}/vokra-candle-current-envelope
        run: |
          set -euo pipefail
          uv run --no-project --offline --python 3.12 \
            tools/parity/kyutai_candle_reference/test_applied_audit_lock.py

      - name: Checkout pinned RustSec advisory database
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: RustSec/advisory-db
          ref: edb58f5974b83eb8302332821cb6d389777aa351
          fetch-depth: 1
          path: .audit/rustsec-advisory-db
          persist-credentials: false

      - name: Install pinned cargo-audit without source-build fallback
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8
        with:
          tool: cargo-audit@0.22.2
          fallback: none

      - name: Run source-only applied advisory audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UV_OFFLINE: "1"
          UV_CACHE_DIR: ${{ runner.temp }}/vokra-uv-cache
          VOKRA_CANDLE_CURRENT_RUN_ID: ${{ github.run_id }}
          VOKRA_CANDLE_CURRENT_RUN_ATTEMPT: ${{ github.run_attempt }}
          VOKRA_CANDLE_CURRENT_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          VOKRA_CANDLE_CURRENT_WORKFLOW_SHA: ${{ github.workflow_sha }}
          VOKRA_CANDLE_CURRENT_RUN_REF: ${{ github.ref }}
          VOKRA_CANDLE_CURRENT_CALLER: applied-advisory
          VOKRA_CANDLE_PRODUCER_SOURCE_HEAD: ${{ needs.source-application.outputs.source_head }}
          VOKRA_CANDLE_PRODUCER_WORKFLOW_SHA: ${{ needs.source-application.outputs.workflow_sha }}
          VOKRA_CANDLE_PRODUCER_RUN_REF: ${{ needs.source-application.outputs.run_ref }}
          VOKRA_CANDLE_PRODUCER_CALLER: ${{ needs.source-application.outputs.caller }}
          VOKRA_CANDLE_CURRENT_ARTIFACT_ID: ${{ needs.source-application.outputs.primary_artifact_id }}
          VOKRA_CANDLE_CURRENT_ARTIFACT_NAME: ${{ needs.source-application.outputs.primary_artifact_name }}
          VOKRA_CANDLE_CURRENT_ARTIFACT_DIGEST: ${{ needs.source-application.outputs.primary_artifact_digest }}
          VOKRA_CANDLE_CURRENT_ENVELOPE_ID: ${{ needs.source-application.outputs.envelope_artifact_id }}
          VOKRA_CANDLE_CURRENT_ENVELOPE_NAME: ${{ needs.source-application.outputs.envelope_artifact_name }}
          VOKRA_CANDLE_CURRENT_ENVELOPE_DIGEST: ${{ needs.source-application.outputs.envelope_artifact_digest }}
        run: |
          set -euo pipefail
          audit_root="$RUNNER_TEMP/vokra-candle-applied-advisory-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          audit_cwd="$RUNNER_TEMP/vokra-candle-applied-audit-cwd-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cargo_home="$RUNNER_TEMP/vokra-candle-applied-audit-cargo-home-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          report="$audit_root/advisory-report.json"
          test ! -e "$audit_root"
          mkdir -p "$audit_root" "$audit_cwd" "$cargo_home"
          test ! -e "$audit_cwd/.cargo/audit.toml"
          test ! -e "$cargo_home/audit.toml"
          set +e
          uv run --no-project --offline --python 3.12 \
            tools/parity/kyutai_candle_reference/audit_lock.py \
            --profile current \
            --artifact-root "$RUNNER_TEMP/vokra-candle-applied-advisory-artifact" \
            --current-envelope "$RUNNER_TEMP/vokra-candle-current-envelope/envelope.json" \
            --db "$GITHUB_WORKSPACE/.audit/rustsec-advisory-db" \
            --cwd "$audit_cwd" \
            --cargo-home "$cargo_home" \
            --output "$report" \
            --repository "$GITHUB_REPOSITORY" \
            --deadline-seconds 480
          rc=$?
          set -e
          test -f "$report"
          echo "applied_advisory_wrapper_returncode=$rc"
          exit "$rc"

      - name: Upload bounded applied advisory evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kyutai-candle-applied-advisory-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vokra-candle-applied-advisory-${{ github.run_id }}-${{ github.run_attempt }}/advisory-report.json
          if-no-files-found: error
          retention-days: 1
