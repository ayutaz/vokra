name: kyutai-candle-source-metadata

on:
  pull_request:
    paths:
      - ".github/workflows/kyutai-candle-source-metadata.yml"
      - "tools/parity/kyutai_candle_reference/collect_metadata.py"
      - "tools/parity/kyutai_candle_reference/test_collect_metadata_diagnostics.py"
      - "tools/parity/kyutai_candle_reference/test_collect_metadata.py"
      - "tools/parity/kyutai_candle_reference/test_candle_metadata_workflow_contract.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kyutai-candle-source-metadata-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-metadata:
    name: source-only Candle metadata diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/workflows/kyutai-candle-source-metadata.yml
            tools/parity/kyutai_candle_reference/collect_metadata.py
            tools/parity/kyutai_candle_reference/test_collect_metadata.py
            tools/parity/kyutai_candle_reference/test_collect_metadata_diagnostics.py
            tools/parity/kyutai_candle_reference/test_candle_metadata_workflow_contract.py
          sparse-checkout-cone-mode: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.8.17"

      - name: Install Python 3.12 for stdlib diagnostics
        run: uv python install 3.12

      - name: Run offline stdlib diagnostics
        env:
          UV_OFFLINE: "1"
        run: |
          set -euo pipefail
          uv run --no-project --python 3.12 python -m py_compile \
            tools/parity/kyutai_candle_reference/collect_metadata.py \
            tools/parity/kyutai_candle_reference/test_collect_metadata_diagnostics.py \
            tools/parity/kyutai_candle_reference/test_collect_metadata.py \
            tools/parity/kyutai_candle_reference/test_candle_metadata_workflow_contract.py
          uv run --no-project --python 3.12 python -m unittest discover \
            -s tools/parity/kyutai_candle_reference \
            -p 'test_*metadata*.py' -v

      - name: Install the minimal pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.99.0

      - name: Verify the Linux host and toolchain
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(rustc --version | cut -d' ' -f2)" = 1.99.0
          test "$(rustc -vV | awk '$1 == "host:" { print $2 }')" = x86_64-unknown-linux-gnu

      - name: Capture source-only Cargo metadata
        env:
          VOKRA_CANDLE_REMOTE_LINUX: "1"
        run: |
          set -euo pipefail
          capture_root="$RUNNER_TEMP/vokra-candle-source-metadata-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$capture_root"
          test ! -L "$capture_root"
          uv run --no-project --python 3.12 python \
            tools/parity/kyutai_candle_reference/collect_metadata.py \
            "$capture_root" --deadline-seconds 480

      - name: Check the bounded evidence set
        if: always()
        run: |
          set -euo pipefail
          capture_root="$RUNNER_TEMP/vokra-candle-source-metadata-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          missing=0
          for relative in \
            source_receipt.json \
            source/rust/Cargo.lock \
            base/Cargo.lock \
            patched/Cargo.lock \
            initial_metadata.json \
            whole_lock_metadata.json \
            metadata.json; do
            if [ ! -f "$capture_root/$relative" ]; then
              echo "::error file=$relative::missing required capture evidence"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Upload exact bounded evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kyutai-candle-source-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/vokra-candle-source-metadata-${{ github.run_id }}-${{ github.run_attempt }}/source_receipt.json
            ${{ runner.temp }}/vokra-candle-source-metadata-${{ github.run_id }}-${{ github.run_attempt }}/source/rust/Cargo.lock
            ${{ runner.temp }}/vokra-candle-source-metadata-${{ github.run_id }}-${{ github.run_attempt }}/base/Cargo.lock
            ${{ runner.temp }}/vokra-candle-source-metadata-${{ github.run_id }}-${{ github.run_attempt }}/patched/Cargo.lock
            ${{ runner.temp }}/vokra-candle-source-metadata-${{ github.run_id }}-${{ github.run_attempt }}/initial_metadata.json
            ${{ runner.temp }}/vokra-candle-source-metadata-${{ github.run_id }}-${{ github.run_attempt }}/whole_lock_metadata.json
            ${{ runner.temp }}/vokra-candle-source-metadata-${{ github.run_id }}-${{ github.run_attempt }}/metadata.json
          if-no-files-found: error
          retention-days: 1
