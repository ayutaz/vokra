# Vokra benchmark dashboard publish — X-06-T16.
#
# Runs the stdlib-only generator (tools/bench/build_dashboard.py) over the
# committed perf corpus and publishes a single self-contained static page
# (deliverables.md:132). Two outputs:
#   1. ALWAYS: the page uploaded as a build artifact (downloadable without
#      any repo settings change).
#   2. GATED: a GitHub Pages deploy, which needs the owner to enable Pages in
#      repo settings (red-line 6) AND set repo variable VOKRA_PAGES_ENABLED=true.
#      Until then the deploy job is skipped — the artifact is still produced.
#
# No cron (takes no ladder slot). Zero-dep: stdlib-only Python run through uv; a
# `git diff --exit-code Cargo.lock` guard keeps the root lockfile honest even
# though this job never touches cargo.

name: dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/bench-baselines/**"
      - "docs/perf/**"
      - "docs/benchmarks/**"
      - "tools/bench/build_dashboard.py"
      - "tools/bench/test_build_dashboard.py"
      - ".github/workflows/dashboard.yml"

permissions:
  contents: read

concurrency:
  group: dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      # Pin the action revision rather than a moving major tag. The stdlib-only
      # scripts below still run through uv so every Python invocation follows
      # the repository's package-manager policy.
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Oracle the generator (stdlib-only, fast)
        run: |
          uv run --no-project python tools/bench/test_build_dashboard.py
          uv run --no-project python tools/bench/test_baseline_gate.py

      - name: Generate the dashboard + verify it is self-contained
        run: |
          set -euo pipefail
          mkdir -p site
          uv run --no-project python tools/bench/build_dashboard.py \
            --self-check \
            --stamp "$(date -u +%Y-%m-%dT%H:%M:%SZ) (${GITHUB_SHA})" \
            --out site/index.html

      - name: Upload dashboard artifact (always available)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vokra-benchmark-dashboard
          path: site/index.html
          retention-days: 30

      - name: Upload GitHub Pages artifact (consumed by the gated deploy job)
        if: vars.VOKRA_PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site

      - name: Guard the root Cargo.lock (NFR-DS-02)
        if: always()
        run: git diff --exit-code Cargo.lock

  # GATED deploy: fires only after the owner enables Pages in repo settings
  # (red-line 6) and sets VOKRA_PAGES_ENABLED=true. Skipped otherwise — the
  # build artifact above is the interim publish surface.
  deploy:
    name: deploy to GitHub Pages (owner-gated)
    needs: build
    if: vars.VOKRA_PAGES_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
