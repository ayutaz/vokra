# Vokra CI required core (NFR-MT-07; current context list is maintained in
# `.github/workflows/README.md` §1 and verified through branch protection).
#
# Split (2026-07-23, chore/ci-cd-reorg-2026-07-23):
#
#   * .github/workflows/ci.yml         — this file. Required branch-protection
#                                        checks (build / test / fmt / clippy /
#                                        parity / license) plus the parity
#                                        matrix aggregator and the artifact
#                                        chain that feeds unity-package +
#                                        python-wheel-build (ios-build /
#                                        unity-package / python-wheel-build).
#                                        These four must stay in one workflow
#                                        file because GitHub Actions artifacts
#                                        do not cross workflow-run boundaries
#                                        cheaply.
#
#   * .github/workflows/ci-quality.yml — advisory lint / audit / doc-drift /
#                                        server-compat surface. Nothing here
#                                        is (yet) branch-protection required.
#
#   * .github/workflows/ci-platform.yml — platform build / RTF regression /
#                                        server-deployment / GPU backend /
#                                        cross-target audit. Nothing here is
#                                        (yet) branch-protection required.
#
# ############ RED-LINE ############
# Job names (build / test / fmt / clippy / parity / license) are FIXED: they
# are registered as branch-protection required checks (M0-01-T14). Matrix jobs
# expand to "build (<os>)" / "test (<os>)" check names — the matrix pattern
# `os: [ubuntu-latest, macos-latest, windows-latest]` is likewise fixed.
# The `parity-matrix` job is the matrix carrier for `parity`; it MUST stay in
# this file because `parity` needs it and cross-workflow needs do not exist.
# ##################################
#
# NFR-PF-13 5% regression gate: wired for mel-frontend task (M2-04) — lives
# in ci-platform.yml (bench-regression job).

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs of the same ref (saves runner minutes), but never
# cancel in-progress runs on main. Each split workflow keeps its own group
# name so a cancel in one file cannot cascade into the others.
concurrency:
  group: ci-required-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Build (release)
        run: cargo build --release
      # M2-11-T13 (R3): audit-trail CPU-only vokra-capi build for the UPM
      # package. `--no-default-features --features cpu` guarantees no metal /
      # cuda runtime linkage in the shipped Unity binaries (NVIDIA EULA
      # compliance, CLAUDE.md). The printf line makes the feature selection
      # discoverable in the CI log for auditors (Reviewer 3, plan §R3).
      - name: Build vokra-capi (CPU-only, UPM audit trail)
        run: |
          printf 'Package build features: --no-default-features --features cpu\n'
          cargo build --release -p vokra-capi --no-default-features --features cpu
      # X-08-T04: NFR-DS-01 "<10MB core single binary" budget gate. This lives
      # in `build` rather than `license` because it measures the artifact
      # `cargo build --release` just produced — the `license` job has neither a
      # release build nor rust-cache, so wiring it there would mean building
      # libvokra a second time. VOKRA_SIZE_SKIP_BUILD=1 reuses the artifact
      # above (the script's own header prescribes exactly this placement).
      #
      # All three OS legs run it: the script measures with `wc -c` + `tr` only
      # and probes for libvokra.dylib / libvokra.so / vokra.dll in turn, so
      # `shell: bash` (git-bash on windows-latest) covers Windows without a
      # special case. Nothing here is skipped silently — if the cdylib is
      # missing the script exits 2 rather than passing.
      - name: Binary-size budget (NFR-DS-01, <10 MiB)
        shell: bash
        env:
          VOKRA_SIZE_SKIP_BUILD: "1"
        run: bash scripts/check-binary-size.sh
      - name: Upload macOS libvokra.dylib
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vokra-capi-macos
          path: target/release/libvokra.dylib
          retention-days: 7
      - name: Upload Windows vokra.dll
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vokra-capi-windows
          path: target/release/vokra.dll
          retention-days: 7
      - name: Upload Linux libvokra.so
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vokra-capi-linux
          path: target/release/libvokra.so
          retention-days: 7

  test:
    name: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Test (workspace)
        run: cargo test --workspace

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt
      - name: rustfmt check
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

  # iOS build scaffold (M2-02, NFR-RL-03 static-only, NFR-RL-05 JIT-free,
  # FR-EX-08 no silent fallback). Cross-compiles vokra-capi to the 3 Apple
  # triples (device arm64 + simulator arm64/x86_64), assembles
  # `Vokra.xcframework` (2 slices: device + fat sim, static libvokra.a per
  # slice), and confirms the Swift Package resolves. As of 2026-08-18 this is
  # an advisory artifact-producing job, not one of the 10 branch-protection
  # contexts. cbindgen header drift is caught before the
  # cross-compile via `gen-c-abi.sh --check` (M2-02 T08/R3). Simulator boot is
  # deferred to an optional/nightly follow-up job (`ios-smoke-simulator`, D9);
  # physical iPhone RTF (NFR-PF-03) is owned by M2-14. CUDA is unconditionally
  # off for iOS (T04 red-line + `cfg(target_os = "ios")` compile_error in
  # `vokra-backend-cuda`); Metal is on via `vokra-models/metal`. No new
  # third-party crate deps — cbindgen stays build-only (MPL-2.0, D6) and the
  # zero-dep invariant (NFR-DS-02) is unchanged.
  #
  # Location: kept in ci.yml (not ci-platform.yml) because `unity-package`
  # `needs: [build, ios-build]` — the artifact chain from ios-build feeds
  # unity-package, and cross-workflow needs / artifact downloads are not
  # cheaply supported by GitHub Actions.
  ios-build:
    name: ios-build
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install rustup iOS targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
      - name: Install cbindgen
        run: cargo install cbindgen --locked
      - name: Verify C header drift (gen-c-abi --check, R3)
        run: scripts/gen-c-abi.sh --check
      - name: Build iOS XCFramework
        run: scripts/build-ios.sh
      - name: Verify XCFramework (static-only, symbol whitelist)
        run: scripts/verify-ios-xcframework.sh build/ios/Vokra.xcframework
      - name: Verify Swift Package resolves
        run: swift package describe
      - name: Upload XCFramework artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Vokra-xcframework
          path: build/ios/Vokra.xcframework
          retention-days: 7

  # Numerical parity harness (NFR-QL-01). At M0 this runs the tests/parity
  # placeholder harness; real per-model parity tests are added by M0-04/05/06.
  # M2-04: matrix expansion runs `parity_whisper` under both fusion states
  # (`VOKRA_DISABLE_FUSION=1` and `=0`) so the fused log-mel path stays
  # bit-close (FP32 atol=0.01, NFR-QL-01) to the imperative reference.
  # M2-08-T15: extends `parity` to run `quant_parity` (K-quant weight →
  # dequantize → GEMM parity against F32 reference, FP16 atol=0.01, INT8 branch
  # asserts `MinDtypeViolation`/`UnsupportedQuantPath`) and `policy_e2e` (offline
  # converter → runtime reload → `check_degradation` mel-loss 5% gate, and the
  # negative cases for Vocos/BigVGAN W8A8 rejection + HiFi-GAN opt-in verify).
  # Both are required checks so an M2-08 quant policy regression blocks the PR
  # in the same job that gates fused-frontend parity; `license` remains the
  # zero-dep enforcer (no new deps means cargo-deny continues passing).
  parity-matrix:
    name: parity-matrix
    strategy:
      fail-fast: false
      matrix:
        fusion: ["0", "1"]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      VOKRA_DISABLE_FUSION: ${{ matrix.fusion }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Numerical parity tests (tests/parity)
        run: cargo test -p vokra-parity
      - name: Whisper frontend parity (fused vs unfused)
        run: cargo test -p vokra-models --test parity_whisper
      - name: Quant parity (M2-08, K-quant dequant → GEMM, FP16 atol=0.01)
        run: cargo test -p vokra-core --test quant_parity
      # M5-06 T15: WFST decode parity against the committed real-OpenFST
      # fixtures. The `--features vokra-wfst` flag is written LITERALLY on the
      # command: without it `parity_wfst.rs` (which is `#![cfg(feature =
      # "vokra-wfst")]`) compiles to ZERO tests — a vacuous green / fabricated
      # pass. Runs only in the fusion=0 cell (wfst is fusion-independent).
      - name: WFST decode parity (M5-06, OpenFST reference, feature vokra-wfst)
        if: matrix.fusion == '0'
        run: cargo test -p vokra-core --test parity_wfst --features vokra-wfst
      # M5-06 T15: the opt-in feature must build clean under `-D warnings` and
      # must NOT perturb the zero-dep invariant (cfg-only feature, NFR-DS-02).
      - name: WFST feature gate (M5-06, build + clippy + zero-dep, feature ON)
        if: matrix.fusion == '0'
        run: |
          set -euo pipefail
          cargo clippy -p vokra-core --features vokra-wfst --all-targets -- -D warnings
          cargo test -p vokra-core --features vokra-wfst --lib
          ./scripts/check-zero-deps.sh
          # Feature ON must pull in no non-vokra crate.
          extra=$(cargo tree --color never -p vokra-core --features vokra-wfst \
            | grep -vE 'vokra-|^\[|^$' || true)
          if [ -n "$extra" ]; then
            echo "M5-06 regression: vokra-wfst pulled in non-vokra deps:" >&2
            echo "$extra" >&2
            exit 1
          fi
      # Wave D 2026-08-15: `vokra-ops` and `vokra-models` FORWARD the same
      # opt-in flag for the ITN/TN pipeline (`vokra-ops/src/itn/`). Only the two
      # FST compositions are gated — the tagged-token parser, the field-order
      # tables, the `Reorder` rewrite, the grammar container and the OpenFST
      # header probe all compile in the default build and are covered by the
      # normal `cargo test --workspace`.
      #
      # But `src/itn/compose.rs` is `#[cfg(feature = "vokra-wfst")]`, so
      # WITHOUT this step it compiles in NO CI job at all and a break there
      # would be a vacuous green — exactly the failure mode the M5-06 step above
      # was written to prevent. The flag is spelled out LITERALLY here for the
      # same reason.
      #
      # `vokra-cli` joined that forwarding chain on 2026-08-15
      # (`vokra-wfst = ["vokra-models/vokra-wfst"]`). Until then the chain
      # stopped one crate short of every shipped binary, so the loud-partial
      # the ITN pipeline prints told a CLI user to "rebuild with --features
      # vokra-wfst" and cargo answered "package `vokra-cli` does not contain
      # this feature". A third manifest edge left unbuilt is the same vacuous
      # green this comment exists to prevent, so it gets its own leg.
      # `--all-targets` is what makes that leg worth having: it reaches the
      # `#[cfg(test)]` registry in `crates/vokra-cli/src/engine.rs`, whose
      # `wetextprocessing` row asserts the feature-ON forward is real.
      - name: ITN/TN feature gate (Wave D, vokra-ops + vokra-models + vokra-cli, feature ON)
        if: matrix.fusion == '0'
        run: |
          set -euo pipefail
          cargo clippy -p vokra-ops --features vokra-wfst --all-targets -- -D warnings
          cargo test -p vokra-ops --features vokra-wfst --lib itn
          cargo clippy -p vokra-models --features vokra-wfst --all-targets -- -D warnings
          cargo test -p vokra-models --features vokra-wfst --lib wetextprocessing
          cargo clippy -p vokra-cli --features vokra-wfst --all-targets -- -D warnings
          ./scripts/check-zero-deps.sh
          # Forwarding the flag must still pull in no non-vokra crate.
          extra=$(cargo tree --color never -p vokra-ops --features vokra-wfst \
            | grep -vE 'vokra-|^\[|^$' || true)
          if [ -n "$extra" ]; then
            echo "Wave D regression: vokra-ops/vokra-wfst pulled in non-vokra deps:" >&2
            echo "$extra" >&2
            exit 1
          fi
          # Same assertion for the CLI passthrough — the binary is what ships,
          # so it is the edge where a third-party dep would actually reach a
          # user (NFR-DS-02).
          extra=$(cargo tree --color never -p vokra-cli --features vokra-wfst \
            | grep -vE 'vokra-|^\[|^$' || true)
          if [ -n "$extra" ]; then
            echo "Wave D regression: vokra-cli/vokra-wfst pulled in non-vokra deps:" >&2
            echo "$extra" >&2
            exit 1
          fi
      - name: Policy e2e (M2-08, converter → runtime → 5% mel-loss gate)
        run: cargo test -p vokra-cli --test policy_e2e
      # Audit 2026-08-10 (Rank 5): the M2-04-T09/T10 fusion pattern matchers
      # (Conv1dSnakePattern + UpsampleSnakeResidualPattern in
      # crates/vokra-core/src/ir/fusion/patterns/snake.rs) live under
      # `#[cfg(all(test, feature = "fusion-snake-stub"))]`. Without this
      # step, snake.rs compiles to ZERO cases in the required suite — a
      # silent fabricated-green. Runs only in the fusion=0 cell (this is
      # a pattern-matcher lint, not a runtime fusion switch).
      - name: Fusion snake stub pattern tests (M2-04-T09/T10, feature fusion-snake-stub)
        if: matrix.fusion == '0'
        run: cargo test -p vokra-core --features fusion-snake-stub --lib ir::fusion::patterns::snake

  # Aggregator job that fans in on the parity matrix so branch protection
  # can require a single `parity` check context instead of the per-matrix-
  # cell `parity (0)` / `parity (1)` names GitHub emits by default.
  #
  # Rationale: when a job with `strategy.matrix` runs, GitHub reports one
  # status check per matrix cell (e.g. `parity (0)`, `parity (1)`) and
  # NEVER a raw check with the bare job name (e.g. `parity`). If the
  # branch-protection required-check list references the bare name (as
  # ours does — `parity` is one of the 14 required contexts on `main`),
  # that context never gets a report and the PR stays permanently in
  # "Expected — Waiting for status to be reported" limbo.
  #
  # The classic fix: rename the matrix job (here `parity-matrix`) and add
  # a downstream job that `needs:` it and reports itself under the
  # required name. All matrix cells must pass (`needs: parity-matrix`
  # implicitly gates on ALL of them; a single cell failure short-circuits
  # this job to `skipped`, which the required-check list treats as fail).
  parity:
    name: parity
    needs: parity-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: All parity matrix cells passed
        run: echo "parity matrix (fusion=0, fusion=1) both green"

  # License / vulnerability / forbidden-dependency gate (NFR-LC-04, X-08).
  # deny.toml is owned by M0-02 (allow: Apache-2.0/MIT/BSD; deny: GPL/LGPL;
  # bans: protobuf/onnx-family crates). GPL/LGPL or onnx/protobuf deps block the PR.
  license:
    name: license
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Install uv for repository Python gates
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
      - name: Ensure Cargo.lock exists (cargo-audit requires a lockfile)
        run: |
          if [ ! -f Cargo.lock ]; then
            cargo generate-lockfile
          fi
      - name: cargo-deny (licenses / advisories / bans)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          command: check licenses advisories bans
      - name: Install cargo-audit
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: cargo-audit
      - name: cargo-audit (RustSec advisories)
        run: cargo audit
      - name: Zero-dependency invariant (NFR-DS-02)
        # The strict "only vokra-* crates in Cargo.lock" check. cargo-deny's
        # `bans` allows permitted third-party crates; this forbids ALL of them.
        # It runs in the pre-commit hook too, but the hook is bypassable
        # (`--no-verify`), so the invariant must also be enforced here.
        run: bash scripts/check-zero-deps.sh
      - name: Forbidden symbols / dependencies check
        run: bash scripts/check-forbidden-symbols.sh
      - name: Python binding C ABI drift (48-function header coverage)
        run: >-
          uv run --no-project --python 3.12 python
          bindings/python/scripts/gen-py-bindings.py --check
          --header include/vokra.h
      - name: "vokra_ops:: citation resolution (phantom-primitive tripwire)"
        # CLAUDE.md ハルシネーション厳禁, enforced mechanically. Five consecutive
        # audit rounds found comments citing `vokra_ops::` modules that have
        # never existed (`qwen2`, `beam_search`, ...), each sending the next
        # reader hunting for a module to bind against. Round 4 swept for the
        # class by hand and still missed four sites, because it covered
        # vokra-models only. A manual sweep is evidently not the control.
        #
        # Structural invariant, same family as check-zero-deps.sh — it asserts
        # that prose may not claim an op exists when it does not. Naming a
        # not-yet-landed op stays legal via the script's EXPECTED_UNLANDED
        # ledger, but every such mention must carry an honesty marker.
        # The self-test proves detection power in both directions, including a
        # regression case pinned to the verbatim historical wording (an earlier
        # draft of the gate passed it). Pure python3 + bash, no cargo.
        run: |
          bash scripts/check-ops-path-citations.sh --self-test
          bash scripts/check-ops-path-citations.sh
      - name: "vokra_<crate>:: citation resolution (all other namespaces)"
        # The sibling step above covers exactly ONE of the 21 crate namespaces.
        # Round 6 found the same defect class living in the others, unchecked:
        # `vokra_models::rnnoise_v02` (no such module, ever), five sites naming
        # `vokra_eval::dnsmos::{p808_score, p835_score}` when the binder landed
        # at `vokra_models::dnsmos_p808_p835`, and `vokra_core::restamp_provenance`
        # — wrong crate (it is in vokra-convert) AND structurally unable to do
        # the job the comment claimed for it.
        #
        # Widening also exposed a second shape the ops gate never had to model:
        # a first segment that IS a real file but a PRIVATE module, so the path
        # is unnameable from outside (`vokra_backend_cpu::dispatch`,
        # `vokra_vad_micro::math` / `::weights`, `vokra_convert::models` /
        # `::safetensors`), plus `vokra_cli::` — a binary-only crate with no
        # importable namespace at all. Resolving against the PUBLIC surface,
        # rather than "does a file of that name exist", is what finds those.
        #
        # Namespaces are discovered from the filesystem, so `vokra_status_t::`
        # and the other C ABI enum types are never mistaken for crates. The two
        # gates split the namespace set so they can never hold contradictory
        # ledgers for one identifier; this one hard-fails if its sibling goes
        # missing, so the split cannot silently become a hole again.
        # Pure python3 + bash, no cargo.
        run: |
          bash scripts/check-crate-path-citations.sh --self-test
          bash scripts/check-crate-path-citations.sh
      - name: no_std subset tripwire (Cortex-M55 Tier 3, M5-03-T15)
        # NFR-PT-03 / NFR-DS-02: the no_std(+alloc) subset (vokra-core error +
        # GGUF reader, and the vokra-vad-micro Silero forward core) must keep
        # cross-compiling for bare-metal Cortex-M55 with no `std` leak. Same
        # family as check-zero-deps.sh (a structural invariant, not a behaviour
        # test) — so it lives here, per-PR, NOT on the weekly Tier-3 platform leg
        # (.github/workflows/silero-nostd-cross-build.yml). The self-test proves
        # the compile gate still detects an injected `use std::…` (fabricated-pass
        # prevention). Cheap cross-build; a std leak is a hard failure. Promotion
        # to a required branch-protection check is an owner decision (NFR-MT-07).
        run: |
          rustup target add thumbv8m.main-none-eabihf thumbv8m.main-none-eabi
          bash scripts/check-nostd-subset.sh --self-test
          bash scripts/check-nostd-subset.sh
      - name: EnCodec weight exclusion (FR-OP-32, M3-06)
        # X-08-T03. EnCodec pretrained weights are CC-BY-NC 4.0, so they are
        # permanently excluded from the shipping tree and the official model
        # zoo (docs/license-audit.md §3). The M2-13 runtime gate catches a
        # GGUF that DECLARES an encodec arch; this is the filesystem half —
        # a stray *encodec*.{safetensors,gguf,pth,bin} anywhere under crates/
        # model_zoo/ docs/. Pure bash + find, no cargo, so it costs nothing
        # in the job that already owns licence enforcement.
        run: bash scripts/compliance/check-encodec-exclusion.sh
      - name: Workflow advisory-suffix tripwire (§8.2 canonical form)
        # .github/workflows/README.md §8.2 canonical shape for advisory steps:
        #   - name: <what> (advisory, record-only)
        #     id: <slug>
        #     continue-on-error: true
        # This tripwire greps every `continue-on-error: true` step in
        # .github/workflows/*.yml and asserts its `- name:` value contains
        # the `advisory` lexeme. Prevents the bug class caught in
        # fix/nightly-asr-wer-2026-07-23 P1 (step DOCUMENTED as advisory but
        # LEXICALLY hard-failed). Self-test runs the RED (missing suffix) and
        # GREEN (present suffix) cases against a synthetic workflow tree in
        # $RUNNER_TEMP, so a checker bug cannot manufacture a passing run.
        # HARD FAIL (not advisory) because the shape invariant is Vokra's
        # own contract, not upstream drift — a violation is a Vokra defect.
        run: |
          bash scripts/check-workflow-advisory-suffix.sh --self-test
          bash scripts/check-workflow-advisory-suffix.sh
      - name: Workflow find-hygiene tripwire (basename-glob predatory guard)
        # Prevents the `find | head` landmine class caught in commit 8832ff0
        # (nightly-asr-wer.yml RTF companion): a `find "$X" -name '*.wav' | head`
        # matches DIRECTORIES whose basename ends in `.wav` too, then the
        # caller hands a directory path to `ffmpeg -i` and crashes on every
        # successful run. This tripwire greps every workflow for such lines
        # and requires an explicit `-type f` / `-type d` / etc. Self-test
        # runs RED (bare -name) and GREEN (with -type) cases against a
        # synthetic workflow tree so a checker bug cannot silently pass.
        # HARD FAIL: shape invariant, not upstream drift.
        run: |
          bash scripts/check-find-hygiene.sh --self-test
          bash scripts/check-find-hygiene.sh
      - name: Bound-arch registry completeness gate (vokra-cli run diagnostics)
        # crates/vokra-cli/src/engine.rs BOUND_ARCHES turns "unsupported model
        # arch `X`" — a lie whenever vokra-models has a binder for X — into a
        # diagnostic naming the binding module, the library entry point and the
        # blocker class. Its doc comment says "Adding a binder? Add a row here
        # in the same commit"; nothing enforced it, and five binders (chattts,
        # deepfake_detection, lang_id_ecapa, dtln_aec, nkf_aec) went missing
        # that way — three of them in the commit that wrote the rule. The
        # in-crate test can only inspect rows that EXIST, so it cannot see a row
        # that was never written; this gate starts from the BINDERS instead and
        # fails unless every arch-shaped `&str` constant under vokra-models/src
        # is either routed by the dispatch or present in the registry. That
        # population is `pub const ARCH`, `pub const ARCH_<SUFFIX>` AND
        # `pub const EXPECTED_ARCH` — the last spelling was added 2026-08-15 and
        # is not a rounding error: 29 of the 89 constants use it, so while the
        # scan read `ARCH…` alone this gate reported a confident green over a
        # third of the binders (that is how `charsiu`, a binder with no
        # converter at all, survived four audit rounds behind it). A
        # discovery-coverage guard now fails the run if any arch-shaped
        # constant on disk falls outside the scan, so the next new spelling is
        # a loud one-time failure rather than a silently smaller
        # population. Self-test
        # runs RED (missing row) and GREEN (complete) cases plus two
        # parser guards against a synthetic tree, so a checker bug cannot
        # manufacture a passing run. HARD FAIL, like its check-find-hygiene /
        # check-workflow-advisory-suffix siblings above — a source-to-source
        # invariant of Vokra's own, not upstream drift. uv-managed Python
        # 3.12 stdlib only,
        # no cargo, so it costs nothing in this job.
        run: |
          bash scripts/check-bound-arch-coverage.sh --self-test
          bash scripts/check-bound-arch-coverage.sh
      - name: Converter <-> binder arch handshake gate
        # A model arch tag is a contract between two crates: vokra-convert
        # STAMPS `vokra.model.arch = "X"`, vokra-models READS it back with a
        # strict equality check so a foreign GGUF fails loudly instead of
        # misrouting into a wrong-shape forward (FR-EX-08). Either half alone
        # is a dead end — a converter with no reader emits GGUFs nothing can
        # load, a binder with no converter can only be fed a GGUF this repo
        # cannot produce. The sibling gate above watches a DIFFERENT edge
        # (binder -> engine.rs BOUND_ARCHES); neither direction of the
        # converter/binder handshake was watched by anything, which is how a
        # converterless `voila` binder and 21 reader-less converter arch tags
        # all survived. Several of those 21 are legitimately converter-only
        # (publish-only pass-throughs, an ELVIS-Act voice-clone bound for a
        # separate repo, a redistribution-forbidden weight, vast.ai-gated
        # multi-shard giants) — fine, but recorded NOWHERE, so every audit
        # rediscovered them as "gaps" and a real regression would drown in the
        # noise. The NO_READER / NO_CONVERTER ledgers record them with a reason
        # each and are DOUBLE-SIDED like EXPECTED_GAPS in
        # scripts/publish/check-catalog-reality.sh: an undeclared gap fails,
        # and a ledger entry whose gap has since closed also fails, so the file
        # cannot rot in either direction.
        #
        # FOUR legs now, not two. Leg (c) checks that a `convert --model
        # <slug>` printed in a binder's error text actually parses through
        # `ModelKind::from_arg` — six messages named slugs that had never been
        # accepted, which is worse than printing no recovery step. Leg (d)
        # closes the blind spot the openwakeword NO_READER entry admits in its
        # own text: matching on the arch tag proves nothing about the REST of
        # the handshake. That binder also required seven `vokra.openwakeword.*`
        # metadata keys the converter stamped none of, so every GGUF it wrote
        # failed to load while this gate stayed green — it only ever compared
        # arch literals. Round 8 fixed that instance, round 9 found a second
        # (llama_omni2), and neither the sibling gate above nor the in-crate
        # registry test can see the class. Leg (d) asserts every
        # `vokra.<group>.<key>` a REQUIRED reader looks up is stamped by some
        # converter, where "required" means the reader has no escape for its
        # absence — five suppression categories (all-or-nothing `Ok(None)`
        # groups, caller defaults, string-literal mentions, runtime-assembled
        # PREFIX constants, dead-code reserved constants) keep the 172 raw
        # literal mismatches from drowning the real ones, and every
        # suppression is counted in the output so the leg cannot go quiet
        # unnoticed. Self-test covers all four legs RED+GREEN, every stale
        # direction, each suppression category, a zero-sentinel read that must
        # NOT count as a default (the llama_omni2 discriminator), a
        # commented-out stamp, a malformed ledger line and four parser guards,
        # so a checker bug cannot manufacture a passing run. HARD FAIL, like
        # its siblings above — a source-to-source invariant of Vokra's own.
        # uv-managed Python 3.12 stdlib only, no cargo, so it costs nothing
        # in this job.
        run: |
          bash scripts/check-arch-handshake.sh --self-test
          bash scripts/check-arch-handshake.sh
      - name: Parity sidecar citation gate (cited tools/parity/*.py must exist)
        # Source under crates/ names `tools/parity/*.py` bridges constantly —
        # converter docs on flattening a torch pickle, binder error strings
        # naming which bridge to re-run, parity harnesses printing a numbered
        # fixture recipe. Those are INSTRUCTIONS: an operator types one, gets
        # `No such file or directory`, and stops trusting every other docstring
        # in the tree. Measured 2026-08-15: 109 distinct paths cited, 47 not on
        # disk, most phrased in the present tense as existing tools.
        #
        # The sharpest instance had made a parity gate permanently vacuous:
        # parity_dnsmos.rs step 3 ran `dnsmos_score_reference.py`, which has
        # never existed, so VOKRA_DNSMOS_REFERENCE_JSONL could not be produced
        # by anything, so the MOS comparison always skipped — while the module
        # doc asserted a skip is "never a fabricated pass". Its sibling
        # `dnsmos_prepare_checkpoint.py` DOES exist, so the recipe was
        # half-runnable, which is why it went unnoticed.
        #
        # The fix for a missing bridge is to correct the SENTENCE, never to
        # write the Python file — ~35 sidecars invented from unread upstream
        # formats would be fabrication at a larger scale. So this gate carries
        # no exception ledger, unlike its check-arch-handshake sibling above:
        # the exception here IS the sentence the reader sees ("a future
        # `tools/parity/x.py` (not yet written)"), and parking it in a shell
        # array would put the honesty where no operator ever looks.
        #
        # scripts/check-doc-references.sh is the wrong home — it only reads
        # published docs under docs/ and never opens crates/. Self-test covers
        # RED (unmarked missing citation, out-of-window marker, distant
        # "future", missing nested path) and GREEN (existing file, canonical
        # hedge, wrapped hedge, doc-block hedge, all 8 in-tree phrasings) plus
        # two parser guards, so a checker bug cannot manufacture a passing run.
        # HARD FAIL, like its siblings above — a source-to-source invariant of
        # Vokra's own, not upstream drift. uv-managed Python 3.12 stdlib only,
        # no cargo.
        run: |
          bash scripts/check-parity-sidecar-citations.sh --self-test
          bash scripts/check-parity-sidecar-citations.sh
      - name: Runbook path citation gate (cited paths in runbooks must exist)
        # Sibling of the parity-sidecar gate above, pointed the other way:
        # that one scans crates/ for citations OF tools/parity/*.py; this one
        # scans the RUNBOOKS (tools/parity/**/README.md, docs/handoff/*.md)
        # for citations of anything in the repo.
        #
        # Why a runbook is worth its own hard gate: the reader is an owner
        # with a rented vast.ai box billing by the minute, midway through a
        # multi-GB convert. A wrong path there costs money and an interrupted
        # job, not just confusion. Measured 2026-08-15: THREE runbooks sent
        # the owner to `scripts/vast-ai/provision.sh` (real path:
        # scripts/publish/vast-ai/provision.sh) at step 2 of an 8-step paid
        # walkthrough. The sweep that followed found the same class in
        # `sentencepiece.rs` (really spm_proto.rs), `campplus.rs` (really
        # camplus.rs — one `p`), `host_parity.rs` (renamed), and a
        # `src/kernels/*.metal` layout that has never existed in either GPU
        # backend, where kernels are inline const strings in context.rs.
        #
        # Scope is narrowed on purpose, because a gate that cries wolf on
        # placeholders gets ignored — which is worse than no gate. Only
        # repo-ANCHORED paths (scripts/ tools/ crates/ docs/ integrations/
        # .github/) are checked; globs, <angle> placeholders, YYYY-MM-DD
        # bakeoff templates, bare basenames, /root/... paths on the rented
        # box, and URLs are all out of scope by construction rather than by
        # an exception ledger. Gitignore-local citations (docs/tickets/,
        # docs/adr/) are skipped via `git check-ignore`, so the gate cannot
        # pass locally and fail in CI on citations that are perfectly correct.
        #
        # Like its sibling, it carries no exception ledger: the exception IS
        # the sentence the reader sees ("a future `path` (not yet written)").
        # Self-test covers RED (the real provision.sh defect, out-of-window
        # marker, absent directory, non-ignored absent docs/ path) and GREEN
        # (existing path, canonical/wrapped hedges, all 12 in-tree bilingual
        # phrasings, placeholders, basenames/remote paths/URLs, gitignored
        # paths) plus two parser guards, so a checker bug cannot manufacture
        # a passing run. HARD FAIL, like its siblings. uv-managed Python 3.12
        # stdlib + git
        # only, no cargo.
        run: |
          bash scripts/check-runbook-path-citations.sh --self-test
          bash scripts/check-runbook-path-citations.sh
      - name: Platform-support matrix drift check (advisory, record-only, M4-11-T08)
        id: platform-support-drift
        # Verifies that every evidence anchor cited by
        # docs/platform-support/v1.0-rc-support-matrix.md (workflow jobs, build
        # scripts, benchmark docs) still exists — so the platform-support
        # confirmation record cannot silently drift into a fabricated pass.
        # ADVISORY (continue-on-error): a drift annotates the run but does NOT
        # block the PR. Promotion to a required branch-protection check is an
        # owner decision (NFR-MT-07), mirroring gpu-vulkan-parity.yml's
        # cool-off posture. The self-test guards the parser against regression.
        # Canonical §8.2 form: name suffix "(advisory, record-only)" +
        # explicit `id:` — required by scripts/check-workflow-advisory-suffix.sh
        # (§8.2 tripwire) so a copy-paste of this block into a new workflow
        # cannot silently drop the advisory-shape discipline.
        continue-on-error: true
        run: |
          bash scripts/check-platform-support.sh --self-test
          bash scripts/check-platform-support.sh
      - name: Contributor-reference doc drift check (advisory, record-only, X-09a-T10)
        id: contributor-reference-drift
        # Verifies the two public reference documents that stand in for the
        # unpublished planning tree: docs/requirement-ids.md (the glossary
        # that lets an outside reader resolve a cited requirement ID) and
        # docs/architecture.md (the crate map). Four legs: the glossary and
        # the public docs must agree on the cited ID set in BOTH directions;
        # the en/ja glossaries must list the same IDs; every architecture
        # anchor must resolve; and the Japanese architecture twin must exist
        # and carry the same anchors. Without this, a PR can cite a new
        # requirement ID that no public reader can look up.
        # ADVISORY (continue-on-error), same posture as the platform-support
        # step above: drift annotates the run but does NOT block the PR.
        # Promotion to a required check is an owner decision (NFR-MT-07)
        # tracked by X-08-T28. The self-test guards the parsers so a checker
        # bug cannot manufacture a passing run.
        continue-on-error: true
        run: |
          bash scripts/check-doc-references.sh --self-test
          bash scripts/check-doc-references.sh
      - name: Contributor-funnel integrity check (advisory, record-only, X-05-T07)
        id: contributor-funnel-integrity
        # Checks the complete contributor funnel, including the root
        # CODE_OF_CONDUCT / SECURITY English/Japanese pairs: required files,
        # relative links, twin structure, SSOT pointers, Issue Form keys, and
        # absolute template URLs. X-05-T04 is resolved without personal
        # contact details: security uses GitHub Private Vulnerability
        # Reporting and conduct moderation uses GitHub platform controls.
        # ADVISORY (continue-on-error) like its sibling doc checks above;
        # promotion to a required check is an owner decision (NFR-MT-07).
        continue-on-error: true
        run: |
          bash scripts/check-community-docs.sh --self-test
          bash scripts/check-community-docs.sh
      - name: Owner-checklist drift check (advisory, record-only, M4-RESIDUAL-A-T01)
        id: owner-checklist-drift
        # Guards the owner hand-off surface (docs/m4-owner-verification-checklist.md,
        # docs/m3-owner-verification-checklist.md, docs/handoff/m4-19.md) against
        # two failure modes: a CLI flag name that no longer exists reappearing in
        # a procedure the owner is told to run, and a "CC reached this far" claim
        # whose cited evidence file has been renamed or deleted.
        # ADVISORY (continue-on-error): a drift annotates the run but does NOT
        # block the PR — same posture as the platform-support step above.
        # Promotion to a required branch-protection check is an owner decision
        # (NFR-MT-07). The self-test guards the parser against regression.
        continue-on-error: true
        run: |
          bash scripts/check-owner-checklist-drift.sh --self-test
          bash scripts/check-owner-checklist-drift.sh
      - name: Zoo-manifest completeness gate (hard, M5-12-T09)
        id: zoo-manifest-complete
        # GA DoD item 2 ("all zoo models degrade < 5% / pass parity") is only
        # honest if the zoo model set is enumerable and complete. This gate
        # cross-references the tracked machine SoT (docs/license-audit.md's
        # ★ 公式 zoo / ⚠ 保留 rows) against the eval zoo manifest
        # (crates/vokra-eval/data/zoo/manifest.txt): every audit row must be
        # claimed by a record OR an excluded_reason record, no manifest record
        # may be a phantom, the Whisper bundle must expand to 5 sizes, and no
        # CC-BY-NC weight may appear. A silently-dropped model would make item 2
        # vacuously true for it — the exact defect this gate prevents.
        # This is a hard step inside the already-required `license` job. A
        # 2026-08-20 audit caught two stale manifest/audit mappings that had
        # been hidden by continue-on-error; catalog completeness and the NC
        # exclusion are release-safety invariants, not observational signals.
        # The self-test guards the parser so a checker bug cannot manufacture
        # a passing run.
        run: |
          bash scripts/check-zoo-manifest-complete.sh --self-test
          bash scripts/check-zoo-manifest-complete.sh

  # M2-11-T13 Unity Official Plugin package assembly (FR-API-04, NFR-MT-07/08,
  # NFR-RL-02/03/04, NFR-LC-01). Assembles the `com.vokra.unity` UPM package
  # from four native artifact sources:
  #   1. iOS static libvokra.a from `ios-build` job's Vokra-xcframework
  #      artifact (device slice only, __Internal linkage, NFR-RL-03).
  #   2. Desktop cdylibs (macOS libvokra.dylib / Windows vokra.dll /
  #      Linux libvokra.so) from the `build` job's per-OS upload-artifact
  #      steps (audit-trail CPU-only per plan §R3).
  #   3. Android arm64-v8a libvokra.so cross-compiled here via NDK.
  # Then runs structure lint (jq on package.json + asmdefs, find shape
  # assertion under Plugins/), the NVIDIA runtime non-bundle check (plan §R3
  # / third_party/NVIDIA-EULA.md "installed only in a private (non-shared)
  # directory location"), and the UPM dependencies check (.dependencies=={},
  # no Sentis reference — zero-dep discipline for the Unity surface too).
  # Uploads the assembled UPM `.tgz` as `Vokra-unity-package` (retention 14d)
  # so the release train can promote the same tarball to GitHub Releases /
  # OpenUPM (release.yml companion job, T14). As of 2026-08-18 this is an
  # advisory artifact-producing job and is not a branch-protection context.
  # IL2CPP Player build is deferred to a nightly
  # workflow (game-ci) because Unity licensing isn't available on the
  # per-PR path — the shape lint here catches every regression a Unity
  # Editor open would also catch (asmdef parse, plugin layout, package.json
  # schema) without needing the Editor.
  #
  # Location: kept in ci.yml (not ci-platform.yml) because `needs: [build,
  # ios-build]` — the two producers upload per-OS artifacts that this job
  # downloads, and cross-workflow artifact downloads are not cheaply
  # supported by GitHub Actions.
  unity-package:
    name: unity-package
    needs: [build, ios-build]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
      - name: Download Vokra-xcframework (from ios-build)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: Vokra-xcframework
          path: build/ios/Vokra.xcframework
      - name: Download macOS libvokra.dylib (from build/macos-latest)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: vokra-capi-macos
          path: artifacts/macos
      - name: Download Windows vokra.dll (from build/windows-latest)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: vokra-capi-windows
          path: artifacts/windows
      - name: Download Linux libvokra.so (from build/ubuntu-latest)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: vokra-capi-linux
          path: artifacts/linux
      - name: Set up Android SDK / NDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
      - name: Android cross-build (aarch64-linux-android, CPU-only, NDK)
        # scripts/build-android.sh reads $ANDROID_NDK_HOME (populated by
        # setup-android@v3), rustup-installs the aarch64-linux-android target,
        # builds `-p vokra-capi` release cdylib with no metal/cuda features,
        # and stages the resulting libvokra.so under
        # bindings/unity/com.vokra.unity/Plugins/Android/libs/arm64-v8a/.
        run: bash scripts/build-android.sh
      - name: Extract iOS libvokra.a from Vokra.xcframework
        # collect-ios-lib.sh runs verify-ios-xcframework.sh first (plan §R4),
        # then extracts ios-arm64/libvokra.a and asserts single-arch (lipo)
        # before staging under Plugins/iOS/.
        run: bash scripts/collect-ios-lib.sh build/ios/Vokra.xcframework
      - name: Stage desktop native libs into UPM Plugins/
        run: |
          set -euo pipefail
          PKG=bindings/unity/com.vokra.unity
          mkdir -p "$PKG/Plugins/macOS" "$PKG/Plugins/Windows/x86_64" "$PKG/Plugins/Linux/x86_64"
          cp artifacts/macos/libvokra.dylib "$PKG/Plugins/macOS/libvokra.dylib"
          cp artifacts/windows/vokra.dll   "$PKG/Plugins/Windows/x86_64/vokra.dll"
          cp artifacts/linux/libvokra.so   "$PKG/Plugins/Linux/x86_64/libvokra.so"
      - name: WebGL staticlib (wasm32-unknown-emscripten — M4-02)
        # rustc-only: Unity's own Emscripten performs the final link into the
        # player wasm, so NO emsdk is needed to produce the .a (ADR M4-02 §2;
        # forced -C panic=abort inside the script — Unity-era emcc cannot
        # link rust wasm-EH objects). `llvm-tools` provides llvm-nm for the
        # script's GPU-symbol non-mixin audit (Metal/CUDA/Vulkan/WebGPU
        # tokens); the production thread-free source gate
        # (check-capi-thread-free.sh) runs inside the script as well. The
        # root Cargo.lock tripwire is also internal to the script (NFR-DS-02).
        run: |
          rustup target add wasm32-unknown-emscripten
          rustup component add llvm-tools
          bash scripts/build-unity-webgl-lib.sh
      - name: Assemble UPM package (.tgz via build-unity-plugin.sh --pack)
        run: bash scripts/build-unity-plugin.sh --pack
      - name: Assert tarball ships the WebGL slice (M4-02)
        # `--pack` tars the whole package directory, so Plugins/WebGL/ rides
        # along automatically — this assert keeps that property load-bearing
        # (milestones §8 M4-02 completion: "CI 自動ビルドの Unity Package に
        # WebGL ターゲットが含まれる").
        run: |
          set -euo pipefail
          TARBALL="$(ls bindings/unity/com.vokra.unity-*.tgz)"
          # List ONCE into a file rather than piping `tar` into `grep -q`:
          # under `set -o pipefail`, `grep -q` exits at the first match and
          # `tar` then dies of SIGPIPE, failing the whole pipeline with
          # "tar: stdout: write error". It only trips when tar is still
          # writing when grep leaves, so it stayed latent until the package
          # grew (first observed on the M4 branch).
          LISTING="$(mktemp)"
          tar -tzf "$TARBALL" > "$LISTING"
          grep -q 'com.vokra.unity/Plugins/WebGL/libvokra.a$' "$LISTING"
          grep -q 'com.vokra.unity/Plugins/WebGL/libvokra.a.meta$' "$LISTING"
          rm -f "$LISTING"
          echo "OK: $TARBALL ships Plugins/WebGL/libvokra.a (+ .meta)"
      - name: Structure lint (package.json / asmdefs / Plugins shape)
        # Fails loudly on any missing native slice, malformed JSON in the two
        # asmdefs, or missing package.json — catches drift before the Unity
        # Editor would (which we cannot run per-PR).
        run: |
          set -euo pipefail
          PKG=bindings/unity/com.vokra.unity
          jq . "$PKG/package.json"                 > /dev/null
          jq . "$PKG/Runtime/Vokra.Runtime.asmdef" > /dev/null
          jq . "$PKG/Editor/Vokra.Editor.asmdef"   > /dev/null
          test -f "$PKG/Plugins/macOS/libvokra.dylib"
          test -f "$PKG/Plugins/Windows/x86_64/vokra.dll"
          test -f "$PKG/Plugins/Linux/x86_64/libvokra.so"
          test -f "$PKG/Plugins/iOS/libvokra.a"
          test -f "$PKG/Plugins/Android/libs/arm64-v8a/libvokra.so"
          test -f "$PKG/Plugins/WebGL/libvokra.a"
          # Hand-authored PluginImporter .meta lint (macOS/Win/Linux/WebGL —
          # M4-02 added the WebGL case). Keep Python tool execution isolated
          # and reproducible through uv rather than the runner's global site.
          uv run --no-project --python 3.12 --with pyyaml python -c 'import yaml'
          bash scripts/check-plugin-meta.sh
          find "$PKG/Plugins" -type f
      - name: NVIDIA runtime non-bundle check (third_party EULA, plan §R3)
        run: bash scripts/check-unity-package-no-nvidia.sh bindings/unity/com.vokra.unity
      - name: UPM dependencies check (.dependencies=={} & no Sentis)
        run: bash scripts/check-unity-package-deps.sh bindings/unity/com.vokra.unity
      - name: Upload UPM package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Vokra-unity-package
          path: bindings/unity/com.vokra.unity-*.tgz
          retention-days: 14

  # M2-12-T15 Python wheel build gate. The reusable workflow compiles each
  # native library on the platform claimed by its wheel, repairs external
  # dependencies, verifies archive metadata/architecture, and emits one exact
  # four-wheel manifest. The aggregator preserves the established advisory
  # check name used by CI documentation and historical runs.
  python-native-wheels:
    name: python-native-wheels
    uses: ./.github/workflows/python-wheels.yml
    with:
      version: "0.1.0.dev0"

  python-wheel-build:
    name: python-wheel-build
    needs: python-native-wheels
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Propagate reusable wheel workflow result
        env:
          WHEEL_WORKFLOW_RESULT: ${{ needs.python-native-wheels.result }}
        run: |
          set -euo pipefail
          if [ "$WHEEL_WORKFLOW_RESULT" != "success" ]; then
            echo "Python native wheel workflow ended with: $WHEEL_WORKFLOW_RESULT" >&2
            exit 1
          fi
          echo "Python native wheel workflow completed successfully."
