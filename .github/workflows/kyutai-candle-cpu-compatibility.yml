name: Kyutai Candle CPU compatibility (one-shot)

on:
  pull_request:
    types: [labeled]
    paths:
      - '.github/workflows/kyutai-candle-cpu-compatibility.yml'
      - 'tools/parity/kyutai_candle_reference/check_cpu_compatibility.py'
      - 'tools/parity/kyutai_candle_reference/audit_lock.py'
      - 'tools/parity/kyutai_candle_reference/test_cpu_compatibility.py'
      - 'tools/parity/kyutai_candle_reference/apply_paste_overlay.py'
      - 'tools/parity/kyutai_candle_reference/collect_metadata.py'
      - 'tools/parity/kyutai_candle_reference/pin_remediation_diagnostic.py'
      - 'tools/parity/kyutai_candle_reference/prepare_paste_overlay.py'
      - 'tools/parity/kyutai_candle_reference/current_artifact.py'
      - 'tools/parity/kyutai_candle_reference/test_current_artifact.py'
      - '.github/workflows/kyutai-candle-paste-application.yml'
      - 'docs/handoff/kyutai-candle-paste-parents-source-2026-10-15.json'
      - 'docs/handoff/kyutai-candle-pastey-source-2026-10-15.json'
      - 'docs/handoff/kyutai-candle-candidate-2026-10-15.lock'
      - 'docs/handoff/kyutai-candle-current-cpu-evidence-2026-10-16.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: kyutai-candle-cpu-compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  source-application:
    name: current source-only Candle producer
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'candle-cpu-compatibility-confirm-once-20261016' &&
      github.event.pull_request.number == 255 &&
      github.run_attempt == 1 &&
      github.repository == 'ayutaz/vokra' &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/kyutai-candle-paste-application.yml
    with:
      caller: cpu-compatibility
    permissions:
      contents: read
      actions: read

  cpu-compatibility:
    name: Linux CPU library compatibility (one-shot, no model execution)
    needs: source-application
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'candle-cpu-compatibility-confirm-once-20261016' &&
      github.event.pull_request.number == 255 &&
      github.run_attempt == 1 &&
      github.repository == 'ayutaz/vokra' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact compatibility inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/kyutai-candle-cpu-compatibility.yml
            .github/workflows/kyutai-candle-paste-application.yml
            tools/parity/kyutai_candle_reference/check_cpu_compatibility.py
            tools/parity/kyutai_candle_reference/audit_lock.py
            tools/parity/kyutai_candle_reference/test_cpu_compatibility.py
            tools/parity/kyutai_candle_reference/apply_paste_overlay.py
            tools/parity/kyutai_candle_reference/collect_metadata.py
            tools/parity/kyutai_candle_reference/pin_remediation_diagnostic.py
            tools/parity/kyutai_candle_reference/prepare_paste_overlay.py
            tools/parity/kyutai_candle_reference/current_artifact.py
            tools/parity/kyutai_candle_reference/test_current_artifact.py
            docs/handoff/kyutai-candle-paste-parents-source-2026-10-15.json
            docs/handoff/kyutai-candle-pastey-source-2026-10-15.json
            docs/handoff/kyutai-candle-candidate-2026-10-15.lock
            docs/handoff/kyutai-candle-current-cpu-evidence-2026-10-16.json

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: 0.8.17

      - name: Bootstrap Python 3.12
        shell: bash
        run: uv python install 3.12

      - name: Install pinned Rust 1.99 toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.99.0

      - name: Download current-run source application evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          repository: ayutaz/vokra
          artifact-ids: ${{ needs.source-application.outputs.primary_artifact_id }}
          digest-mismatch: error
          path: ${{ runner.temp }}/candle-application-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Download current-run evidence envelope
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          repository: ayutaz/vokra
          artifact-ids: ${{ needs.source-application.outputs.envelope_artifact_id }}
          digest-mismatch: error
          path: ${{ runner.temp }}/candle-current-envelope-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Recheck authenticated CPU fixture offline
        env:
          VOKRA_CPU_APPLICATION_ROOT: ${{ runner.temp }}/candle-application-${{ github.run_id }}-${{ github.run_attempt }}
          VOKRA_CPU_APPLICATION_ENVELOPE: ${{ runner.temp }}/candle-current-envelope-${{ github.run_id }}-${{ github.run_attempt }}/envelope.json
          UV_OFFLINE: '1'
          UV_CACHE_DIR: ${{ runner.temp }}/vokra-uv-cache
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-project --offline --python 3.12 python tools/parity/kyutai_candle_reference/test_cpu_compatibility.py --self-test

      - name: Build and probe actual CPU library once
        id: compatibility
        env:
          UV_OFFLINE: '1'
          UV_CACHE_DIR: ${{ runner.temp }}/vokra-uv-cache
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          VOKRA_CANDLE_REMOTE_LINUX: '1'
          VOKRA_CANDLE_WORKFLOW_HEAD: ${{ github.event.pull_request.head.sha }}
          VOKRA_CANDLE_CURRENT_RUN_ID: ${{ github.run_id }}
          VOKRA_CANDLE_CURRENT_RUN_ATTEMPT: ${{ github.run_attempt }}
          VOKRA_CANDLE_CURRENT_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          VOKRA_CANDLE_CURRENT_WORKFLOW_SHA: ${{ github.workflow_sha }}
          VOKRA_CANDLE_CURRENT_RUN_REF: ${{ github.ref }}
          VOKRA_CANDLE_CURRENT_CALLER: cpu-compatibility
          VOKRA_CANDLE_PRODUCER_SOURCE_HEAD: ${{ needs.source-application.outputs.source_head }}
          VOKRA_CANDLE_PRODUCER_WORKFLOW_SHA: ${{ needs.source-application.outputs.workflow_sha }}
          VOKRA_CANDLE_PRODUCER_RUN_REF: ${{ needs.source-application.outputs.run_ref }}
          VOKRA_CANDLE_PRODUCER_CALLER: ${{ needs.source-application.outputs.caller }}
          VOKRA_CANDLE_CURRENT_ARTIFACT_ID: ${{ needs.source-application.outputs.primary_artifact_id }}
          VOKRA_CANDLE_CURRENT_ARTIFACT_NAME: ${{ needs.source-application.outputs.primary_artifact_name }}
          VOKRA_CANDLE_CURRENT_ARTIFACT_DIGEST: ${{ needs.source-application.outputs.primary_artifact_digest }}
          VOKRA_CANDLE_CURRENT_ENVELOPE_ID: ${{ needs.source-application.outputs.envelope_artifact_id }}
          VOKRA_CANDLE_CURRENT_ENVELOPE_NAME: ${{ needs.source-application.outputs.envelope_artifact_name }}
          VOKRA_CANDLE_CURRENT_ENVELOPE_DIGEST: ${{ needs.source-application.outputs.envelope_artifact_digest }}
        shell: bash
        run: |
          set +e
          run_root="$RUNNER_TEMP/candle-cpu-compatibility-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$run_root"
          uv run --no-project --python 3.12 python \
            tools/parity/kyutai_candle_reference/check_cpu_compatibility.py \
            --application-root "$RUNNER_TEMP/candle-application-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --envelope "$RUNNER_TEMP/candle-current-envelope-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/envelope.json" \
            --output "$run_root/compatibility.json" \
            --deadline-seconds 900
          rc=$?
          echo "compatibility_rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Upload bounded compatibility receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kyutai-candle-cpu-compatibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candle-cpu-compatibility-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 1
