name: kyutai-candle-source-advisory

# The historical source-only producer is retained for evidence recovery and
# manual reruns. Its fixed diagnostic is not a current PR gate; the applied
# profile below is the current pull-request audit.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: kyutai-candle-source-advisory
  cancel-in-progress: true

jobs:
  source-advisory:
    name: source-only Candle advisory evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout bounded first-party wrapper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/workflows/kyutai-candle-source-advisory.yml
            .github/workflows/kyutai-candle-candidate-advisory.yml
            .github/workflows/kyutai-candle-applied-advisory.yml
            tools/parity/kyutai_candle_reference/audit_lock.py
            tools/parity/kyutai_candle_reference/test_audit_lock.py
          sparse-checkout-cone-mode: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.8.17"

      - name: Install Python 3.12 for stdlib checks
        run: uv python install 3.12

      - name: Run bounded wrapper self-tests
        env:
          UV_OFFLINE: "1"
        run: |
          set -euo pipefail
          uv run --no-project --offline --python 3.12 \
            tools/parity/kyutai_candle_reference/test_audit_lock.py --self-test

      - name: Download exact producer artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: "11951567227"
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38690241603
          path: ${{ runner.temp }}/vokra-candle-source-advisory-artifact
          digest-mismatch: error

      - name: Checkout pinned RustSec advisory database
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: RustSec/advisory-db
          ref: edb58f5974b83eb8302332821cb6d389777aa351
          fetch-depth: 1
          path: .audit/rustsec-advisory-db
          persist-credentials: false

      - name: Install pinned cargo-audit without source-build fallback
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8
        with:
          tool: cargo-audit@0.22.2
          fallback: none

      - name: Run source-only advisory audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UV_OFFLINE: "1"
        run: |
          set -euo pipefail
          audit_root="$RUNNER_TEMP/vokra-candle-source-advisory-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          audit_cwd="$RUNNER_TEMP/vokra-candle-audit-cwd-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cargo_home="$RUNNER_TEMP/vokra-candle-audit-cargo-home-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          report="$audit_root/advisory-report.json"
          test ! -e "$audit_root"
          mkdir -p "$audit_root" "$audit_cwd" "$cargo_home"
          test ! -e "$audit_cwd/.cargo/audit.toml"
          test ! -e "$cargo_home/audit.toml"
          set +e
          uv run --no-project --offline --python 3.12 \
            tools/parity/kyutai_candle_reference/audit_lock.py \
            --artifact-root "$RUNNER_TEMP/vokra-candle-source-advisory-artifact" \
            --db "$GITHUB_WORKSPACE/.audit/rustsec-advisory-db" \
            --cwd "$audit_cwd" \
            --cargo-home "$cargo_home" \
            --output "$report" \
            --repository "$GITHUB_REPOSITORY" \
            --deadline-seconds 480
          rc=$?
          set -e
          test -f "$report"
          echo "advisory_wrapper_returncode=$rc"
          exit "$rc"

      - name: Upload bounded advisory evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kyutai-candle-source-advisory-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vokra-candle-source-advisory-${{ github.run_id }}-${{ github.run_attempt }}/advisory-report.json
          if-no-files-found: error
          retention-days: 1
