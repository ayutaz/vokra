# Vokra SBV2 (Style-Bert-VITS2 v2) real-checkpoint parity CI (SBV2 v2 plan
# Task 35; design doc `docs/superpowers/specs/2026-07-26-sbv2-v2-design.md`
# §10 "parity CI + fixture" / "CI workflow").
#
# Sibling of `.github/workflows/parity-whisper-real.yml` and
# `.github/workflows/parity-kokoro-real.yml`: a real Rust parity test
# (`crates/vokra-models/tests/parity_sbv2_real.rs`, Task 28; `#[ignore]`
# removed by WP-06 on 2026-08-11) needs a
# real, non-Apache-2.0-licensed checkpoint family this repo can never commit
# as binary fixtures. `tests/fixtures/sbv2/README.md` (Task 34) is the
# owner recipe this workflow automates end to end: download the SBV2 v2
# base (AGPL-3.0) + DeBERTa v2 JA (cc-by-sa-4.0) + DeBERTa v3 EN (MIT)
# checkpoints, convert each to GGUF, regenerate the Python reference dump,
# then run the Rust parity test against the freshly-built GGUFs. An explicit
# `include_zh=true` dispatch adds the Apache-2.0 Chinese RoBERTa checkpoint
# and exercises the four-file ZH numerical leg; the default recurring JA leg
# remains unchanged.
#
# ## Gating (sidecar-hash gate, fabricated-pass prevention)
#
# `tests/fixtures/sbv2/*.gguf.sha256` were originally comment-only
# PLACEHOLDER files. They now carry real hashes from the completed owner
# recipe. The setup job checks the three current JA-path sidecars by default
# and also requires the fourth ZH sidecar for an explicit ZH run — design doc
# §10's own YAML sketch illustrates the gate against
# only `sbv2-v2-multilingual-base.gguf.sha256`, but `SbV2Model::from_gguf`
# takes all three checkpoints (`main` + `bert_ja` + `bert_en`) to even
# construct the default model, and the README's recipe updates every selected
# sidecar together in one step ("4. Hash and commit") — so gating on the full set is
# a faithful, deliberate extension of the sketch's intent, not a deviation
# from it. That README's own "Placeholder format" section already
# anticipates exactly this: "A future workflow built from that sketch stays
# correctly gated off (`fixtures_present=false`) against these files"
# (plural — the complete selected bundle).
#
# If any sidecar is absent or deliberately reset to a placeholder, the
# `parity` job below is skipped entirely — an FR-EX-08 explicit, annotated
# skip, never a silent no-op and never a fabricated pass.
#
# ## Honest failure while the gate is open (vendoring landed; workflow now
# ## fails LOUDLY on any dumper error, no `set +e` cover-up)
#
# Wave-4 TASK-34-DUMPER (2026-08-09): Task 4's VITS vendoring landed —
# `tools/parity/vendor/vits/{text_encoder,coupling,flow,decoder,attentions,
# commons,modules,transforms}.py` are all in place, and the dumper's
# `run_pipeline_body` (design doc §7, 15 steps) is fully wired. Once the
# checkpoint-sidecar gate opens, the dumper is EXPECTED to succeed (writes
# 11 tensor `.bin` for JA, or 12 for ZH, + 4 fixture `.bin` + 4 flow-tap `.bin` +
# `reference_dump.manifest.json` to `tests/fixtures/sbv2/reference_dump/`).
# Any nonzero exit from the dumper
# is now a REAL failure, not a documented deferral — the tail-position
# "Fail if ..." step propagates it and the job goes red. The Rust parity
# test step still runs `if: always()` for diagnostic value (loading the
# freshly-converted GGUFs even if the dump failed), but its outcome does
# not mask the dumper's exit.
#
# ## Clean-room reminder
#
# Nothing this workflow runs was built by reading
# `github.com/litagin02/Style-Bert-VITS2` (AGPL-3.0),
# `github.com/fishaudio/Bert-VITS2` (AGPL-3.0), or any fork/derivative of
# either — see design doc §6 and `tests/fixtures/sbv2/README.md`'s own
# "Clean-room reminder" section for the full permissive-source allow-list
# this workflow's downstream tools inherit.
#
# ## Zero-dependency invariant (NFR-DS-02)
#
# The whole run must not mutate the root workspace `Cargo.lock` — Python
# deps live in a job-scoped uv environment under `/tmp`; `vokra-cli convert`
# operates on already-checked-in workspace code. The final `git diff --exit-code
# Cargo.lock` guard (mirrors parity-whisper-real.yml / parity-kokoro-real.yml)
# catches any accidental drift.
#
# ## Not a required check
#
# Like its two siblings, this workflow is opt-in (workflow_dispatch + weekly
# cron + a narrow pull_request paths filter) and is not registered in
# branch-protection required checks. Promotion is an owner decision after
# consecutive green runs — and, concretely for SBV2, only possible after the
# VITS vendoring follow-up lands (see above).
#
# ## Schedule slot
#
# Design doc §10's sketch uses `cron: '0 4 * * 1'` — but that is
# `parity-kokoro-real.yml`'s own existing Monday-04:00-UTC slot, and
# `parity-whisper-real.yml` already documents why IT offset itself by an
# hour to `0 5 * * 1` ("avoids GH Actions cron collisions with the Kokoro
# job and spreads HF hub load across the hour"). This workflow followed the
# same precedent — first '0 6 * * 1', then '15 7 * * 1' (2026-07-27) once
# `gpu-cuda-rtf.yml` (06:00) and `web-wasm.yml` (07:00) fully booked the
# adjacent :00 slots and `check-workflow-hygiene.sh` started flagging
# collisions. 07:15 is the closest free slot to the design-doc sketch, in
# between web-wasm (07:00) and parity-moshi-real (07:30).

name: parity-sbv2-real

on:
  workflow_dispatch:
    inputs:
      include_zh:
        description: >-
          Run the four-file ZH leg (main + JA/EN/ZH BERT) instead of the
          existing JA leg. Default false keeps the recurring workload unchanged.
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    - cron: '15 7 * * 1'
  pull_request:
    # Paths reflect the files Tasks 25-34 actually landed under, not design
    # doc §10's illustrative sketch (`tests/parity/parity_sbv2_*`, written
    # before the SBV2 crate layout existed — the real parity test lives at
    # `crates/vokra-models/tests/parity_sbv2_real.rs`).
    paths:
      - '.github/workflows/parity-sbv2-real.yml'
      - 'crates/vokra-bert/**'
      - 'crates/vokra-convert/src/models/deberta_v2.rs'
      - 'crates/vokra-convert/src/models/deberta_v3.rs'
      - 'crates/vokra-convert/src/models/sbv2.rs'
      - 'crates/vokra-core/**'
      - 'crates/vokra-models/src/compute.rs'
      - 'crates/vokra-models/src/sbv2/**'
      - 'crates/vokra-models/tests/parity_sbv2_real.rs'
      - 'crates/vokra-ops/**'
      - 'tests/fixtures/sbv2/**'
      - 'tools/parity/sbv2_dump_reference.py'
      - 'tools/parity/sbv2_prepare_checkpoint.py'
      - 'tools/parity/sbv2/pyproject.toml'
      - 'tools/parity/sbv2/uv.lock'
      - 'tools/parity/vendor/vits/**'
      - 'tools/parity/vendor/vits2/**'

permissions:
  contents: read

# Mirrors parity-kokoro-real.yml: a one-shot HF DL + convert + dump + parity
# run with no side effects that outlive the workspace, so cancelling a
# superseded run on a rapid re-push is always safe.
concurrency:
  group: parity-sbv2-real-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PARITY_PROJECT: tools/parity/sbv2
  UV_PROJECT_ENVIRONMENT: /tmp/vokra-sbv2-parity

jobs:
  # Sidecar-hash gate (see header comment). Never fails: gate-closed is an
  # expected, valid, honestly-annotated state, not an error — only the
  # `fixtures_present` output communicates the verdict to the `parity` job.
  setup:
    name: setup
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      fixtures_present: ${{ steps.check.outputs.present }}
      run_zh: ${{ steps.mode.outputs.run_zh }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select JA or explicit four-file ZH leg
        id: mode
        env:
          DISPATCH_ZH: ${{ inputs.include_zh }}
          SCHEDULE_ZH: ${{ vars.VOKRA_SBV2_ZH_ENABLE }}
        shell: bash
        run: |
          set -euo pipefail
          run_zh=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${DISPATCH_ZH:-false}" = "true" ]; then
            run_zh=true
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "${SCHEDULE_ZH:-0}" = "1" ]; then
            run_zh=true
          fi
          echo "run_zh=${run_zh}" >> "$GITHUB_OUTPUT"
          if [ "$run_zh" = "true" ]; then
            echo "SBV2 parity language: ZH"
          else
            echo "SBV2 parity language: JA"
          fi
      - name: Detect real fixture sidecars (sidecar-hash gate)
        id: check
        env:
          RUN_ZH: ${{ steps.mode.outputs.run_zh }}
        shell: bash
        run: |
          set -euo pipefail
          DIR=tests/fixtures/sbv2
          all_present=true
          reasons=()
          required=(
            "$DIR/sbv2-v2-multilingual-base.gguf.sha256" \
            "$DIR/deberta-v2-large-japanese-char-wwm.gguf.sha256" \
            "$DIR/deberta-v3-large.gguf.sha256"
          )
          if [ "$RUN_ZH" = "true" ]; then
            required+=("$DIR/chinese-roberta-wwm-ext-large.gguf.sha256")
          fi
          for f in "${required[@]}"; do
            if [ -s "$f" ] && ! grep -q "placeholder" "$f"; then
              continue
            fi
            all_present=false
            reasons+=("$f is absent, empty, or still a placeholder")
          done
          if [ "$all_present" = "true" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "### parity-sbv2-real fixture gate: OPEN (${#required[@]} sidecars real)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            {
              echo "### parity-sbv2-real fixture gate: CLOSED (clean skip)"
              echo ""
              echo "Expected state until an owner completes \`tests/fixtures/sbv2/README.md\`'s recipe:"
              echo ""
              for r in "${reasons[@]}"; do
                echo "- $r"
              done
              echo ""
              echo "FR-EX-08 explicit skip — not a synthetic fallback, not a fabricated pass."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::parity-sbv2-real: fixture gate closed (see step summary) — parity job will be skipped"
          fi

  parity:
    name: parity-sbv2-real
    needs: setup
    if: needs.setup.outputs.fixtures_present == 'true'
    runs-on: ubuntu-latest
    # HF DL (SBV2 base + 2 DeBERTa-large encoders) + 3x convert + dump +
    # cargo test. Generous cap matching the whisper large-v3 / kokoro legs
    # (multi-GB checkpoint class); a truly stuck run is still bounded.
    timeout-minutes: 60
    env:
      SBV2_HF_REPO: litagin/Style-Bert-VITS2-2.0-base-JP-Extra
      SBV2_REVISION: a731761009f3c96d104487be6ad332bf1bb5a3a5
      BERT_JA_HF_REPO: ku-nlp/deberta-v2-large-japanese-char-wwm
      BERT_JA_REVISION: 547b0e8b044fba3f9b84d0ab9f990440bd130c8b
      BERT_EN_HF_REPO: microsoft/deberta-v3-large
      BERT_EN_REVISION: 64a8c8eab3e352a784c658aef62be1662607476f
      BERT_ZH_HF_REPO: hfl/chinese-roberta-wwm-ext-large
      BERT_ZH_REVISION: a25cc9e05974bd9687e528edd516f2cfdb3f5db9
      FIXTURE_DIR: tests/fixtures/sbv2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Provision locked SBV2 upstream oracle
        # torch>=2.6 は transformers 4.57+ が `torch.load(weights_only=True)`
        # を呼ぶ際にハードチェックする ("Due to a serious vulnerability issue
        # in torch.load, even with weights_only=True, we now require users
        # to upgrade torch to at least v2.6")。CI で transformers 4.57.6 が
        # 引かれるため torch は 2.6+ でないと dumper が checkpoint load で
        # fail する。専用 uv.lock は Linux x86_64 + PyTorch CPU index に固定し、
        # hosted runner と VAST の reference oracle を同じ依存グラフにする。
        #
        # `sentencepiece` + `protobuf` は DeBERTa v3 の spm tokenizer が
        # `AutoTokenizer.from_pretrained` 経由で読める前提条件 (transformers
        # 側の PROTOBUF_IMPORT_ERROR で fail する)。dumper (sbv2_dump_reference.py)
        # は tokenize+forward の real reference を出すために両モデルの
        # AutoTokenizer を呼ぶので、v3 (spm) 側で protobuf 必須になる。
        # sibling parity-moshi-real.yml も sentencepiece を同 pattern で
        # 入れている。
        shell: bash
        run: |
          set -euo pipefail
          uv sync --project "${PARITY_PROJECT}" --frozen --python 3.12
          uv run --project "${PARITY_PROJECT}" --frozen python - <<'PYEOF'
          import huggingface_hub
          import google.protobuf
          import safetensors
          import sentencepiece
          import torch
          import transformers

          print(
              "sbv2 locked oracle: "
              f"torch={torch.__version__} "
              f"transformers={transformers.__version__} "
              f"huggingface_hub={huggingface_hub.__version__} "
              f"safetensors={safetensors.__version__} "
              f"sentencepiece={sentencepiece.__version__} "
              f"protobuf={google.protobuf.__version__}"
          )
          PYEOF

      - name: Download SBV2 v2 checkpoint + build vokra.sbv2.* config side-car
        # tools/parity/sbv2_prepare_checkpoint.py (Task 29): snapshot_download
        # + best-effort config.json -> vokra.sbv2.* mapping. Its own
        # RESOLVED/UNRESOLVED per-field report lands in this step's log.
        shell: bash
        run: |
          set -euo pipefail
          # SBV2 v2 base ships weights only (no config.json). The prep script
          # provides `--clean-room-defaults` as the author-designed escape
          # hatch for this exact case: it fills the `vokra.sbv2.*` side-car
          # from cited VITS/HiFi-GAN/StyleTTS 2 MIT reference defaults
          # instead of erroring. Without this flag CI aborts with
          # "no config.json found under ... — Pass --clean-room-defaults".
          uv run --project "${PARITY_PROJECT}" --frozen python \
            tools/parity/sbv2_prepare_checkpoint.py \
            --hf-repo "$SBV2_HF_REPO" \
            --revision "$SBV2_REVISION" \
            --output-dir "$RUNNER_TEMP/sbv2-checkpoint" \
            --clean-room-defaults

      - name: Download DeBERTa v2 (JA) + v3 (EN) checkpoints
        # Plain HF transformers-style repos (flat safetensors, no .pth to
        # flatten) — a direct snapshot_download is enough, matching
        # tests/fixtures/sbv2/README.md's own inline recipe verbatim.
        shell: bash
        run: |
          set -euo pipefail
          uv run --project "${PARITY_PROJECT}" --frozen python - <<'PYEOF'
          import os
          from huggingface_hub import snapshot_download

          snapshot_download(
              repo_id=os.environ["BERT_JA_HF_REPO"],
              revision=os.environ["BERT_JA_REVISION"],
              repo_type="model",
              local_dir=os.path.join(os.environ["RUNNER_TEMP"], "deberta-v2-ja"),
              # ku-nlp/deberta-v2-large-japanese-char-wwm ships safetensors +
              # vocab.txt (JA char-level BertJapaneseTokenizer). vocab.txt is
              # the tokenizer side-car `vokra-cli convert --model deberta-v2
              # --tokenizer <vocab.txt>` needs to stamp `vokra.bert.tokenizer.*`
              # metadata (SbertTokenizer::from_gguf hard-fails without it —
              # see run 31167865478 "missing GGUF metadata key:
              # vokra.bert.tokenizer.pieces").
              allow_patterns=["*.safetensors", "*.json", "vocab.txt"],
          )
          snapshot_download(
              repo_id=os.environ["BERT_EN_HF_REPO"],
              revision=os.environ["BERT_EN_REVISION"],
              repo_type="model",
              local_dir=os.path.join(os.environ["RUNNER_TEMP"], "deberta-v3-en"),
              # microsoft/deberta-v3-large ships `pytorch_model.bin` only —
              # no safetensors. Pull the .bin here; a follow-up step below
              # converts it to safetensors via safetensors.torch.save_file
              # (widely-standard bin→safetensors bridge, mirrors what
              # tools/parity/*_prepare_checkpoint.py does across the repo).
              # `*.model` = SentencePiece `spm.model` for the v3 tokenizer;
              # a follow-up step extracts it to a JSON side-car via
              # tools/parity/extract_spm_metadata.py so `vokra-cli convert
              # --model deberta-v3 --tokenizer <spm.json>` can stamp the
              # `vokra.bert.tokenizer.*` metadata the Rust loader requires.
              # Empirical measurement 2026-08-05 (PR #24 CI run 31021206483)
              # showed the safetensors-only allow_patterns pulled 0 weight
              # files and the downstream `find *.safetensors` failed with
              # `test -n ""` (exit 1). Adding .bin fixes the root cause.
              allow_patterns=["*.safetensors", "*.bin", "*.json", "*.model"],
          )
          print("DeBERTa v2/v3 snapshot_download OK")
          PYEOF

      - name: Download plain BERT (ZH) checkpoint
        if: needs.setup.outputs.run_zh == 'true'
        shell: bash
        run: |
          set -euo pipefail
          uv run --project "${PARITY_PROJECT}" --frozen python - <<'PYEOF'
          import os
          from huggingface_hub import snapshot_download

          snapshot_download(
              repo_id=os.environ["BERT_ZH_HF_REPO"],
              revision=os.environ["BERT_ZH_REVISION"],
              repo_type="model",
              local_dir=os.path.join(os.environ["RUNNER_TEMP"], "bert-zh"),
              # The pinned HFL release ships pytorch_model.bin (no native
              # safetensors) plus vocab.txt. A following uv-managed step
              # performs the offline safe bridge before conversion.
              allow_patterns=["pytorch_model.bin", "*.json", "vocab.txt"],
          )
          print("plain BERT ZH snapshot_download OK")
          PYEOF

      - name: Convert DeBERTa v3 pytorch_model.bin -> safetensors
        # microsoft/deberta-v3-large only ships pytorch_model.bin (upstream
        # convention pre-safetensors era, never migrated). vokra-cli
        # `--model deberta-v3` expects a safetensors input — bridge the gap
        # here with the standard safetensors.torch conversion (already in
        # the locked oracle above). Skip cleanly when .safetensors is already present
        # (future-proof: if microsoft ever adds native safetensors, this
        # step is a no-op).
        shell: bash
        run: |
          set -euo pipefail
          uv run --project "${PARITY_PROJECT}" --frozen python - <<'PYEOF'
          import glob
          import os
          import sys
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "deberta-v3-en"

          # Fast path — already safetensors (owner-provided or upstream
          # migrated). Skip conversion silently.
          if any(root.rglob("*.safetensors")):
              print("[deberta-v3 bin→st] .safetensors already present, no conversion needed.")
              sys.exit(0)

          bins = sorted(root.rglob("pytorch_model.bin"))
          if not bins:
              print(f"::error::No pytorch_model.bin or *.safetensors found under {root}", file=sys.stderr)
              sys.exit(1)

          # Deferred imports: torch + safetensors already installed in the
          # locked oracle above (torch + safetensors are direct pins).
          import torch
          from safetensors.torch import save_file

          for bin_path in bins:
              out = bin_path.with_suffix(".safetensors").with_name("model.safetensors")
              print(f"[deberta-v3 bin→st] {bin_path} -> {out}")
              state = torch.load(str(bin_path), map_location="cpu", weights_only=True)
              # `state` is dict[str, Tensor]. Save file expects contiguous
              # tensors — clone().contiguous() covers the shared-memory
              # case (some HF checkpoints tie embed_tokens ↔ lm_head).
              cleaned = {k: v.detach().clone().contiguous() for k, v in state.items()}
              save_file(cleaned, str(out))
              print(f"[deberta-v3 bin→st] wrote {out} ({len(cleaned)} tensors)")
          PYEOF

      - name: Convert ZH BERT pytorch_model.bin -> safetensors
        if: needs.setup.outputs.run_zh == 'true'
        shell: bash
        run: |
          set -euo pipefail
          uv run --project "${PARITY_PROJECT}" --frozen python - <<'PYEOF'
          import os
          import sys
          from pathlib import Path

          import torch
          from safetensors.torch import save_file

          root = Path(os.environ["RUNNER_TEMP"]) / "bert-zh"
          source = root / "pytorch_model.bin"
          if not source.is_file():
              print(f"::error::missing pinned ZH checkpoint: {source}", file=sys.stderr)
              sys.exit(1)
          state = torch.load(str(source), map_location="cpu", weights_only=True)
          if not isinstance(state, dict) or not state:
              print("::error::ZH pytorch_model.bin did not contain a non-empty state_dict", file=sys.stderr)
              sys.exit(1)
          cleaned = {
              name: tensor.detach().clone().contiguous()
              for name, tensor in state.items()
              if isinstance(name, str) and isinstance(tensor, torch.Tensor)
          }
          if len(cleaned) != len(state):
              print(
                  f"::error::ZH state_dict normalization would drop entries: "
                  f"kept {len(cleaned)} of {len(state)}",
                  file=sys.stderr,
              )
              sys.exit(1)
          output = root / "model.safetensors"
          save_file(cleaned, str(output))
          print(f"ZH bin->safetensors: {len(cleaned)} tensors -> {output}")
          PYEOF

      - name: Build vokra-cli (release)
        run: cargo build --release -p vokra-cli

      - name: Convert checkpoint bundle -> GGUF (vokra-cli convert)
        # --model sbv2 / deberta-v2 / deberta-v3 are the canonical
        # ModelKind::as_arg() spellings (tests/fixtures/sbv2/README.md "3.
        # Convert to GGUF"). Multi-shard checkpoints are reported by
        # sbv2_prepare_checkpoint.py but not merged (its own documented
        # limitation).
        #
        # SBV2 v2 base checkpoints ship 3 safetensors siblings:
        #   G_0.safetensors  — Generator (~1264 tensors, has enc_p.*)
        #   D_0.safetensors  — Discriminator (~111 tensors, training-only)
        #   WD_0.safetensors — Warmup Discriminator (~15 tensors)
        # `find | sort` alphabetically picks D_0 (D < G < WD), i.e. the
        # Discriminator, which lacks `enc_p.emb.weight` and every other
        # inference-required tensor. The Rust loader then fails with
        # "tensor sbv2.text_encoder.phoneme_embed not found in GGUF".
        # Explicitly pin the Generator file so this doesn't recur.
        shell: bash
        env:
          RUN_ZH: ${{ needs.setup.outputs.run_zh }}
        run: |
          set -euo pipefail
          # The locked uv oracle provides `sentencepiece` +
          # `google.protobuf` for the tokenizer metadata extraction below.

          sbv2_st="$(find "$RUNNER_TEMP/sbv2-checkpoint" -name 'G_*.safetensors' | sort | head -n1)"
          if [ -z "$sbv2_st" ]; then
            # Fallback for SKUs that ship a single unqualified safetensors.
            sbv2_st="$(find "$RUNNER_TEMP/sbv2-checkpoint" -name '*.safetensors' \
              -not -name 'D_*' -not -name 'WD_*' -not -name 'DUR_*' | sort | head -n1)"
          fi
          test -n "$sbv2_st"
          echo "[sbv2] picked Generator checkpoint: $sbv2_st"

          # Wave-4 WORKFLOW-SHAPE-FIXUP (2026-08-09): the inline-Python
          # shape-recovery that used to live here (patching d_speaker /
          # n_speakers / decoder_upsample_kernel_sizes in
          # vokra-sbv2-config.json between prep and convert) has moved
          # INTO the converter itself — `crates/vokra-convert/src/models/
          # sbv2.rs`'s `infer_d_speaker` / `infer_n_speakers` /
          # `infer_decoder_upsample_kernel_sizes` helpers run inside
          # `convert_sbv2_file` and produce the same "recover from
          # safetensors shape, loud-warn on config disagreement" log
          # entries the pre-Wave-4 inline Python emitted. This CI step
          # is now free of the stopgap; the converter runs everywhere
          # `convert_sbv2_file` runs (CI, local, sidecar tools), not
          # only inside this YAML.

          ./target/release/vokra-cli convert \
            --model sbv2 \
            --input "$sbv2_st" \
            --config "$RUNNER_TEMP/sbv2-checkpoint/vokra-sbv2-config.json" \
            --output "$FIXTURE_DIR/sbv2-v2-multilingual-base.gguf"

          bert_ja_st="$(find "$RUNNER_TEMP/deberta-v2-ja" -name '*.safetensors' | sort | head -n1)"
          test -n "$bert_ja_st"
          # v2 tokenizer = char-level BertJapaneseTokenizer, vocab.txt
          # required for `vokra.bert.tokenizer.*` metadata stamping (see
          # deberta-v2.rs KEY_TOKENIZER_PREFIX + KIND_BERT_JAPANESE_CHAR).
          bert_ja_vocab="$RUNNER_TEMP/deberta-v2-ja/vocab.txt"
          test -f "$bert_ja_vocab"
          ./target/release/vokra-cli convert \
            --model deberta-v2 \
            --input "$bert_ja_st" \
            --tokenizer "$bert_ja_vocab" \
            --output "$FIXTURE_DIR/deberta-v2-large-japanese-char-wwm.gguf"

          # v3 tokenizer = SentencePiece Unigram, spm.model. Convert to
          # JSON side-car first (extract_spm_metadata.py) so vokra-cli
          # doesn't need a protobuf runtime dep. Then pass the JSON via
          # `--tokenizer`. The locked oracle already has protobuf +
          # sentencepiece; reuse the same frozen project here.
          bert_en_spm="$RUNNER_TEMP/deberta-v3-en/spm.model"
          test -f "$bert_en_spm"
          bert_en_tok_json="$RUNNER_TEMP/deberta-v3-en/tokenizer_spm.json"
          uv run --project "${PARITY_PROJECT}" --frozen python \
            tools/parity/extract_spm_metadata.py \
            --input "$bert_en_spm" \
            --output "$bert_en_tok_json"

          bert_en_st="$(find "$RUNNER_TEMP/deberta-v3-en" -name '*.safetensors' | sort | head -n1)"
          test -n "$bert_en_st"
          ./target/release/vokra-cli convert \
            --model deberta-v3 \
            --input "$bert_en_st" \
            --tokenizer "$bert_en_tok_json" \
            --output "$FIXTURE_DIR/deberta-v3-large.gguf"

          if [ "$RUN_ZH" = "true" ]; then
            bert_zh_st="$RUNNER_TEMP/bert-zh/model.safetensors"
            bert_zh_vocab="$RUNNER_TEMP/bert-zh/vocab.txt"
            test -f "$bert_zh_st"
            test -f "$bert_zh_vocab"
            ./target/release/vokra-cli convert \
              --model bert-base \
              --input "$bert_zh_st" \
              --tokenizer "$bert_zh_vocab" \
              --output "$FIXTURE_DIR/chinese-roberta-wwm-ext-large.gguf"
          fi

          ls -lh "$FIXTURE_DIR"/*.gguf

      - name: Verify regenerated GGUFs against committed sidecars
        shell: bash
        env:
          RUN_ZH: ${{ needs.setup.outputs.run_zh }}
        run: |
          set -euo pipefail
          sidecar_failed=0
          verify_sidecar() {
            local artifact="$1"
            local sidecar="$2"
            local expected actual
            expected="$(awk 'NF && $1 !~ /^#/ { print $1; exit }' "$sidecar")"
            if ! [[ "$expected" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::${sidecar} has no valid lowercase SHA-256 record"
              sidecar_failed=1
              return
            fi
            actual="$(sha256sum "$artifact" | awk '{ print $1 }')"
            if [ "$actual" != "$expected" ]; then
              echo "::error::SHA-256 mismatch for ${artifact}: got ${actual}, expected ${expected}"
              sidecar_failed=1
            else
              echo "SHA-256 OK: ${artifact} = ${actual}"
            fi
          }

          verify_sidecar \
            "$FIXTURE_DIR/sbv2-v2-multilingual-base.gguf" \
            "$FIXTURE_DIR/sbv2-v2-multilingual-base.gguf.sha256"
          verify_sidecar \
            "$FIXTURE_DIR/deberta-v2-large-japanese-char-wwm.gguf" \
            "$FIXTURE_DIR/deberta-v2-large-japanese-char-wwm.gguf.sha256"
          verify_sidecar \
            "$FIXTURE_DIR/deberta-v3-large.gguf" \
            "$FIXTURE_DIR/deberta-v3-large.gguf.sha256"
          if [ "$RUN_ZH" = "true" ]; then
            verify_sidecar \
              "$FIXTURE_DIR/chinese-roberta-wwm-ext-large.gguf" \
              "$FIXTURE_DIR/chinese-roberta-wwm-ext-large.gguf.sha256"
          fi
          if [ "$sidecar_failed" -ne 0 ]; then
            exit 1
          fi

      - name: Regenerate reference dump (sbv2_dump_reference.py --do-dump)
        # Wave-4 TASK-34-DUMPER (2026-08-09): the vendoring + pipeline body
        # both landed; a nonzero exit here is a REAL failure and is
        # propagated by the tail-position "Fail if ..." step. `set +e` is
        # kept only to allow the log-collection tail below to run in the
        # failure case; DUMP_EXIT is faithfully echoed to GITHUB_ENV.
        id: dump
        shell: bash
        env:
          RUN_ZH: ${{ needs.setup.outputs.run_zh }}
        run: |
          set +e
          language=ja
          dump_args=(
            --checkpoint "$RUNNER_TEMP/sbv2-checkpoint"
            --output-dir "$FIXTURE_DIR"
            --bert-ja-repo "$RUNNER_TEMP/deberta-v2-ja"
            --bert-en-repo "$RUNNER_TEMP/deberta-v3-en"
          )
          if [ "$RUN_ZH" = "true" ]; then
            language=zh
            dump_args+=(--bert-zh-repo "$RUNNER_TEMP/bert-zh")
          fi
          uv run --project "${PARITY_PROJECT}" --frozen python \
            tools/parity/sbv2_dump_reference.py \
            "${dump_args[@]}" \
            --language "$language" \
            --do-dump 2>&1 | tee "$RUNNER_TEMP/sbv2-dump.log"
          exit_code=${PIPESTATUS[0]}
          echo "DUMP_EXIT=${exit_code}" >> "$GITHUB_ENV"
          {
            echo "### sbv2_dump_reference.py --do-dump (exit ${exit_code})"
            echo ""
            echo '```'
            tail -n 40 "$RUNNER_TEMP/sbv2-dump.log"
            echo '```'
            if [ "$exit_code" -ne 0 ]; then
              echo ""
              echo "**REAL FAILURE** — the vendored VITS pipeline + \`run_pipeline_body\`"
              echo "are fully wired (Wave-4 TASK-34-DUMPER). Investigate the traceback"
              echo "above: missing/unmapped tensor names in the safetensors state_dict,"
              echo "a shape mismatch vs the clean-room vendored primitives, or a"
              echo "network/HF-hub fetch failure for one of the selected BERT checkpoints."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Detect fixture drift (informational, never auto-commits)
        if: always()
        shell: bash
        run: |
          set +e
          git diff --stat -- "$FIXTURE_DIR" > "$RUNNER_TEMP/fixture-drift.txt"
          if [ -s "$RUNNER_TEMP/fixture-drift.txt" ]; then
            {
              echo "### Fixture drift (informational)"
              echo ""
              echo '```'
              cat "$RUNNER_TEMP/fixture-drift.txt"
              echo '```'
              echo ""
              echo "Owner reviews and commits intentionally — this workflow never auto-commits."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### No fixture drift" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Prepare UTMOS22-strong GGUF (WP-24 UTMOS quality gate)
        # Opt-in tail-position quality gate: when repository variable
        # `VOKRA_SBV2_UTMOS_ENABLE == "1"` the SBV2 parity test asserts
        # `|utmos(rust_wave) - utmos(reference_wave)| <= 0.05` after the
        # numerical-waveform assertion passes. See the module doc of
        # `crates/vokra-models/tests/parity_sbv2_real.rs` ("WP-24: UTMOS
        # quality gate") for the Rust-side semantics and
        # `crates/vokra-models/src/sbv2/parity.rs`'s `UTMOS_ATOL` for the
        # honest-atol derivation.
        #
        # Weight source: reuses the already-committed
        # `tests/parity/utmos/source.env` (UTMOS §3.1 sign-off = ☑ Commercial
        # yousan 2026-07-23; the same URL + sha256 `parity-utmos.yml` uses).
        # No new owner artifact required — enabling is a one-line repo-vars
        # flip.
        #
        # Fail-closed skip when the variable is not `"1"` (the whole step is
        # `if:`-gated off, and the Rust test observes `VOKRA_SBV2_UTMOS_ENABLE`
        # empty → deliberate skip with an eprintln + workflow annotation, per
        # `parity-deepfilternet3-real.yml` / `parity-utmos.yml` precedent —
        # fabricated pass 禁止, FR-EX-08 / NFR-QL-04).
        id: utmos_prep
        if: vars.VOKRA_SBV2_UTMOS_ENABLE == '1'
        shell: bash
        run: |
          set -euo pipefail
          # `safetensors` is part of the same frozen SBV2 oracle because
          # `utmos_prepare_checkpoint.py` is an optional tail of this job.
          # Reuse the already-committed UTMOS source pin (owner sign-off
          # docs/license-audit.md §3.1 UTMOS row on 2026-07-23).
          # shellcheck disable=SC1091
          source tests/parity/utmos/source.env
          : "${CKPT_URL:?tests/parity/utmos/source.env must define CKPT_URL}"
          : "${CKPT_SHA256:?tests/parity/utmos/source.env must define CKPT_SHA256}"
          curl -fL --retry 3 -o "$RUNNER_TEMP/utmos-checkpoint.ckpt" "$CKPT_URL"
          echo "$CKPT_SHA256  $RUNNER_TEMP/utmos-checkpoint.ckpt" | sha256sum -c -
          uv run --project "${PARITY_PROJECT}" --frozen python \
            tools/parity/utmos_prepare_checkpoint.py \
            --ckpt "$RUNNER_TEMP/utmos-checkpoint.ckpt" \
            --output "$RUNNER_TEMP/utmos.safetensors" \
            --config-out "$RUNNER_TEMP/utmos-config.json"
          ./target/release/vokra-cli convert \
            --model utmos \
            --input "$RUNNER_TEMP/utmos.safetensors" \
            --config "$RUNNER_TEMP/utmos-config.json" \
            --output "$RUNNER_TEMP/utmos.gguf"
          ls -lh "$RUNNER_TEMP/utmos.gguf"
          echo "utmos_gguf=$RUNNER_TEMP/utmos.gguf" >> "$GITHUB_OUTPUT"

      - name: Announce WP-24 UTMOS quality gate posture
        # Runs regardless — the annotation on a *disabled* gate is the
        # honest signal that the CI leg is off (never a fabricated pass).
        if: always()
        shell: bash
        env:
          UTMOS_ENABLE_VAR: ${{ vars.VOKRA_SBV2_UTMOS_ENABLE }}
        run: |
          set -euo pipefail
          if [ "${UTMOS_ENABLE_VAR}" = "1" ]; then
            {
              echo "### WP-24 UTMOS quality gate: ENABLED"
              echo ""
              echo "\`vars.VOKRA_SBV2_UTMOS_ENABLE=1\` — the tail-position UTMOS delta assertion"
              echo "( \`|Δ| <= UTMOS_ATOL\` = 0.05 per \`crates/vokra-models/src/sbv2/parity.rs\`)"
              echo "will fire once the numeric waveform-parity assertion above passes."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### WP-24 UTMOS quality gate: SKIPPED"
              echo ""
              echo "\`vars.VOKRA_SBV2_UTMOS_ENABLE\` is not \`1\` — the tail-position UTMOS delta"
              echo "assertion will not fire. Set the repository variable"
              echo "\`VOKRA_SBV2_UTMOS_ENABLE=1\` to enable (no other owner artifact required —"
              echo "\`tests/parity/utmos/source.env\` is already committed)."
              echo ""
              echo "This is an FR-EX-08 explicit skip, not a fabricated pass — the SBV2"
              echo "parity test observes the empty env var and logs an \`eprintln!\` skip diag."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::parity-sbv2-real: WP-24 UTMOS quality gate skipped (vars.VOKRA_SBV2_UTMOS_ENABLE != '1')"
          fi

      - name: Run SBV2 real-checkpoint full-manifest parity test
        # WP-06 removed `#[ignore]` on 2026-08-11 after the real fixture path
        # landed. Run the named non-ignored test explicitly: `--ignored`
        # would now filter OUT the numerical consumer and fabricate a green
        # no-op. `if: always()` still exercises the loud partial-fixture
        # failure path when the dumper failed.
        #
        # WP-24: when `vars.VOKRA_SBV2_UTMOS_ENABLE == "1"`, the two
        # `VOKRA_SBV2_UTMOS_*` env vars below opt the tail-position UTMOS
        # quality gate in (see the module doc of `parity_sbv2_real.rs` and
        # the "Prepare UTMOS22-strong GGUF" step above); an empty value
        # (var unset OR prep step skipped) triggers the Rust-side clean
        # skip.
        id: parity
        if: always()
        env:
          VOKRA_SBV2_UTMOS_ENABLE: ${{ vars.VOKRA_SBV2_UTMOS_ENABLE }}
          VOKRA_SBV2_UTMOS_GGUF: ${{ steps.utmos_prep.outputs.utmos_gguf }}
        shell: bash
        run: |
          set +e
          cargo test --locked --release -p vokra-models \
            --test parity_sbv2_real \
            parity_sbv2_real_waveform_matches_reference_dump -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/parity.log"
          exit_code=${PIPESTATUS[0]}
          echo "PARITY_EXIT=${exit_code}" >> "$GITHUB_ENV"
          # WP-04: surface the mel_loss aggregator's per-run measurement so
          # the first successful CI run's `[parity_sbv2_real] mel_loss parity OK`
          # line is easy to lift into `MEL_LOSS_ATOL`'s docstring when
          # WP-04's `AtolMeasurement::EstimatedPreFixture` is promoted to
          # `Measured`. Extract the exact line the test emits (see
          # `mel_loss_rms` wire-in in `parity_sbv2_real.rs`), pointer-quoted
          # for clean copy-paste.
          mel_loss_line=$(grep -E '^\[parity_sbv2_real\] mel_loss parity' "$RUNNER_TEMP/parity.log" \
            | head -n1 || true)
          {
            echo "### parity_sbv2_real (exit ${exit_code})"
            echo ""
            echo '```'
            grep -E '^\[parity_sbv2_real\]' "$RUNNER_TEMP/parity.log" || echo "(no [parity_sbv2_real] diagnostic lines emitted)"
            echo '```'
            echo ""
            echo "**WP-04 mel_loss aggregator** (log-mel RMS, tighter architectural"
            echo "bound than raw waveform atol per ADR"
            echo "\`docs/adr/sbv2-libm-strategy.md\` §2.2):"
            echo ""
            if [ -n "$mel_loss_line" ]; then
              echo '```'
              echo "$mel_loss_line"
              echo '```'
              echo ""
              echo "Once the fixture gate opens and this line reports a real measurement,"
              echo "promote \`MEL_LOSS_ATOL\` (\`crates/vokra-models/src/sbv2/parity.rs\`) from"
              echo "\`EstimatedPreFixture\` to \`Measured\` in the calibration snapshot at"
              echo "\`crates/vokra-models/tests/sbv2_parity_atol_calibration.rs\`."
            else
              echo "*(no \`[parity_sbv2_real] mel_loss parity\` line emitted — parity test"
              echo "did not reach the mel_loss assertion, likely because an earlier step failed.)*"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Emit atol-summary.json artifact (WP-02, 2026-08-09)
        # Parses the per-tensor `[parity_sbv2_real]` rows the parity test
        # writes to `parity.log` (WP-02 refactor of
        # `diff_intermediates_against_manifest`: rows are emitted BEFORE
        # any assertion, so a failing tensor still shows up in the
        # summary — an owner reviewing the artifact never has to guess
        # whether "no line" meant "not run" or "failed silently").
        #
        # The resulting `atol-summary.json` is picked up by
        # `tools/parity/sbv2_atol_updater.py` (`--summary <path>`),
        # which PROPOSES atol table edits (`PROMOTE_TO_MEASURED` /
        # `PROMOTE_TO_ESTIMATED` / `TIGHTEN` / `LOOSEN`) — but never
        # auto-commits, per memory `feedback-honest-parity-atol` (Kokoro
        # T17-fixup #5/#6 REVERT precedent). Owner reviews the printed
        # proposal, decides what to accept, then edits BOTH the code
        # side and `tests/fixtures/sbv2/atol-measurements.json` in ONE
        # commit (redundant-recording rule).
        #
        # `if: always()`: even a failing parity run should produce a
        # summary — that is precisely the case where the owner-review
        # cycle needs to see per-tensor max|Δ| numbers to decide what to
        # tighten/loosen.
        id: atol_summary
        if: always()
        shell: bash
        run: |
          set +e
          uv run --project "${PARITY_PROJECT}" --frozen python \
            tools/parity/sbv2_atol_summary_from_log.py \
            --log "$RUNNER_TEMP/parity.log" \
            --output "$RUNNER_TEMP/atol-summary.json" \
            --ci-run-id "${{ github.run_id }}" \
            --ci-run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          summary_exit=$?
          echo "ATOL_SUMMARY_EXIT=${summary_exit}" >> "$GITHUB_ENV"

          # Render human-readable proposals into step summary + also
          # emit as text alongside the JSON artifact for the owner.
          uv run --project "${PARITY_PROJECT}" --frozen python \
            tools/parity/sbv2_atol_updater.py \
            --summary "$RUNNER_TEMP/atol-summary.json" \
            --ci-run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            2>&1 | tee "$RUNNER_TEMP/atol-proposal.txt"
          {
            echo "### atol updater proposals (WP-02)"
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/atol-proposal.txt"
            echo '```'
            echo ""
            echo "**Consumed by**: \`tools/parity/sbv2_atol_updater.py\` — read the"
            echo "\`atol-summary.json\` artifact locally with \`uv run python\`"
            echo "\`tools/parity/sbv2_atol_updater.py --summary <path>\` to"
            echo "re-render / adjust the margin factor. Proposal-only; CC never"
            echo "auto-commits atol changes (honest-atol discipline)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Zero-dependency invariant (root Cargo.lock unchanged, NFR-DS-02)
        if: always()
        run: git diff --exit-code Cargo.lock

      - name: Upload parity artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sbv2-parity-artifacts
          path: |
            ${{ runner.temp }}/sbv2-dump.log
            ${{ runner.temp }}/parity.log
            ${{ runner.temp }}/fixture-drift.txt
            ${{ runner.temp }}/atol-summary.json
            ${{ runner.temp }}/atol-proposal.txt
            tests/fixtures/sbv2/reference_dump.manifest.json
            tests/fixtures/sbv2/atol-measurements.json
          retention-days: 7
          if-no-files-found: warn

      - name: Fail if the dumper or the Rust parity test failed (honest exit propagation)
        # Placed after artifact upload (artifacts-first, exit-last — same
        # ordering parity-whisper-real.yml / parity-kokoro-real.yml use) so
        # a failing job still ships the diagnostic bundle. Empty env values
        # (a step that never ran because an earlier hard-required step
        # failed) compare != '0' too, so an upstream failure still fails
        # the job here.
        if: env.DUMP_EXIT != '0' || env.PARITY_EXIT != '0'
        shell: bash
        run: |
          echo "::error::parity-sbv2-real failed — sbv2_dump_reference.py exit ${DUMP_EXIT:-?}, parity_sbv2_real exit ${PARITY_EXIT:-?} — see step summary + artifacts"
          exit 1
