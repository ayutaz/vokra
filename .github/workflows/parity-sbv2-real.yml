# Vokra SBV2 (Style-Bert-VITS2 v2) real-checkpoint parity CI (SBV2 v2 plan
# Task 35; design doc `docs/superpowers/specs/2026-07-26-sbv2-v2-design.md`
# §10 "parity CI + fixture" / "CI workflow").
#
# Sibling of `.github/workflows/parity-whisper-real.yml` and
# `.github/workflows/parity-kokoro-real.yml`: a `#[ignore]`d Rust parity
# test (`crates/vokra-models/tests/parity_sbv2_real.rs`, Task 28) needs a
# real, non-Apache-2.0-licensed checkpoint family this repo can never commit
# as binary fixtures. `tests/fixtures/sbv2/README.md` (Task 34) is the
# owner recipe this workflow automates end to end: download the SBV2 v2
# base (AGPL-3.0) + DeBERTa v2 JA (cc-by-sa-4.0) + DeBERTa v3 EN (MIT)
# checkpoints, convert each to GGUF, regenerate the Python reference dump,
# then run the Rust parity test against the freshly-built GGUFs.
#
# ## Gating (sidecar-hash gate, fabricated-pass prevention)
#
# `tests/fixtures/sbv2/*.gguf.sha256` are committed as comment-only
# PLACEHOLDER files until an owner completes the README recipe end to end
# and overwrites them with real `sha256sum` output (see that README's "Owner
# recipe" step 4 and "Placeholder format" section, which this gate's exact
# per-file test is drawn from verbatim: `[ -s <sidecar> ] && ! grep -q
# "placeholder" <sidecar>`). The `setup` job below checks all THREE
# sidecars — design doc §10's own YAML sketch illustrates the gate against
# only `sbv2-v2-multilingual-base.gguf.sha256`, but `SbV2Model::from_gguf`
# takes all three checkpoints (`main` + `bert_ja` + `bert_en`) to even
# construct a model, and the README's own recipe updates all three sidecars
# together in one step ("4. Hash and commit") — so gating on the full set is
# a faithful, deliberate extension of the sketch's intent, not a deviation
# from it. That README's own "Placeholder format" section already
# anticipates exactly this: "A future workflow built from that sketch stays
# correctly gated off (`fixtures_present=false`) against these files"
# (plural — all three).
#
# While the gate is closed (today, and until an owner runs the recipe), the
# `parity` job below is skipped entirely — an FR-EX-08 explicit, annotated
# skip, never a silent no-op and never a fabricated pass.
#
# ## Honest failure while the gate is open (VITS vendoring not landed yet)
#
# Once the gate opens, this workflow WILL fail — on purpose, today — at the
# "Regenerate reference dump" step. `tools/parity/sbv2_dump_reference.py
# --do-dump` (Task 30) always exits nonzero right now: its clean-room VITS
# core reference (`jaywalnut310/vits`, MIT) is vendored only as a
# `tools/parity/vendor/vits/{LICENSE,README.md}` scaffold, no ported module
# yet (see that script's own module doc, tier 3 of its documented
# dependency ladder). That is a real, already-documented, honestly-surfaced
# gap — not a bug in this workflow, and not something to paper over with a
# soft-skip / advisory-downgrade the way `parity-kokoro-real.yml` downgrades
# an ISA-mismatch FAIL. The Rust parity test step still runs afterwards
# (`if: always()`) for whatever diagnostic value it offers today (loading
# the freshly-converted GGUFs via `SbV2Model::from_gguf`, which — per that
# function's own doc — currently answers every `synthesize()` call with a
# documented `NotImplemented` regardless of dumper output, since
# `from_gguf` wires no G2P). The job's final status reflects BOTH steps
# honestly (see the tail-position "Fail if ..." step).
#
# ## Clean-room reminder
#
# Nothing this workflow runs was built by reading
# `github.com/litagin02/Style-Bert-VITS2` (AGPL-3.0),
# `github.com/fishaudio/Bert-VITS2` (AGPL-3.0), or any fork/derivative of
# either — see design doc §6 and `tests/fixtures/sbv2/README.md`'s own
# "Clean-room reminder" section for the full permissive-source allow-list
# this workflow's downstream tools inherit.
#
# ## Zero-dependency invariant (NFR-DS-02)
#
# The whole run must not mutate the root workspace `Cargo.lock` — Python
# deps live in a job-scoped `/tmp` venv, `vokra-cli convert` operates on
# already-checked-in workspace code. The final `git diff --exit-code
# Cargo.lock` guard (mirrors parity-whisper-real.yml / parity-kokoro-real.yml)
# catches any accidental drift.
#
# ## Not a required check
#
# Like its two siblings, this workflow is opt-in (workflow_dispatch + weekly
# cron + a narrow pull_request paths filter) and is not registered in
# branch-protection required checks. Promotion is an owner decision after
# consecutive green runs — and, concretely for SBV2, only possible after the
# VITS vendoring follow-up lands (see above).
#
# ## Schedule slot
#
# Design doc §10's sketch uses `cron: '0 4 * * 1'` — but that is
# `parity-kokoro-real.yml`'s own existing Monday-04:00-UTC slot, and
# `parity-whisper-real.yml` already documents why IT offset itself by an
# hour to `0 5 * * 1` ("avoids GH Actions cron collisions with the Kokoro
# job and spreads HF hub load across the hour"). This workflow followed the
# same precedent — first '0 6 * * 1', then '15 7 * * 1' (2026-07-27) once
# `gpu-cuda-rtf.yml` (06:00) and `web-wasm.yml` (07:00) fully booked the
# adjacent :00 slots and `check-workflow-hygiene.sh` started flagging
# collisions. 07:15 is the closest free slot to the design-doc sketch, in
# between web-wasm (07:00) and parity-moshi-real (07:30).

name: parity-sbv2-real

on:
  workflow_dispatch:
  schedule:
    - cron: '15 7 * * 1'
  pull_request:
    # Paths reflect the files Tasks 25-34 actually landed under, not design
    # doc §10's illustrative sketch (`tests/parity/parity_sbv2_*`, written
    # before the SBV2 crate layout existed — the real parity test lives at
    # `crates/vokra-models/tests/parity_sbv2_real.rs`).
    paths:
      - '.github/workflows/parity-sbv2-real.yml'
      - 'crates/vokra-bert/**'
      - 'crates/vokra-convert/src/models/deberta_v2.rs'
      - 'crates/vokra-convert/src/models/deberta_v3.rs'
      - 'crates/vokra-convert/src/models/sbv2.rs'
      - 'crates/vokra-core/**'
      - 'crates/vokra-models/src/compute.rs'
      - 'crates/vokra-models/src/sbv2/**'
      - 'crates/vokra-models/tests/parity_sbv2_real.rs'
      - 'crates/vokra-ops/**'
      - 'tests/fixtures/sbv2/**'
      - 'tools/parity/sbv2_dump_reference.py'
      - 'tools/parity/sbv2_prepare_checkpoint.py'
      - 'tools/parity/vendor/vits/**'

permissions:
  contents: read

# Mirrors parity-kokoro-real.yml: a one-shot HF DL + convert + dump + parity
# run with no side effects that outlive the workspace, so cancelling a
# superseded run on a rapid re-push is always safe.
concurrency:
  group: parity-sbv2-real-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Sidecar-hash gate (see header comment). Never fails: gate-closed is an
  # expected, valid, honestly-annotated state, not an error — only the
  # `fixtures_present` output communicates the verdict to the `parity` job.
  setup:
    name: setup
    runs-on: ubuntu-latest
    outputs:
      fixtures_present: ${{ steps.check.outputs.present }}
    steps:
      - uses: actions/checkout@v7
      - name: Detect real fixture sidecars (sidecar-hash gate)
        id: check
        shell: bash
        run: |
          set -euo pipefail
          DIR=tests/fixtures/sbv2
          all_present=true
          reasons=()
          for f in \
            "$DIR/sbv2-v2-multilingual-base.gguf.sha256" \
            "$DIR/deberta-v2-large-japanese-char-wwm.gguf.sha256" \
            "$DIR/deberta-v3-large.gguf.sha256"; do
            if [ -s "$f" ] && ! grep -q "placeholder" "$f"; then
              continue
            fi
            all_present=false
            reasons+=("$f is absent, empty, or still a placeholder")
          done
          if [ "$all_present" = "true" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "### parity-sbv2-real fixture gate: OPEN (all 3 sidecars real)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            {
              echo "### parity-sbv2-real fixture gate: CLOSED (clean skip)"
              echo ""
              echo "Expected state until an owner completes \`tests/fixtures/sbv2/README.md\`'s recipe:"
              echo ""
              for r in "${reasons[@]}"; do
                echo "- $r"
              done
              echo ""
              echo "FR-EX-08 explicit skip — not a synthetic fallback, not a fabricated pass."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::parity-sbv2-real: fixture gate closed (see step summary) — parity job will be skipped"
          fi

  parity:
    name: parity-sbv2-real
    needs: setup
    if: needs.setup.outputs.fixtures_present == 'true'
    runs-on: ubuntu-latest
    # HF DL (SBV2 base + 2 DeBERTa-large encoders) + 3x convert + dump +
    # cargo test. Generous cap matching the whisper large-v3 / kokoro legs
    # (multi-GB checkpoint class); a truly stuck run is still bounded.
    timeout-minutes: 60
    env:
      SBV2_HF_REPO: litagin/Style-Bert-VITS2-2.0-base-JP-Extra
      BERT_JA_HF_REPO: ku-nlp/deberta-v2-large-japanese-char-wwm
      BERT_EN_HF_REPO: microsoft/deberta-v3-large
      FIXTURE_DIR: tests/fixtures/sbv2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Provision parity venv (huggingface_hub + torch + transformers + spm/protobuf)
        # torch>=2.6 は transformers 4.57+ が `torch.load(weights_only=True)`
        # を呼ぶ際にハードチェックする ("Due to a serious vulnerability issue
        # in torch.load, even with weights_only=True, we now require users
        # to upgrade torch to at least v2.6")。CI で transformers 4.57.6 が
        # 引かれるため torch は 2.6+ でないと dumper が checkpoint load で
        # fail する。CPU-only なので extra-index-url は不要。
        #
        # `sentencepiece` + `protobuf` は DeBERTa v3 の spm tokenizer が
        # `AutoTokenizer.from_pretrained` 経由で読める前提条件 (transformers
        # 側の PROTOBUF_IMPORT_ERROR で fail する)。dumper (sbv2_dump_reference.py)
        # は tokenize+forward の real reference を出すために両モデルの
        # AutoTokenizer を呼ぶので、v3 (spm) 側で protobuf 必須になる。
        # sibling parity-moshi-real.yml も sentencepiece を同 pattern で
        # 入れている。
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/vokra-py-sbv2
          # shellcheck disable=SC1091
          . /tmp/vokra-py-sbv2/bin/activate
          python -m pip install --upgrade pip
          python -m pip install \
            "huggingface_hub>=0.24,<1" \
            "torch>=2.6,<3" \
            "transformers>=4.44,<4.60" \
            "sentencepiece>=0.2,<1" \
            "protobuf>=4,<7"
          python -m pip list | grep -Ei '^(huggingface[-_]hub|torch|transformers|sentencepiece|protobuf)\b'

      - name: Download SBV2 v2 checkpoint + build vokra.sbv2.* config side-car
        # tools/parity/sbv2_prepare_checkpoint.py (Task 29): snapshot_download
        # + best-effort config.json -> vokra.sbv2.* mapping. Its own
        # RESOLVED/UNRESOLVED per-field report lands in this step's log.
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . /tmp/vokra-py-sbv2/bin/activate
          # SBV2 v2 base ships weights only (no config.json). The prep script
          # provides `--clean-room-defaults` as the author-designed escape
          # hatch for this exact case: it fills the `vokra.sbv2.*` side-car
          # from cited VITS/HiFi-GAN/StyleTTS 2 MIT reference defaults
          # instead of erroring. Without this flag CI aborts with
          # "no config.json found under ... — Pass --clean-room-defaults".
          python3 tools/parity/sbv2_prepare_checkpoint.py \
            --hf-repo "$SBV2_HF_REPO" \
            --output-dir "$RUNNER_TEMP/sbv2-checkpoint" \
            --clean-room-defaults

      - name: Download DeBERTa v2 (JA) + v3 (EN) checkpoints
        # Plain HF transformers-style repos (flat safetensors, no .pth to
        # flatten) — a direct snapshot_download is enough, matching
        # tests/fixtures/sbv2/README.md's own inline recipe verbatim.
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . /tmp/vokra-py-sbv2/bin/activate
          python3 - <<'PYEOF'
          import os
          from huggingface_hub import snapshot_download

          snapshot_download(
              repo_id=os.environ["BERT_JA_HF_REPO"],
              repo_type="model",
              local_dir=os.path.join(os.environ["RUNNER_TEMP"], "deberta-v2-ja"),
              # ku-nlp/deberta-v2-large-japanese-char-wwm ships safetensors.
              allow_patterns=["*.safetensors", "*.json"],
          )
          snapshot_download(
              repo_id=os.environ["BERT_EN_HF_REPO"],
              repo_type="model",
              local_dir=os.path.join(os.environ["RUNNER_TEMP"], "deberta-v3-en"),
              # microsoft/deberta-v3-large ships `pytorch_model.bin` only —
              # no safetensors. Pull the .bin here; a follow-up step below
              # converts it to safetensors via safetensors.torch.save_file
              # (widely-standard bin→safetensors bridge, mirrors what
              # tools/parity/*_prepare_checkpoint.py does across the repo).
              # Empirical measurement 2026-08-05 (PR #24 CI run 31021206483)
              # showed the safetensors-only allow_patterns pulled 0 weight
              # files and the downstream `find *.safetensors` failed with
              # `test -n ""` (exit 1). Adding .bin fixes the root cause.
              allow_patterns=["*.safetensors", "*.bin", "*.json"],
          )
          print("DeBERTa v2/v3 snapshot_download OK")
          PYEOF

      - name: Convert DeBERTa v3 pytorch_model.bin -> safetensors
        # microsoft/deberta-v3-large only ships pytorch_model.bin (upstream
        # convention pre-safetensors era, never migrated). vokra-cli
        # `--model deberta-v3` expects a safetensors input — bridge the gap
        # here with the standard safetensors.torch conversion (already in
        # the venv above). Skip cleanly when .safetensors is already present
        # (future-proof: if microsoft ever adds native safetensors, this
        # step is a no-op).
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . /tmp/vokra-py-sbv2/bin/activate
          python3 - <<'PYEOF'
          import glob
          import os
          import sys
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "deberta-v3-en"

          # Fast path — already safetensors (owner-provided or upstream
          # migrated). Skip conversion silently.
          if any(root.rglob("*.safetensors")):
              print("[deberta-v3 bin→st] .safetensors already present, no conversion needed.")
              sys.exit(0)

          bins = sorted(root.rglob("pytorch_model.bin"))
          if not bins:
              print(f"::error::No pytorch_model.bin or *.safetensors found under {root}", file=sys.stderr)
              sys.exit(1)

          # Deferred imports: torch + safetensors already installed in the
          # venv above (`transformers>=4.44` pulls torch as a transitive).
          import torch
          from safetensors.torch import save_file

          for bin_path in bins:
              out = bin_path.with_suffix(".safetensors").with_name("model.safetensors")
              print(f"[deberta-v3 bin→st] {bin_path} -> {out}")
              state = torch.load(str(bin_path), map_location="cpu", weights_only=True)
              # `state` is dict[str, Tensor]. Save file expects contiguous
              # tensors — clone().contiguous() covers the shared-memory
              # case (some HF checkpoints tie embed_tokens ↔ lm_head).
              cleaned = {k: v.detach().clone().contiguous() for k, v in state.items()}
              save_file(cleaned, str(out))
              print(f"[deberta-v3 bin→st] wrote {out} ({len(cleaned)} tensors)")
          PYEOF

      - name: Build vokra-cli (release)
        run: cargo build --release -p vokra-cli

      - name: Convert 3 checkpoints -> GGUF (vokra-cli convert)
        # --model sbv2 / deberta-v2 / deberta-v3 are the canonical
        # ModelKind::as_arg() spellings (tests/fixtures/sbv2/README.md "3.
        # Convert to GGUF"). Multi-shard checkpoints are reported by
        # sbv2_prepare_checkpoint.py but not merged (its own documented
        # limitation).
        #
        # SBV2 v2 base checkpoints ship 3 safetensors siblings:
        #   G_0.safetensors  — Generator (~1264 tensors, has enc_p.*)
        #   D_0.safetensors  — Discriminator (~111 tensors, training-only)
        #   WD_0.safetensors — Warmup Discriminator (~15 tensors)
        # `find | sort` alphabetically picks D_0 (D < G < WD), i.e. the
        # Discriminator, which lacks `enc_p.emb.weight` and every other
        # inference-required tensor. The Rust loader then fails with
        # "tensor sbv2.text_encoder.phoneme_embed not found in GGUF".
        # Explicitly pin the Generator file so this doesn't recur.
        shell: bash
        run: |
          set -euo pipefail

          sbv2_st="$(find "$RUNNER_TEMP/sbv2-checkpoint" -name 'G_*.safetensors' | sort | head -n1)"
          if [ -z "$sbv2_st" ]; then
            # Fallback for SKUs that ship a single unqualified safetensors.
            sbv2_st="$(find "$RUNNER_TEMP/sbv2-checkpoint" -name '*.safetensors' \
              -not -name 'D_*' -not -name 'WD_*' -not -name 'DUR_*' | sort | head -n1)"
          fi
          test -n "$sbv2_st"
          echo "[sbv2] picked Generator checkpoint: $sbv2_st"
          ./target/release/vokra-cli convert \
            --model sbv2 \
            --input "$sbv2_st" \
            --config "$RUNNER_TEMP/sbv2-checkpoint/vokra-sbv2-config.json" \
            --output "$FIXTURE_DIR/sbv2-v2-multilingual-base.gguf"

          bert_ja_st="$(find "$RUNNER_TEMP/deberta-v2-ja" -name '*.safetensors' | sort | head -n1)"
          test -n "$bert_ja_st"
          ./target/release/vokra-cli convert \
            --model deberta-v2 \
            --input "$bert_ja_st" \
            --output "$FIXTURE_DIR/deberta-v2-large-japanese-char-wwm.gguf"

          bert_en_st="$(find "$RUNNER_TEMP/deberta-v3-en" -name '*.safetensors' | sort | head -n1)"
          test -n "$bert_en_st"
          ./target/release/vokra-cli convert \
            --model deberta-v3 \
            --input "$bert_en_st" \
            --output "$FIXTURE_DIR/deberta-v3-large.gguf"

          ls -lh "$FIXTURE_DIR"/*.gguf

      - name: Regenerate reference dump (sbv2_dump_reference.py --do-dump)
        # EXPECTED TO FAIL TODAY — see this workflow's header comment
        # ("Honest failure while the gate is open"). --language ja (the
        # default) with no --text override reproduces exactly the request
        # already baked into the committed
        # tests/fixtures/sbv2/reference_dump.manifest.json
        # ("text": "テスト", "language": "JA").
        id: dump
        shell: bash
        run: |
          set +e
          # shellcheck disable=SC1091
          . /tmp/vokra-py-sbv2/bin/activate
          python3 tools/parity/sbv2_dump_reference.py \
            --checkpoint "$RUNNER_TEMP/sbv2-checkpoint" \
            --output-dir "$FIXTURE_DIR" \
            --language ja \
            --do-dump 2>&1 | tee "$RUNNER_TEMP/sbv2-dump.log"
          exit_code=${PIPESTATUS[0]}
          echo "DUMP_EXIT=${exit_code}" >> "$GITHUB_ENV"
          {
            echo "### sbv2_dump_reference.py --do-dump (exit ${exit_code})"
            echo ""
            echo '```'
            tail -n 40 "$RUNNER_TEMP/sbv2-dump.log"
            echo '```'
            if [ "$exit_code" -ne 0 ]; then
              echo ""
              echo "**Expected today**: \`tools/parity/vendor/vits/\` ships only a LICENSE"
              echo "+ README scaffold (Task 30) — no vendored \`jaywalnut310/vits\` (MIT)"
              echo "module yet, so \`--do-dump\` cannot run a real forward pass. Documented,"
              echo "honest failure (FR-EX-08), not a bug in this workflow — see that"
              echo "script's own module doc and \`tools/parity/vendor/vits/README.md\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Detect fixture drift (informational, never auto-commits)
        if: always()
        shell: bash
        run: |
          set +e
          git diff --stat -- "$FIXTURE_DIR" > "$RUNNER_TEMP/fixture-drift.txt"
          if [ -s "$RUNNER_TEMP/fixture-drift.txt" ]; then
            {
              echo "### Fixture drift (informational)"
              echo ""
              echo '```'
              cat "$RUNNER_TEMP/fixture-drift.txt"
              echo '```'
              echo ""
              echo "Owner reviews and commits intentionally — this workflow never auto-commits."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### No fixture drift" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run SBV2 real-checkpoint parity test (--ignored)
        # Runs regardless of the dumper's outcome (if: always()): the GGUF
        # load + SbV2Model::from_gguf + synthesize() call path is exercised
        # (and, per that function's own doc, expected to answer with a
        # documented NotImplemented today — see this file's header comment)
        # independent of whether reference_dump/*.bin exists yet.
        id: parity
        if: always()
        shell: bash
        run: |
          set +e
          cargo test --release -p vokra-models --test parity_sbv2_real -- --ignored --nocapture \
            2>&1 | tee "$RUNNER_TEMP/parity.log"
          exit_code=${PIPESTATUS[0]}
          echo "PARITY_EXIT=${exit_code}" >> "$GITHUB_ENV"
          {
            echo "### parity_sbv2_real (exit ${exit_code})"
            echo ""
            echo '```'
            grep -E '^\[parity_sbv2_real\]' "$RUNNER_TEMP/parity.log" || echo "(no [parity_sbv2_real] diagnostic lines emitted)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Zero-dependency invariant (root Cargo.lock unchanged, NFR-DS-02)
        if: always()
        run: git diff --exit-code Cargo.lock

      - name: Upload parity artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sbv2-parity-artifacts
          path: |
            ${{ runner.temp }}/sbv2-dump.log
            ${{ runner.temp }}/parity.log
            ${{ runner.temp }}/fixture-drift.txt
            tests/fixtures/sbv2/reference_dump.manifest.json
          retention-days: 7
          if-no-files-found: warn

      - name: Fail if the dumper or the Rust parity test failed (honest exit propagation)
        # Placed after artifact upload (artifacts-first, exit-last — same
        # ordering parity-whisper-real.yml / parity-kokoro-real.yml use) so
        # a failing job still ships the diagnostic bundle. Empty env values
        # (a step that never ran because an earlier hard-required step
        # failed) compare != '0' too, so an upstream failure still fails
        # the job here.
        if: env.DUMP_EXIT != '0' || env.PARITY_EXIT != '0'
        shell: bash
        run: |
          echo "::error::parity-sbv2-real failed — sbv2_dump_reference.py exit ${DUMP_EXIT:-?}, parity_sbv2_real exit ${PARITY_EXIT:-?} — see step summary + artifacts"
          exit 1
