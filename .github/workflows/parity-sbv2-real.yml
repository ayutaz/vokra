# Style-Bert-VITS2 v2 real-checkpoint parity CI (Blocker 2b/2c/3/5 completion).
#
# The Rust parity harness `crates/vokra-models/tests/parity_sbv2_real.rs`
# compares outputs against fixtures hooked from the TRUE upstream
# `style-bert-vits2` library (tools/parity/sbv2_dump_reference.py). SBV2 v2
# parity depends on real checkpoints (sbv2-v2-multilingual-base.safetensors +
# deberta-v2 + deberta-v3), which are bulky and impractical to run on every
# PR — this workflow is opt-in (workflow_dispatch, weekly cron, and a narrow
# pull_request paths filter).
#
# Design (Blocker 2b/2c/3/5):
#
#   * Trigger: workflow_dispatch (owner-initiated) + weekly schedule (Mondays
#     06:00 UTC) + pull_request scoped to a narrow paths filter (sbv2
#     source, tests, converter, dumper, vendor, this workflow itself).
#     PRs that don't touch those paths never trigger this job.
#
#   * Fixture gate: tests/fixtures/sbv2/reference_dump.manifest.json.sha256
#     must be non-placeholder for the parity leg to actually run. Otherwise
#     clean skip (workflow step summary emits SKIP line). Fixture
#     provisioning strategy (LFS / release artifact / self-hosted runner) is
#     owner responsibility, pending decision post-merge.
#
#   * Initial workflow_dispatch = owner-initiated (per plan 2026-08-11).
#     Fabricated pass 禁止 (FR-EX-08) — this CI never fires until the owner
#     explicitly opts in.
#
#   * Root Cargo.lock is untouched (NFR-DS-02 zero-dep; final
#     `git diff --exit-code Cargo.lock` step is the tripwire).
#
#   * Not registered as a required check (no branch-protection promotion
#     at this time). It's a scheduled + owner-triggered gate until the acid
#     test is stable. Once green for 4+ consecutive weekly runs, owner can
#     promote it.
#
#   * Honest reporting (FR-EX-08): every observed delta is logged regardless
#     of PASS / FAIL. Per-tensor max |Δ| table is emitted to the step
#     summary for triage.

name: parity-sbv2-real

on:
  workflow_dispatch:
  schedule:
    # Weekly Monday 06:00 UTC — off-peak US/EU business hours so a HF hub
    # outage surfaces without blocking active development.
    - cron: '0 6 * * 1'
  pull_request:
    # Fires ONLY on sbv2-adjacent code. Non-matching PRs run the unit tests
    # (sbv2_synthetic.rs + sbv2_convert.rs) via the per-PR required jobs in
    # ci.yml.
    paths:
      - '.github/workflows/parity-sbv2-real.yml'
      - 'crates/vokra-models/src/sbv2/**'
      - 'crates/vokra-models/tests/parity_sbv2_real.rs'
      - 'crates/vokra-models/tests/sbv2_parity_atol_calibration.rs'
      - 'crates/vokra-convert/src/models/sbv2.rs'
      - 'crates/vokra-convert/src/models/sbv2_tokenizer.rs'
      - 'crates/vokra-convert/src/models/deberta_v2.rs'
      - 'crates/vokra-convert/src/models/deberta_v3.rs'
      - 'tools/parity/sbv2_dump_reference.py'
      - 'tools/parity/vendor/vits2/**'

# Cancel superseded runs on the same ref. The job is a ~30-45 minute one-shot
# (HF DL + convert + parity), so a rapid re-push should not double-book the
# runner. `cancel-in-progress: true` is safe here because the job has no
# side effects that outlive the workspace (no PyPI upload, no branch-write).
concurrency:
  group: parity-sbv2-real-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Python venv path (built once at job start, reused by later steps).
  PARITY_VENV: /tmp/vokra-py-parity-sbv2
  CARGO_TERM_COLOR: always

jobs:
  setup:
    name: gate (fixture check)
    runs-on: ubuntu-latest
    outputs:
      fixtures_present: ${{ steps.check.outputs.present }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        name: Check fixture sidecar
        run: |
          set -euo pipefail
          SIDECAR="tests/fixtures/sbv2/reference_dump.manifest.json.sha256"
          if [[ ! -f "$SIDECAR" ]]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=parity-sbv2-real fixture check::SKIP: $SIDECAR missing — fixture not provisioned"
            exit 0
          fi
          if grep -q "PLACEHOLDER" "$SIDECAR"; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=parity-sbv2-real fixture check::SKIP: $SIDECAR is placeholder — fixture not provisioned"
            exit 0
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"

  parity:
    name: parity (sbv2-real)
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.fixtures_present == 'true'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Provision parity venv (sbv2-required deps)
        # torch CPU for reference dumping (no CUDA in the runner).
        # safetensors for checkpoint handling. numpy is pinned per parity
        # audit precedents (defensive belt-and-suspenders).
        run: |
          set -euo pipefail
          python -m venv "${PARITY_VENV}"
          # shellcheck disable=SC1091
          . "${PARITY_VENV}/bin/activate"
          python -m pip install --upgrade pip
          # torch 2.4 (CPU) is the reference for SBV2 v2 upstream
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            'torch==2.4.*'
          python -m pip install \
            'numpy>=2,<3' \
            'safetensors>=0.4' \
            'huggingface_hub>=0.24,<1'
          python -m pip install 'hf_transfer>=0.1.9' || true
          python - <<'PY'
          import torch, numpy, safetensors, huggingface_hub
          print(
              f"sbv2 parity venv: "
              f"torch={torch.__version__} numpy={numpy.__version__} "
              f"safetensors={safetensors.__version__} "
              f"huggingface_hub={huggingface_hub.__version__}"
          )
          PY

      - name: Provision fixtures (owner-selected strategy)
        # Fixture provisioning is owner responsibility. This step is a
        # placeholder that exits with code 78 (neutral) until the owner
        # decides on a provisioning strategy (LFS / release artifact /
        # self-hosted runner). See
        # docs/superpowers/plans/2026-08-11-sbv2-v2-blockers-2b-2c-3.md
        # Wave 4 Task 20.
        run: |
          set -euo pipefail
          echo "TODO: fixture provisioning strategy (LFS / release artifact / self-hosted runner)"
          echo "For now, this step is a placeholder — real provisioning is owner responsibility"
          echo "See docs/superpowers/plans/2026-08-11-sbv2-v2-blockers-2b-2c-3.md Wave 4 Task 20"
          exit 78  # neutral exit until fixture provisioning is settled

      - name: Build vokra-cli (release)
        run: cargo build --release -p vokra-cli

      - name: Run parity_sbv2_real
        # Runs only when fixtures are provisioned (env var set by owner).
        # The harness compares 12 SBV2 stages against reference fixtures at
        # per-tensor atol derived from architectural bounds.
        if: false  # unreachable until fixture provisioning step is settled
        env:
          VOKRA_SBV2_GGUF: ${{ runner.temp }}/sbv2-v2-multilingual-base.gguf
          VOKRA_DEBERTA_V2_GGUF: ${{ runner.temp }}/deberta-v2-large-japanese-char-wwm.gguf
          VOKRA_DEBERTA_V3_GGUF: ${{ runner.temp }}/deberta-v3-large.gguf
        run: |
          set -euo pipefail
          cargo test --release -p vokra-models --test parity_sbv2_real \
            parity_sbv2_real_waveform_matches_reference_dump -- --nocapture

      - name: Zero-dependency invariant (root Cargo.lock unchanged, NFR-DS-02)
        # Belt-and-suspenders: pip-installing torch/safetensors inside the
        # parity venv must not touch the root Rust lockfile.
        run: git diff --exit-code Cargo.lock

      - name: Upload parity artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sbv2-parity-artifacts
          path: |
            ${{ runner.temp }}/parity-log.txt
            ${{ runner.temp }}/sbv2-v2-multilingual-base.gguf
            ${{ runner.temp }}/deberta-v2-large-japanese-char-wwm.gguf
            ${{ runner.temp }}/deberta-v3-large.gguf
          retention-days: 7
          if-no-files-found: warn
