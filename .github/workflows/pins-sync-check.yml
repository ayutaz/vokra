# Vokra pinned-external sync gate.
#
# Assert that `.github/pins.yaml` and `.github/workflows/*.yml` stay in
# lock-step. Two enforcement legs:
#
#   1. FORWARD (catalog → workflow): every `pinned_value` literal in
#      pins.yaml appears in its `owning_workflow`.
#   2. REVERSE (workflow → catalog): every typed SHA-shaped literal
#      (`_SHA256`, `_REVISION`, `_GIT_SHA`) in any workflow env is
#      registered in pins.yaml (or explicitly allowlisted with a
#      justification in `.github/pins-allowlist.txt`).
#
# The initial advisory soak ran from 2026-07-23 through 2026-08-20 with no
# observed false positives. It now hard-fails and runs on every PR so its
# stable context can be added to branch protection after this workflow is
# green on both the PR and main. Pushes remain path-filtered because an
# unrelated direct push cannot change either side of the invariant.
#
# Zero-dep NFR-DS-02: PyYAML in per-run venv (CI-only). Nothing lands in
# root Cargo.lock.

name: pins-sync-check

on:
  push:
    branches: [main]
    paths:
      - '.github/pins.yaml'
      - '.github/pins-allowlist.txt'
      - '.github/scripts/check_pins_sync.py'
      - '.github/workflows/*.yml'
  # Deliberately unfiltered: a required check must report a conclusion for
  # every PR, including documentation-only changes.
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pins-sync-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: pins.yaml ↔ workflow sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0

      - name: Install probe deps (isolated venv; does NOT touch root Cargo.lock)
        # Must run BEFORE the self-test step: check_pins_sync.py imports
        # PyYAML at the top of check_forward / check_reverse, so the
        # self-test needs the explicit uv-managed venv interpreter. The
        # "stdlib-only" claim in an
        # earlier revision was inaccurate — script uses PyYAML for the
        # catalog parse (deliberate, per-run venv is the isolation seam).
        shell: bash
        run: |
          set -euo pipefail
          uv venv --python 3.12 /tmp/vokra-pins-sync-venv
          uv pip install --python /tmp/vokra-pins-sync-venv/bin/python "pyyaml==6.0.2"

      - name: check_pins_sync self-test (via venv PyYAML)
        # Runs BEFORE the real check so a bad script is caught in seconds.
        # Requires the uv venv installed in the previous step.
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-project --python /tmp/vokra-pins-sync-venv/bin/python \
            python .github/scripts/check_pins_sync.py self-test

      - name: Run sync check (forward + reverse legs)
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-project --python /tmp/vokra-pins-sync-venv/bin/python \
            python .github/scripts/check_pins_sync.py check
