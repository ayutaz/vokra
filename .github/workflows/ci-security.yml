name: CI Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-security-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  workflow-security:
    name: workflow-security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --show-error --silent --location \
            --output /tmp/actionlint.tar.gz "${url}"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" \
            | sha256sum --check --strict
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -version

      - name: actionlint + ShellCheck
        run: /tmp/actionlint -shellcheck shellcheck -pyflakes "" .github/workflows/*.yml

      - name: Install pinned zizmor
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/zizmorcore/zizmor/releases/download/v1.29.0/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --show-error --silent --location \
            --output /tmp/zizmor.tar.gz "${url}"
          echo "dd96df044a6e8538d5f423790f453bdd03d49e5b2bcc38214acc41a2f1297839  /tmp/zizmor.tar.gz" \
            | sha256sum --check --strict
          tar -xzf /tmp/zizmor.tar.gz -C /tmp zizmor
          /tmp/zizmor --version

      - name: zizmor GitHub Actions security audit
        run: /tmp/zizmor --offline --persona regular --min-severity medium .

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Reject vulnerable or policy-incompatible dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, development
          license-check: true
          deny-licenses: >-
            GPL-1.0-only, GPL-1.0-or-later,
            GPL-2.0-only, GPL-2.0-or-later,
            GPL-3.0-only, GPL-3.0-or-later,
            LGPL-2.0-only, LGPL-2.0-or-later,
            LGPL-2.1-only, LGPL-2.1-or-later,
            LGPL-3.0-only, LGPL-3.0-or-later,
            AGPL-1.0-only, AGPL-1.0-or-later,
            AGPL-3.0-only, AGPL-3.0-or-later,
            SSPL-1.0
          # Exact, reviewed exceptions only. r-efi offers MIT/Apache as valid
          # alternatives but Dependency Review treats the LGPL arm of its OR
          # expression as denied. rust-cache is CI tooling and is neither
          # linked into nor distributed with Vokra; pinning its purl to the
          # reviewed action SHA prevents this exception from floating.
          allow-dependencies-licenses: >-
            pkg:cargo/r-efi@6.0.0,
            pkg:githubactions/Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
          # Exact, reviewed exceptions only. These are the residue of the
          # 2026-08-28 parity-oracle upgrade: fourteen of the seventeen
          # affected trees under tools/parity/** now resolve clean, and the
          # three below cannot move because their newest upstream release
          # still hard-pins a vulnerable dependency —
          #   qwen3_asr : qwen-asr==0.0.6   requires transformers==4.57.6
          #   parler_tts: parler-tts==0.2.2 requires transformers==4.46.1
          #   xcodec2   : xcodec2==0.1.5    requires torch==2.5.0
          #   cosyvoice2_reference: diffusers==0.29.0 is an immutable
          #     blocked upstream inventory with no uv.lock; its dedicated
          #     sync/model-download path is forbidden before license and
          #     soxr review. The exact diffusers advisories below are retained
          #     only for this fail-closed, non-executable inventory. The same
          #     inventory pins modelscope==1.20.0; its crafted-module advisory
          #     is likewise an exact exception, never permission to execute it.
          #     It also inventories onnx==1.16.0; the nine ONNX advisories below
          #     cover that immutable, non-executable dependency. No ONNX lock,
          #     sync, model download, or runtime route is enabled by these
          #     exceptions.
          # Those trees only dump independent reference tensors on VAST.
          # torch and Transformers appear nowhere else in the repository:
          # the Rust runtime carries no dependencies (check-zero-deps.sh)
          # and the published Python wheel declares `dependencies = []`, so
          # none of these can reach a shipped artefact. Listing exact GHSA
          # ids keeps every other advisory failing this gate. Tracked in
          # docs/m5-owner-verification-checklist.md section 8.
          allow-ghsas: >-
            GHSA-29pf-2h5f-8g72,
            GHSA-37mw-44qp-f5jm,
            GHSA-4w7r-h757-3r74,
            GHSA-53q9-r3pm-6pq6,
            GHSA-59p9-h35m-wg4g,
            GHSA-69w3-r845-3855,
            GHSA-6rvg-6v2m-4j46,
            GHSA-887c-mr87-cxwp,
            GHSA-9356-575x-2w9m,
            GHSA-f4hp-rmr7-r7v8,
            GHSA-fgcw-684q-jj6r,
            GHSA-fpwr-67px-3qhx,
            GHSA-hxxf-235m-72v3,
            GHSA-jjph-296x-mrcr,
            GHSA-q2wp-rjmx-x6x9,
            GHSA-qq3j-4f4f-9583,
            GHSA-qxrp-vhvm-j765,
            GHSA-rcv9-qm8p-9p6j,
            GHSA-vgrw-7cvw-pwgx,
            GHSA-wrfc-pvp9-mr9g,
            GHSA-98h9-4798-4q5v,
            GHSA-7wx4-6vff-v64p,
            GHSA-fhhq-h4hg-549x,
            GHSA-6rq9-53c3-f7vj,
            GHSA-h36j-8vv3-cj52,
            GHSA-hqmj-h5c6-369m,
            GHSA-3r9x-f23j-gc73,
            GHSA-538c-55jv-c5g9,
            GHSA-q56x-g2fj-4rj6,
            GHSA-cmw6-hcpp-c6jp,
            GHSA-p433-9wv8-28xj,
            GHSA-hwpq-hmq9-wj77
          vulnerability-check: true
          retry-on-snapshot-warnings: true
          show-openssf-scorecard: true
          warn-on-openssf-scorecard-level: 3
          show-patched-versions: true

  documentation-links:
    name: documentation-links
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check Markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          # Three requirement/ADR targets are intentionally gitignored-local
          # and therefore absent from a clean CI checkout. Tennessee's ELVIS
          # Act page resets automated clients; its two citations remain in
          # the docs but are excluded as a single known bot-blocked endpoint.
          args: >-
            --no-progress
            --max-retries 3
            --retry-wait-time 2
            --timeout 20
            --exclude '^file://.*/docs/(system-requirements\.md|adr/(0004-ios-build|M2-03-followup-rtf)\.md)$'
            --exclude '^https://www\.tn\.gov/governor/news/2024/1/10/tennessee-first-in-the-nation-to-address-ai-impact-on-music-industry\.html$'
            --exclude '^https://www\.hhs\.gov/hipaa/for-professionals/covered-entities/index\.html$'
            --exclude '^https://www\.hhs\.gov/hipaa/for-professionals/privacy/guidance/business-associates/index\.html$'
            README.md CONTRIBUTING.md .github docs
          fail: true
