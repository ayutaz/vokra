# Build the Python ctypes distribution from native libraries compiled on the
# platform named by each wheel. Release jobs call this workflow directly so
# they publish the artifacts produced for that exact tag/SHA and run.

name: Python native wheels

on:
  workflow_call:
    inputs:
      version:
        description: "Release tag or PEP 440 package version"
        required: false
        type: string
        default: "0.1.0.dev0"
    outputs:
      version:
        description: "Normalized PEP 440 package version"
        value: ${{ jobs.plan.outputs.version }}
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag or PEP 440 package version"
        required: false
        type: string
        default: "0.1.0.dev0"

permissions:
  contents: read

jobs:
  plan:
    name: Normalize version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - name: Normalize and validate package version
        id: version
        env:
          RAW_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="$(uv run --no-project --python 3.12 --with packaging==26.0 \
            python bindings/python/scripts/wheel_tools.py normalize-version "$RAW_VERSION")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  linux-x86_64:
    name: Linux x86_64 / manylinux 2.28
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container: quay.io/pypa/manylinux_2_28_x86_64@sha256:0c87ccb5996dab6c3b7612ee4fda7b80c4ab3c44a86c2541e4a872afdf4f131b
    env:
      VOKRA_BUILD_VERSION: ${{ needs.plan.outputs.version }}
      VOKRA_WHEEL_TAG: py3-none-linux_x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Build and stage vokra-capi
        run: |
          set -euo pipefail
          # --locked is the zero-dependency tripwire: Cargo must fail instead
          # of mutating the repository lockfile in this container checkout.
          cargo build --locked --release -p vokra-capi
          install -Dm755 target/release/libvokra.so \
            bindings/python/src/vokra/_lib/libvokra.so
      - name: Build and repair manylinux wheel
        run: |
          set -euo pipefail
          mkdir -p bindings/python/wheelhouse/raw bindings/python/wheelhouse/final
          uv build --project bindings/python --wheel \
            --out-dir bindings/python/wheelhouse/raw
          RAW_WHEEL="$(find bindings/python/wheelhouse/raw -maxdepth 1 -name '*.whl' -print)"
          test "$(find bindings/python/wheelhouse/raw -maxdepth 1 -name '*.whl' -print | wc -l)" -eq 1
          uv tool run --from auditwheel==6.7.0 auditwheel show "$RAW_WHEEL"
          uv tool run --from auditwheel==6.7.0 auditwheel repair \
            --plat manylinux_2_28_x86_64 \
            --wheel-dir bindings/python/wheelhouse/final \
            "$RAW_WHEEL"
      - name: Verify wheel archive, native architecture, and RECORD
        run: |
          set -euo pipefail
          WHEEL="$(find bindings/python/wheelhouse/final -maxdepth 1 -name '*.whl' -print)"
          test "$(find bindings/python/wheelhouse/final -maxdepth 1 -name '*.whl' -print | wc -l)" -eq 1
          uv run --no-project --python 3.12 python \
            bindings/python/scripts/wheel_tools.py verify \
            --wheel "$WHEEL" --target linux-x86_64 --version "$VOKRA_BUILD_VERSION"
      - name: Clean-install wheel on Python 3.9 and 3.12
        run: |
          set -euo pipefail
          for PYTHON_VERSION in 3.9 3.12; do
            VENV_PATH="${RUNNER_TEMP}/vokra-${PYTHON_VERSION}"
            uv venv --python "$PYTHON_VERSION" "$VENV_PATH"
            VENV_PYTHON="${VENV_PATH}/bin/python"
            uv pip install --python "$VENV_PYTHON" \
              --find-links bindings/python/wheelhouse/final \
              --no-index --no-deps "vokra==${VOKRA_BUILD_VERSION}"
            uv run --no-project --python "$VENV_PYTHON" python -c \
              'import os, vokra; from vokra import _bindings, _native; assert vokra.__version__ == os.environ["VOKRA_BUILD_VERSION"]; assert len(_bindings.PROTOTYPES) == 56; assert _native.load().vokra_version()'
          done
      - name: Run Python binding tests
        run: |
          set -euo pipefail
          VENV_PATH="${RUNNER_TEMP}/vokra-tests"
          uv venv --python 3.12 "$VENV_PATH"
          uv pip install --python "${VENV_PATH}/bin/python" pytest
          uv run --no-project --python "${VENV_PATH}/bin/python" \
            python -m pytest bindings/python/tests -q
      - name: Upload Linux wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vokra-python-wheel-linux-x86_64
          path: bindings/python/wheelhouse/final/*.whl
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS / ${{ matrix.arch }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            target: macos-arm64
            wheel_tag: py3-none-macosx_11_0_arm64
          - arch: x86_64
            runner: macos-15-intel
            target: macos-x86_64
            wheel_tag: py3-none-macosx_11_0_x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      VOKRA_BUILD_VERSION: ${{ needs.plan.outputs.version }}
      VOKRA_WHEEL_TAG: ${{ matrix.wheel_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Build and stage vokra-capi
        run: |
          set -euo pipefail
          cargo build --locked --release -p vokra-capi
          mkdir -p bindings/python/src/vokra/_lib
          install -m755 target/release/libvokra.dylib \
            bindings/python/src/vokra/_lib/libvokra.dylib
      - name: Build and repair macOS wheel
        env:
          WHEEL_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p bindings/python/wheelhouse/raw bindings/python/wheelhouse/final
          uv build --project bindings/python --wheel \
            --out-dir bindings/python/wheelhouse/raw
          RAW_WHEEL="$(find bindings/python/wheelhouse/raw -maxdepth 1 -name '*.whl' -print)"
          test "$(find bindings/python/wheelhouse/raw -maxdepth 1 -name '*.whl' -print | wc -l)" -eq 1
          uv tool run --from delocate==0.13.0 delocate-listdeps --all "$RAW_WHEEL"
          uv tool run --from delocate==0.13.0 delocate-wheel \
            --require-archs "$WHEEL_ARCH" \
            --wheel-dir bindings/python/wheelhouse/final \
            "$RAW_WHEEL"
      - name: Verify wheel archive, native architecture, and RECORD
        env:
          WHEEL_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          WHEEL="$(find bindings/python/wheelhouse/final -maxdepth 1 -name '*.whl' -print)"
          test "$(find bindings/python/wheelhouse/final -maxdepth 1 -name '*.whl' -print | wc -l)" -eq 1
          uv run --no-project --python 3.12 python \
            bindings/python/scripts/wheel_tools.py verify \
            --wheel "$WHEEL" --target "$WHEEL_TARGET" --version "$VOKRA_BUILD_VERSION"
      - name: Clean-install wheel on Python 3.9 and 3.12
        run: |
          set -euo pipefail
          for PYTHON_VERSION in 3.9 3.12; do
            VENV_PATH="${RUNNER_TEMP}/vokra-${PYTHON_VERSION}"
            uv venv --python "$PYTHON_VERSION" "$VENV_PATH"
            VENV_PYTHON="${VENV_PATH}/bin/python"
            uv pip install --python "$VENV_PYTHON" \
              --find-links bindings/python/wheelhouse/final \
              --no-index --no-deps "vokra==${VOKRA_BUILD_VERSION}"
            uv run --no-project --python "$VENV_PYTHON" python -c \
              'import os, vokra; from vokra import _bindings, _native; assert vokra.__version__ == os.environ["VOKRA_BUILD_VERSION"]; assert len(_bindings.PROTOTYPES) == 56; assert _native.load().vokra_version()'
          done
      - name: Run Python binding tests
        run: |
          set -euo pipefail
          VENV_PATH="${RUNNER_TEMP}/vokra-tests"
          uv venv --python 3.12 "$VENV_PATH"
          uv pip install --python "${VENV_PATH}/bin/python" pytest
          uv run --no-project --python "${VENV_PATH}/bin/python" \
            python -m pytest bindings/python/tests -q
      - name: Upload macOS wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vokra-python-wheel-${{ matrix.target }}
          path: bindings/python/wheelhouse/final/*.whl
          if-no-files-found: error
          retention-days: 7

  windows-x86_64:
    name: Windows x86_64
    needs: plan
    runs-on: windows-2025
    timeout-minutes: 180
    env:
      VOKRA_BUILD_VERSION: ${{ needs.plan.outputs.version }}
      VOKRA_WHEEL_TAG: py3-none-win_amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Build and stage vokra-capi
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release -p vokra-capi
          mkdir -p bindings/python/src/vokra/_lib
          cp target/release/vokra.dll bindings/python/src/vokra/_lib/vokra.dll
      - name: Build and repair Windows wheel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bindings/python/wheelhouse/raw bindings/python/wheelhouse/final
          uv build --project bindings/python --wheel \
            --out-dir bindings/python/wheelhouse/raw
          RAW_WHEEL="$(find bindings/python/wheelhouse/raw -maxdepth 1 -name '*.whl' -print)"
          test "$(find bindings/python/wheelhouse/raw -maxdepth 1 -name '*.whl' -print | wc -l)" -eq 1
          uv tool run --from delvewheel==1.13.0 delvewheel show \
            --analyze-existing "$RAW_WHEEL"
          uv tool run --from delvewheel==1.13.0 delvewheel repair \
            --analyze-existing --wheel-dir bindings/python/wheelhouse/final \
            "$RAW_WHEEL"
      - name: Verify wheel archive, native architecture, and RECORD
        shell: bash
        run: |
          set -euo pipefail
          WHEEL="$(find bindings/python/wheelhouse/final -maxdepth 1 -name '*.whl' -print)"
          test "$(find bindings/python/wheelhouse/final -maxdepth 1 -name '*.whl' -print | wc -l)" -eq 1
          uv run --no-project --python 3.12 python \
            bindings/python/scripts/wheel_tools.py verify \
            --wheel "$WHEEL" --target windows-x86_64 --version "$VOKRA_BUILD_VERSION"
      - name: Clean-install wheel on Python 3.9 and 3.12
        shell: bash
        run: |
          set -euo pipefail
          for PYTHON_VERSION in 3.9 3.12; do
            VENV_PATH="${RUNNER_TEMP}/vokra-${PYTHON_VERSION}"
            uv venv --python "$PYTHON_VERSION" "$VENV_PATH"
            VENV_PYTHON="${VENV_PATH}/Scripts/python.exe"
            uv pip install --python "$VENV_PYTHON" \
              --find-links bindings/python/wheelhouse/final \
              --no-index --no-deps "vokra==${VOKRA_BUILD_VERSION}"
            uv run --no-project --python "$VENV_PYTHON" python -c \
              'import os, vokra; from vokra import _bindings, _native; assert vokra.__version__ == os.environ["VOKRA_BUILD_VERSION"]; assert len(_bindings.PROTOTYPES) == 56; assert _native.load().vokra_version()'
          done
      - name: Run Python binding tests
        shell: bash
        run: |
          set -euo pipefail
          VENV_PATH="${RUNNER_TEMP}/vokra-tests"
          uv venv --python 3.12 "$VENV_PATH"
          VENV_PYTHON="${VENV_PATH}/Scripts/python.exe"
          uv pip install --python "$VENV_PYTHON" pytest
          uv run --no-project --python "$VENV_PYTHON" \
            python -m pytest bindings/python/tests -q
      - name: Upload Windows wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vokra-python-wheel-windows-x86_64
          path: bindings/python/wheelhouse/final/*.whl
          if-no-files-found: error
          retention-days: 7

  manifest:
    name: Verify four-wheel release set
    needs: [plan, linux-x86_64, macos, windows-x86_64]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # Avoid the action's network lookup of the moving "latest" manifest.
          # This matches the repository's VAST provisioning toolchain pin.
          version: "0.12.5"
          enable-cache: false
      - name: Download Linux wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: vokra-python-wheel-linux-x86_64
          path: dist
      - name: Download macOS arm64 wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: vokra-python-wheel-macos-arm64
          path: dist
      - name: Download macOS x86_64 wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: vokra-python-wheel-macos-x86_64
          path: dist
      - name: Download Windows wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: vokra-python-wheel-windows-x86_64
          path: dist
      - name: Verify exact target set and write deterministic manifest
        env:
          VOKRA_BUILD_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          uv run --no-project --python 3.12 python \
            bindings/python/scripts/wheel_tools.py manifest \
            --directory dist --version "$VOKRA_BUILD_VERSION" \
            --output dist/vokra-python-wheels.manifest.json
      - name: Upload complete wheel set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vokra-python-wheels
          path: |
            dist/*.whl
            dist/vokra-python-wheels.manifest.json
          if-no-files-found: error
          retention-days: 7
