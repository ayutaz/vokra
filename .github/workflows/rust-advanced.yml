name: Rust Advanced Quality

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "fuzz/**"
      - ".github/workflows/rust-advanced.yml"
  push:
    branches: [main]
  schedule:
    - cron: "37 1 * * 0"
  workflow_dispatch:
    inputs:
      focus:
        description: "Run the complete advanced suite or only the Miri job"
        required: true
        type: choice
        default: all
        options:
          - all
          - miri
          - miri-rng-diagnostic

permissions:
  contents: read

concurrency:
  group: rust-advanced-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  feature-combinations:
    name: cargo-hack-each-feature
    if: github.event_name != 'workflow_dispatch' || inputs.focus == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install cargo-hack
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2
        with:
          tool: cargo-hack
      - name: Check every declared feature independently
        # `--no-dev-deps` temporarily rewrites manifests, which necessarily
        # conflicts with Cargo's `--locked` invariant. `cargo check` does not
        # build dev-only targets here, so retain the reproducible lockfile and
        # exercise each declared feature without manifest mutation.
        run: cargo hack check --workspace --each-feature --locked
      - name: Audit isolated fuzz dependencies
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check licenses advisories bans
          manifest-path: fuzz/Cargo.toml
      - name: Root lockfile remains first-party only
        run: |
          git diff --exit-code Cargo.lock
          bash scripts/check-zero-deps.sh

  semver:
    name: cargo-semver-checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare publishable public APIs with the PR base
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          baseline-rev: ${{ github.event.pull_request.base.sha }}
          exclude: vokra-eval,vokra-kws-micro,vokra-parity,vokra-wasm-harness

  miri:
    name: miri
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.focus == 'all' || inputs.focus == 'miri'))
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install nightly Miri
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action implementation
        with:
          toolchain: nightly
          components: miri
      - name: Prepare Miri sysroot
        run: cargo +nightly miri setup
      - name: Verify native core integration and math tests at this exact HEAD
        # Keep the native exact-bit fixtures as a separate gate. The Miri
        # interpreter has no native-libm bit contract for transcendental ops.
        run: |
          set -euo pipefail
          rustc +nightly --version --verbose
          cargo +nightly --version
          cargo +nightly test --locked --no-fail-fast -p vokra-core --tests -- --nocapture --test-threads=1
          cargo +nightly test --locked --no-fail-fast -p vokra-math --tests -- --nocapture --test-threads=1
      - name: Run non-oracle core and math tests with default Miri rounding
        # Miri's many-seeds mode launches interpreter instances in parallel,
        # while host-I/O fixtures use PID+tag paths. Run each seed sequentially
        # so separate interpreters cannot access those fixtures simultaneously.
        # The three fixed-bit oracle integration targets are deliberately run
        # in the scoped no-extra-rounding leg below; every other current and
        # future core integration target stays in this default-rounding leg.
        run: |
          set -euo pipefail
          if ! command -v jq >/dev/null 2>&1; then
            echo "jq is required to inspect Cargo's exact target inventory" >&2
            exit 1
          fi
          jq --version
          metadata_file="$(mktemp)"
          targets_file="$(mktemp)"
          trap 'rm -f "${metadata_file}" "${targets_file}"' EXIT
          if ! cargo +nightly metadata --locked --no-deps --format-version 1 >"${metadata_file}"; then
            echo "Cargo metadata failed; refusing to run an incomplete Miri target inventory" >&2
            exit 1
          fi
          if ! jq -e 'type == "object" and (.packages | type == "array")' "${metadata_file}" >/dev/null; then
            echo "Cargo metadata was not a valid JSON object with packages" >&2
            exit 1
          fi
          if ! jq -e '
            [.packages[] | select(.name == "vokra-core" or .name == "vokra-math") | .name]
            | sort | . == ["vokra-core", "vokra-math"]
          ' "${metadata_file}" >/dev/null; then
            echo "Cargo metadata must contain exactly vokra-core and vokra-math" >&2
            exit 1
          fi
          if ! jq -e '
            [.packages[] | select(.name == "vokra-core" or .name == "vokra-math") | .targets[]
             | select((.kind | index("test")) != null)]
            | all(.[];
                ((.name | type) == "string")
                and (.name != "")
                and (."required-features" == null))
          ' "${metadata_file}" >/dev/null; then
            echo "test target inventory is invalid or uses unsupported required-features" >&2
            exit 1
          fi
          if ! jq -e '
            ([.packages[] | select(.name == "vokra-core") | .targets[]
              | select((.kind | index("test")) != null) | .name] as $tests
             | (["rng_philox_randn", "rng_torch_randn_cpu_parity", "rng_torch_randn_e2e"] - $tests)
             | length == 0)
          ' "${metadata_file}" >/dev/null; then
            echo "one or more fixed-bit RNG oracle targets are missing from Cargo metadata" >&2
            exit 1
          fi
          if ! jq -r '
            .packages[] | select(.name == "vokra-core" or .name == "vokra-math") as $package
            | $package.targets[]
            | select((.kind | index("test")) != null)
            | [$package.name, .name] | @tsv
          ' "${metadata_file}" >"${targets_file}"; then
            echo "failed to extract Cargo test targets" >&2
            exit 1
          fi
          oracle_targets=" rng_philox_randn rng_torch_randn_cpu_parity rng_torch_randn_e2e "
          for miri_seed in 0 1 2 3; do
            echo "Miri default-rounding seed ${miri_seed}"
            MIRIFLAGS="-Zmiri-disable-isolation -Zmiri-seed=${miri_seed}" \
              cargo +nightly miri test --locked -p vokra-core -p vokra-math --lib -- --nocapture --test-threads=1
            while IFS=$'\t' read -r target_package test_target; do
              if [[ "${target_package}" == "vokra-core" && "${oracle_targets}" == *" ${test_target} "* ]]; then
                continue
              fi
              echo "::group::Miri default-rounding ${test_target} seed ${miri_seed}"
              MIRIFLAGS="-Zmiri-disable-isolation -Zmiri-seed=${miri_seed}" \
                cargo +nightly miri test --locked -p "${target_package}" --test "${test_target}" -- --nocapture --test-threads=1
              echo "::endgroup::"
            done <"${targets_file}"
          done
      - name: Run fixed-bit RNG oracle tests with scoped no-extra rounding
        # Miri documents that f32 transcendental precision is not guaranteed
        # and may receive extra interpreter rounding. This flag is intentionally
        # restricted to the three existing fixed-bit oracle targets. It keeps
        # Miri's UB, aliasing, race, and host-I/O checks while avoiding a global
        # weakening of the default-rounding structural/state coverage above.
        run: |
          set -euo pipefail
          for miri_seed in 0 1 2 3; do
            echo "Miri no-extra-rounding oracle seed ${miri_seed}"
            echo "::group::Miri no-extra-rounding oracle targets seed ${miri_seed}"
            MIRIFLAGS="-Zmiri-disable-isolation -Zmiri-no-extra-rounding-error -Zmiri-seed=${miri_seed}" \
              cargo +nightly miri test --locked -p vokra-core \
              --test rng_philox_randn \
              --test rng_torch_randn_cpu_parity \
              --test rng_torch_randn_e2e \
              --no-fail-fast -- --nocapture --test-threads=1
            echo "::endgroup::"
          done
      - name: Interpret isolation-safe GGUF and quantization tests under Miri
        # The complete suite above executes every host-I/O test. These module
        # filters keep the additional isolated leg on the in-memory reader and
        # quantization paths without skipping or ignoring any test.
        env:
          MIRIFLAGS: -Zmiri-many-seeds=0..4
        run: |
          cargo +nightly miri test --locked -p vokra-core 'gguf::reader::' -- --nocapture --test-threads=1
          cargo +nightly miri test --locked -p vokra-core 'gguf::quant::' -- --nocapture --test-threads=1
          cargo +nightly miri test --locked -p vokra-core 'quant::' -- --nocapture --test-threads=1
          cargo +nightly miri test --locked -p vokra-math -- --nocapture --test-threads=1

  miri-rng-diagnostic:
    name: miri-rng-diagnostic
    if: github.event_name == 'workflow_dispatch' && inputs.focus == 'miri-rng-diagnostic'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action implementation
        with:
          toolchain: nightly
          components: miri
      - name: Prepare Miri sysroot
        run: cargo +nightly miri setup
      - name: Record toolchain and verify native core/math tests
        # This diagnostic is a focused investigation, not the full Miri gate.
        # Native tests preserve the real exact-bit contract at this HEAD.
        run: |
          set -euo pipefail
          rustc +nightly --version --verbose
          cargo +nightly --version
          cargo +nightly test --locked --no-fail-fast -p vokra-core --tests -- --nocapture --test-threads=1
          cargo +nightly test --locked --no-fail-fast -p vokra-math --tests -- --nocapture --test-threads=1
      - name: Collect default-rounding RNG baseline (diagnostic only)
        # Miri's default extra rounding may expose a native-libm bit-contract
        # mismatch. Continue through all three oracle targets and retain the
        # observed return codes as BASELINE_DIAGNOSTIC; this leg is not a gate
        # and does not turn a failure into a pass.
        run: |
          set -uo pipefail
          failures=()
          results=()
          for test_target in rng_philox_randn rng_torch_randn_cpu_parity rng_torch_randn_e2e; do
            echo "::group::BASELINE_DIAGNOSTIC ${test_target}"
            if MIRIFLAGS="-Zmiri-disable-isolation -Zmiri-seed=0" \
              cargo +nightly miri test --locked -p vokra-core --test "${test_target}" --no-fail-fast -- --nocapture --test-threads=1; then
              rc=0
              echo "BASELINE_DIAGNOSTIC: observed ${test_target} rc=${rc} (pass)"
            else
              rc=$?
              echo "BASELINE_DIAGNOSTIC: observed ${test_target} rc=${rc} (failure)"
              failures+=("${test_target}")
            fi
            results+=("${test_target}:rc=${rc}")
            echo "::endgroup::"
          done
          if ((${#failures[@]} == 0)); then
            echo "BASELINE_DIAGNOSTIC: observed failures=none"
          else
            echo "BASELINE_DIAGNOSTIC: observed failures=${failures[*]}"
          fi
          {
            echo "## Miri RNG A/B diagnostic (gate外)"
            echo "Default-rounding observations: ${results[*]}"
            echo "Observed nonzero return codes are recorded evidence, not an expected pass condition."
            echo "This diagnostic does not replace the full Miri gate or turn failures green."
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Verify RNG oracle control with scoped no-extra rounding
        # This is the required control leg. Only the three fixed-bit oracle
        # targets use the flag; the default baseline above remains visible.
        run: |
          set -euo pipefail
          echo "Miri no-extra-rounding oracle control seed 0"
          echo "::group::NO_EXTRA_CONTROL all oracle targets"
          MIRIFLAGS="-Zmiri-disable-isolation -Zmiri-no-extra-rounding-error -Zmiri-seed=0" \
            cargo +nightly miri test --locked -p vokra-core \
            --test rng_philox_randn \
            --test rng_torch_randn_cpu_parity \
            --test rng_torch_randn_e2e \
            --no-fail-fast -- --nocapture --test-threads=1
          echo "NO_EXTRA_CONTROL: all oracle targets=pass"
          echo "::endgroup::"

  address-sanitizer:
    name: address-sanitizer
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (github.event_name != 'workflow_dispatch' || inputs.focus == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install nightly with rust-src
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action implementation
        with:
          toolchain: nightly
          components: rust-src
      - name: Run unsafe-boundary tests under AddressSanitizer
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          RUSTFLAGS: -Zsanitizer=address
          RUSTDOCFLAGS: -Zsanitizer=address
        run: >-
          cargo +nightly test -Zbuild-std
          --target x86_64-unknown-linux-gnu
          -p vokra-mmap -p vokra-ops -p vokra-backend-cpu

  fuzz:
    name: fuzz-${{ matrix.target }}
    if: github.event_name != 'workflow_dispatch' || inputs.focus == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [gguf_parse, json_parse, safetensors_parse]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install nightly
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action implementation
        with:
          toolchain: nightly
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2
        with:
          tool: cargo-fuzz
      - name: Fuzz untrusted parser input
        working-directory: fuzz
        env:
          FUZZ_TARGET: ${{ matrix.target }}
        run: >-
          cargo fuzz run --target x86_64-unknown-linux-gnu "${FUZZ_TARGET}" --
          -max_total_time=300
          -max_len=1048576
          -rss_limit_mb=3072
          -print_final_stats=1
      - name: Upload crash and timeout reproducers
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-${{ matrix.target }}-artifacts
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 30
