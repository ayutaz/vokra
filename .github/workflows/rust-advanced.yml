name: Rust Advanced Quality

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "fuzz/**"
      - ".github/workflows/rust-advanced.yml"
  push:
    branches: [main]
  schedule:
    - cron: "37 1 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-advanced-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  feature-combinations:
    name: cargo-hack-each-feature
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install cargo-hack
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2
        with:
          tool: cargo-hack
      - name: Check every declared feature independently
        run: cargo hack check --workspace --each-feature --no-dev-deps --locked
      - name: Audit isolated fuzz dependencies
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check licenses advisories bans
          manifest-path: fuzz/Cargo.toml
      - name: Root lockfile remains first-party only
        run: |
          git diff --exit-code Cargo.lock
          bash scripts/check-zero-deps.sh

  semver:
    name: cargo-semver-checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare publishable public APIs with the PR base
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          baseline-rev: ${{ github.event.pull_request.base.sha }}
          exclude: vokra-eval,vokra-kws-micro,vokra-parity,vokra-wasm-harness

  miri:
    name: miri
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install nightly Miri
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action implementation
        with:
          toolchain: nightly
          components: miri
      - name: Prepare Miri sysroot
        run: cargo +nightly miri setup
      - name: Interpret parser and math tests under Miri
        env:
          MIRIFLAGS: -Zmiri-many-seeds=0..4
        run: cargo +nightly miri test -p vokra-core -p vokra-math

  address-sanitizer:
    name: address-sanitizer
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install nightly with rust-src
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action implementation
        with:
          toolchain: nightly
          components: rust-src
      - name: Run unsafe-boundary tests under AddressSanitizer
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          RUSTFLAGS: -Zsanitizer=address
          RUSTDOCFLAGS: -Zsanitizer=address
        run: >-
          cargo +nightly test -Zbuild-std
          --target x86_64-unknown-linux-gnu
          -p vokra-mmap -p vokra-ops -p vokra-backend-cpu

  fuzz:
    name: fuzz-${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [gguf_parse, json_parse, safetensors_parse]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install nightly
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action implementation
        with:
          toolchain: nightly
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2
        with:
          tool: cargo-fuzz
      - name: Fuzz untrusted parser input
        working-directory: fuzz
        env:
          FUZZ_TARGET: ${{ matrix.target }}
        run: >-
          cargo fuzz run "${FUZZ_TARGET}" --
          -max_total_time=300
          -max_len=1048576
          -rss_limit_mb=3072
          -print_final_stats=1
      - name: Upload crash and timeout reproducers
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-${{ matrix.target }}-artifacts
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 30
