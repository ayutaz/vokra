name: Rust Advanced Quality

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "fuzz/**"
      - ".github/workflows/rust-advanced.yml"
  push:
    branches: [main]
  schedule:
    - cron: "37 1 * * 0"
  workflow_dispatch:
    inputs:
      focus:
        description: "Run the complete advanced suite or only the Miri job"
        required: true
        type: choice
        default: all
        options:
          - all
          - miri
          - miri-rng-diagnostic
          - miri-math-diagnostic

permissions:
  contents: read

concurrency:
  group: rust-advanced-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  feature-combinations:
    name: cargo-hack-each-feature
    if: github.event_name != 'workflow_dispatch' || inputs.focus == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install cargo-hack
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-hack
      - name: Check every declared feature independently
        # `--no-dev-deps` temporarily rewrites manifests, which necessarily
        # conflicts with Cargo's `--locked` invariant. `cargo check` does not
        # build dev-only targets here, so retain the reproducible lockfile and
        # exercise each declared feature without manifest mutation.
        run: cargo hack check --workspace --each-feature --locked
      - name: Audit isolated fuzz dependencies
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check licenses advisories bans
          manifest-path: fuzz/Cargo.toml
      - name: Root lockfile remains first-party only
        run: |
          git diff --exit-code Cargo.lock
          bash scripts/check-zero-deps.sh

  semver:
    name: cargo-semver-checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare publishable public APIs with the PR base
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          baseline-rev: ${{ github.event.pull_request.base.sha }}
          exclude: vokra-eval,vokra-kws-micro,vokra-parity,vokra-wasm-harness

  miri:
    name: miri
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.focus == 'all' || inputs.focus == 'miri'))
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install nightly Miri
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action implementation
        with:
          toolchain: nightly
          components: miri
      - name: Prepare Miri sysroot
        run: cargo +nightly miri setup
      - name: Verify native core integration and math tests at this exact HEAD
        # Keep the native exact-bit fixtures as a separate gate. The Miri
        # interpreter has no native-libm bit contract for transcendental ops.
        run: |
          set -euo pipefail
          rustc +nightly --version --verbose
          cargo +nightly --version
          cargo +nightly test --locked --no-fail-fast -p vokra-core --tests -- --nocapture --test-threads=1
          cargo +nightly test --locked --no-fail-fast -p vokra-math --tests -- --nocapture --test-threads=1
      - name: Run math unit tests with exact default/no-extra partition
        # Miri's f32 transcendental precision is not guaranteed under its
        # default extra-rounding mode. Keep the five std-reference oracles in
        # a narrowly scoped no-extra leg, while every other math unit test
        # remains a normal default-rounding gate. Test names come from the
        # live --list inventory and are always passed with --exact; no
        # substring filters or partial-match skips are permitted.
        run: |
          set -euo pipefail

          run_math_partition() (
            local route_name="$1"
            local isolation_flag="$2"
            local inventory_dir
            local list_stdout
            local list_stderr
            local inventory
            inventory_dir="$(mktemp -d)"
            list_stdout="${inventory_dir}/list.stdout"
            list_stderr="${inventory_dir}/list.stderr"
            inventory="${inventory_dir}/inventory"
            trap 'rm -rf "${inventory_dir}"' EXIT

            local -a no_extra_names=(
              "tests::exp_matches_std_densely_over_the_whole_domain"
              "tests::tanh_matches_std_densely_and_is_odd_saturating"
              "tests::sin_matches_std_densely_across_ten_periods_and_is_odd"
              "tests::cos_matches_std_densely_across_ten_periods_and_is_even"
              "tests::log_matches_std_across_forty_decades"
            )
            if [[ "${#no_extra_names[@]}" -ne 5 ]]; then
              echo "no-extra math target list must contain exactly five names" >&2
              return 1
            fi
            local -A no_extra_seen=()
            local required_name
            for required_name in "${no_extra_names[@]}"; do
              if [[ "${no_extra_seen["${required_name}"]+present}" == present ]]; then
                echo "duplicate no-extra math target: ${required_name}" >&2
                return 1
              fi
              no_extra_seen["${required_name}"]=1
            done

            is_no_extra_name() {
              local candidate="$1"
              local required
              for required in "${no_extra_names[@]}"; do
                if [[ "${candidate}" == "${required}" ]]; then
                  return 0
                fi
              done
              return 1
            }

            echo "::group::Inventory math tests (${route_name})"
            if ! MIRIFLAGS="${isolation_flag} -Zmiri-seed=0" \
              cargo +nightly miri test --locked -p vokra-math --lib -- --list \
              >"${list_stdout}" 2>"${list_stderr}"; then
              cat "${list_stderr}" >&2
              echo "math --list failed for ${route_name}" >&2
              return 1
            fi
            if ! awk '
              BEGIN { test_count = 0; summary_count = 0; summary_tests = -1; bad = 0 }
              /^[^[:space:]].*: test$/ {
                name = $0
                sub(/: test$/, "", name)
                if (name == "" || seen[name]++) {
                  bad = 1
                }
                print name
                test_count++
                next
              }
              /^[0-9]+ tests?, [0-9]+ benchmarks?$/ {
                summary_count++
                split($0, fields, " ")
                summary_tests = fields[1] + 0
                next
              }
              /^[[:space:]]*$/ { next }
              { bad = 1 }
              END {
                if (bad || summary_count != 1 || test_count == 0 || summary_tests != test_count) {
                  exit 1
                }
              }
            ' "${list_stdout}" >"${inventory}"; then
              cat "${list_stdout}" >&2
              echo "invalid, empty, duplicate, or incomplete math test inventory for ${route_name}" >&2
              return 1
            fi
            echo "Inventory: $(wc -l <"${inventory}") exact math tests"
            echo "::endgroup::"

            local -a default_names=()
            local -A inventory_seen=()
            local test_name
            while IFS= read -r test_name; do
              inventory_seen["${test_name}"]=1
              if ! is_no_extra_name "${test_name}"; then
                default_names+=("${test_name}")
              fi
            done <"${inventory}"
            for required_name in "${no_extra_names[@]}"; do
              if [[ "${inventory_seen["${required_name}"]+present}" != present ]]; then
                echo "required exact math test missing: ${required_name}" >&2
                return 1
              fi
            done
            if [[ "$(( ${#default_names[@]} + ${#no_extra_names[@]} ))" -ne "$(wc -l <"${inventory}")" ]]; then
              echo "math inventory partition is incomplete or overlapping" >&2
              return 1
            fi

            local -a pass_default_names=()
            local -a pass_no_extra_names=()
            local -A pass_default_seen=()
            local -A pass_no_extra_seen=()
            run_exact_math_test() {
              local rounding_label="$1"
              local rounding_flag="$2"
              local seed="$3"
              local test_name="$4"
              local log_file
              local rc
              log_file="${inventory_dir}/${rounding_label}-${seed}-${RANDOM}.log"
              echo "::group::Miri ${route_name} ${rounding_label} seed ${seed} ${test_name}"
              if MIRIFLAGS="${isolation_flag} ${rounding_flag} -Zmiri-seed=${seed}" \
                cargo +nightly miri test --locked -p vokra-math --lib \
                --no-fail-fast -- --exact "${test_name}" --nocapture --test-threads=1 \
                >"${log_file}" 2>&1; then
                rc=0
              else
                rc=$?
              fi
              cat "${log_file}"
              if [[ "${rc}" -ne 0 ]] || ! awk '
                BEGIN { summaries = 0; good = 0 }
                /^test result: / {
                  summaries++
                  if ($0 ~ /^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured;/) {
                    good++
                  }
                }
                END { if (summaries != 1 || good != 1) exit 1 }
              ' "${log_file}"; then
                echo "math exact test did not produce one passing, non-ignored result: ${test_name}" >&2
                echo "::endgroup::"
                return 1
              fi
              if [[ "${rounding_label}" == "default-rounding" ]]; then
                if [[ "${pass_default_seen["${test_name}"]+present}" == present ]]; then
                  echo "duplicate default PASS record: ${test_name}" >&2
                  return 1
                fi
                pass_default_seen["${test_name}"]=1
                pass_default_names+=("${test_name}")
              else
                if [[ "${pass_no_extra_seen["${test_name}"]+present}" == present ]]; then
                  echo "duplicate no-extra PASS record: ${test_name}" >&2
                  return 1
                fi
                pass_no_extra_seen["${test_name}"]=1
                pass_no_extra_names+=("${test_name}")
              fi
              echo "::endgroup::"
            }

            for miri_seed in 0 1 2 3; do
              pass_default_names=()
              pass_no_extra_names=()
              pass_default_seen=()
              pass_no_extra_seen=()
              for test_name in "${default_names[@]}"; do
                run_exact_math_test "default-rounding" "" "${miri_seed}" "${test_name}"
              done
              for test_name in "${no_extra_names[@]}"; do
                run_exact_math_test "no-extra-rounding" "-Zmiri-no-extra-rounding-error" "${miri_seed}" "${test_name}"
              done
              if [[ "$(( ${#pass_default_names[@]} + ${#pass_no_extra_names[@]} ))" -ne "$(wc -l <"${inventory}")" ]]; then
                echo "math PASS record union does not cover inventory exactly for seed ${miri_seed}" >&2
                return 1
              fi
              while IFS= read -r test_name; do
                if is_no_extra_name "${test_name}"; then
                  if [[ "${pass_no_extra_seen["${test_name}"]+present}" != present ]] || \
                    [[ "${pass_default_seen["${test_name}"]+present}" == present ]]; then
                    echo "math PASS record partition mismatch for no-extra target: ${test_name}" >&2
                    return 1
                  fi
                elif [[ "${pass_default_seen["${test_name}"]+present}" != present ]] || \
                  [[ "${pass_no_extra_seen["${test_name}"]+present}" == present ]]; then
                  echo "math PASS record partition mismatch for default target: ${test_name}" >&2
                  return 1
                fi
              done <"${inventory}"
            done
          )

          run_math_partition "host-io" "-Zmiri-disable-isolation"
          run_math_partition "isolated" ""
      - name: Run non-oracle core and math tests with default Miri rounding
        # Miri's many-seeds mode launches interpreter instances in parallel,
        # while host-I/O fixtures use PID+tag paths. Run each seed sequentially
        # so separate interpreters cannot access those fixtures simultaneously.
        # The three fixed-bit oracle integration targets are deliberately run
        # in the scoped no-extra-rounding leg below; every other current and
        # future core integration target stays in this default-rounding leg.
        run: |
          set -euo pipefail
          if ! command -v jq >/dev/null 2>&1; then
            echo "jq is required to inspect Cargo's exact target inventory" >&2
            exit 1
          fi
          jq --version
          metadata_file="$(mktemp)"
          targets_file="$(mktemp)"
          trap 'rm -f "${metadata_file}" "${targets_file}"' EXIT
          if ! cargo +nightly metadata --locked --no-deps --format-version 1 >"${metadata_file}"; then
            echo "Cargo metadata failed; refusing to run an incomplete Miri target inventory" >&2
            exit 1
          fi
          if ! jq -e 'type == "object" and (.packages | type == "array")' "${metadata_file}" >/dev/null; then
            echo "Cargo metadata was not a valid JSON object with packages" >&2
            exit 1
          fi
          if ! jq -e '
            [.packages[] | select(.name == "vokra-core" or .name == "vokra-math") | .name]
            | sort | . == ["vokra-core", "vokra-math"]
          ' "${metadata_file}" >/dev/null; then
            echo "Cargo metadata must contain exactly vokra-core and vokra-math" >&2
            exit 1
          fi
          if ! jq -e '
            [.packages[] | select(.name == "vokra-core" or .name == "vokra-math") | .targets[]
             | select((.kind | index("test")) != null)]
            | all(.[];
                ((.name | type) == "string")
                and (.name != "")
                and (."required-features" == null))
          ' "${metadata_file}" >/dev/null; then
            echo "test target inventory is invalid or uses unsupported required-features" >&2
            exit 1
          fi
          if ! jq -e '
            ([.packages[] | select(.name == "vokra-core") | .targets[]
              | select((.kind | index("test")) != null) | .name] as $tests
             | (["rng_philox_randn", "rng_torch_randn_cpu_parity", "rng_torch_randn_e2e"] - $tests)
             | length == 0)
          ' "${metadata_file}" >/dev/null; then
            echo "one or more fixed-bit RNG oracle targets are missing from Cargo metadata" >&2
            exit 1
          fi
          if ! jq -r '
            .packages[] | select(.name == "vokra-core" or .name == "vokra-math") as $package
            | $package.targets[]
            | select((.kind | index("test")) != null)
            | [$package.name, .name] | @tsv
          ' "${metadata_file}" >"${targets_file}"; then
            echo "failed to extract Cargo test targets" >&2
            exit 1
          fi
          oracle_targets=" rng_philox_randn rng_torch_randn_cpu_parity rng_torch_randn_e2e "
          for miri_seed in 0 1 2 3; do
            echo "Miri default-rounding seed ${miri_seed}"
            MIRIFLAGS="-Zmiri-disable-isolation -Zmiri-seed=${miri_seed}" \
              cargo +nightly miri test --locked -p vokra-core --lib -- --nocapture --test-threads=1
            while IFS=$'\t' read -r target_package test_target; do
              if [[ "${target_package}" == "vokra-core" && "${oracle_targets}" == *" ${test_target} "* ]]; then
                continue
              fi
              echo "::group::Miri default-rounding ${test_target} seed ${miri_seed}"
              MIRIFLAGS="-Zmiri-disable-isolation -Zmiri-seed=${miri_seed}" \
                cargo +nightly miri test --locked -p "${target_package}" --test "${test_target}" -- --nocapture --test-threads=1
              echo "::endgroup::"
            done <"${targets_file}"
          done
      - name: Run fixed-bit RNG oracle tests with scoped no-extra rounding
        # Miri documents that f32 transcendental precision is not guaranteed
        # and may receive extra interpreter rounding. This flag is intentionally
        # restricted to the three existing fixed-bit oracle targets. It keeps
        # Miri's UB, aliasing, race, and host-I/O checks while avoiding a global
        # weakening of the default-rounding structural/state coverage above.
        run: |
          set -euo pipefail
          for miri_seed in 0 1 2 3; do
            echo "Miri no-extra-rounding oracle seed ${miri_seed}"
            echo "::group::Miri no-extra-rounding oracle targets seed ${miri_seed}"
            MIRIFLAGS="-Zmiri-disable-isolation -Zmiri-no-extra-rounding-error -Zmiri-seed=${miri_seed}" \
              cargo +nightly miri test --locked -p vokra-core \
              --test rng_philox_randn \
              --test rng_torch_randn_cpu_parity \
              --test rng_torch_randn_e2e \
              --no-fail-fast -- --nocapture --test-threads=1
            echo "::endgroup::"
          done
      - name: Interpret isolation-safe GGUF and quantization tests under Miri
        # The complete suite above executes every host-I/O test. These module
        # filters keep the additional isolated leg on the in-memory reader and
        # quantization paths without skipping or ignoring any test.
        env:
          MIRIFLAGS: -Zmiri-many-seeds=0..4
        run: |
          cargo +nightly miri test --locked -p vokra-core 'gguf::reader::' -- --nocapture --test-threads=1
          cargo +nightly miri test --locked -p vokra-core 'gguf::quant::' -- --nocapture --test-threads=1
          cargo +nightly miri test --locked -p vokra-core 'quant::' -- --nocapture --test-threads=1

  miri-rng-diagnostic:
    name: miri-rng-diagnostic
    if: github.event_name == 'workflow_dispatch' && inputs.focus == 'miri-rng-diagnostic'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action implementation
        with:
          toolchain: nightly
          components: miri
      - name: Prepare Miri sysroot
        run: cargo +nightly miri setup
      - name: Record toolchain and verify native core/math tests
        # This diagnostic is a focused investigation, not the full Miri gate.
        # Native tests preserve the real exact-bit contract at this HEAD.
        run: |
          set -euo pipefail
          rustc +nightly --version --verbose
          cargo +nightly --version
          cargo +nightly test --locked --no-fail-fast -p vokra-core --tests -- --nocapture --test-threads=1
          cargo +nightly test --locked --no-fail-fast -p vokra-math --tests -- --nocapture --test-threads=1
      - name: Collect default-rounding RNG baseline (diagnostic only)
        # Miri's default extra rounding may expose a native-libm bit-contract
        # mismatch. Continue through all three oracle targets and retain the
        # observed return codes as BASELINE_DIAGNOSTIC; this leg is not a gate
        # and does not turn a failure into a pass.
        run: |
          set -uo pipefail
          failures=()
          results=()
          for test_target in rng_philox_randn rng_torch_randn_cpu_parity rng_torch_randn_e2e; do
            echo "::group::BASELINE_DIAGNOSTIC ${test_target}"
            if MIRIFLAGS="-Zmiri-disable-isolation -Zmiri-seed=0" \
              cargo +nightly miri test --locked -p vokra-core --test "${test_target}" --no-fail-fast -- --nocapture --test-threads=1; then
              rc=0
              echo "BASELINE_DIAGNOSTIC: observed ${test_target} rc=${rc} (pass)"
            else
              rc=$?
              echo "BASELINE_DIAGNOSTIC: observed ${test_target} rc=${rc} (failure)"
              failures+=("${test_target}")
            fi
            results+=("${test_target}:rc=${rc}")
            echo "::endgroup::"
          done
          if ((${#failures[@]} == 0)); then
            echo "BASELINE_DIAGNOSTIC: observed failures=none"
          else
            echo "BASELINE_DIAGNOSTIC: observed failures=${failures[*]}"
          fi
          {
            echo "## Miri RNG A/B diagnostic (gate外)"
            echo "Default-rounding observations: ${results[*]}"
            echo "Observed nonzero return codes are recorded evidence, not an expected pass condition."
            echo "This diagnostic does not replace the full Miri gate or turn failures green."
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Verify RNG oracle control with scoped no-extra rounding
        # This is the required control leg. Only the three fixed-bit oracle
        # targets use the flag; the default baseline above remains visible.
        run: |
          set -euo pipefail
          echo "Miri no-extra-rounding oracle control seed 0"
          echo "::group::NO_EXTRA_CONTROL all oracle targets"
          MIRIFLAGS="-Zmiri-disable-isolation -Zmiri-no-extra-rounding-error -Zmiri-seed=0" \
            cargo +nightly miri test --locked -p vokra-core \
            --test rng_philox_randn \
            --test rng_torch_randn_cpu_parity \
            --test rng_torch_randn_e2e \
            --no-fail-fast -- --nocapture --test-threads=1
          echo "NO_EXTRA_CONTROL: all oracle targets=pass"
          echo "::endgroup::"

  miri-math-diagnostic:
    name: miri-math-diagnostic
    if: github.event_name == 'workflow_dispatch' && inputs.focus == 'miri-math-diagnostic'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action implementation
        with:
          toolchain: nightly
          components: miri
      - name: Prepare Miri sysroot
        run: cargo +nightly miri setup
      - name: Record toolchain and verify native math tests
        # Native std/libm remains the exact production comparison baseline.
        # This diagnostic never changes that native gate.
        run: |
          set -euo pipefail
          rustc +nightly --version --verbose
          cargo +nightly --version
          cargo +nightly test --locked --no-fail-fast -p vokra-math --tests -- --nocapture --test-threads=1
      - name: Collect default-rounding math baseline (diagnostic only)
        # The default leg records every seed's real return code without
        # turning an observed failure into a pass. It is outside full Miri
        # acceptance and is paired with the scoped no-extra control below.
        run: |
          set -uo pipefail
          failures=()
          results=()
          for miri_seed in 0 1 2 3; do
            echo "::group::BASELINE_DIAGNOSTIC math seed ${miri_seed}"
            if MIRIFLAGS="-Zmiri-disable-isolation -Zmiri-seed=${miri_seed}" \
              cargo +nightly miri test --locked -p vokra-math --lib --no-fail-fast -- --nocapture --test-threads=1; then
              rc=0
              echo "BASELINE_DIAGNOSTIC: observed math seed=${miri_seed} rc=${rc} (pass)"
            else
              rc=$?
              echo "BASELINE_DIAGNOSTIC: observed math seed=${miri_seed} rc=${rc} (failure)"
              failures+=("seed=${miri_seed}")
            fi
            results+=("seed=${miri_seed}:rc=${rc}")
            echo "::endgroup::"
          done
          if ((${#failures[@]} == 0)); then
            echo "BASELINE_DIAGNOSTIC: observed failures=none"
          else
            echo "BASELINE_DIAGNOSTIC: observed failures=${failures[*]}"
          fi
          {
            echo "## Miri math A/B diagnostic (gate外)"
            echo "Default-rounding observations: ${results[*]}"
            echo "Observed nonzero return codes are recorded evidence, not an expected pass condition."
            echo "This diagnostic-only job is outside full Miri acceptance and does not replace or weaken the full gate."
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Verify no-extra-rounding math control (diagnostic gate)
        # This whole-math no-extra leg is limited to this A/B diagnostic. It
        # must not be copied into the full Miri gate; structural and special
        # value coverage remains under default rounding there.
        run: |
          set -uo pipefail
          failures=()
          results=()
          for miri_seed in 0 1 2 3; do
            echo "::group::NO_EXTRA_CONTROL math seed ${miri_seed}"
            if MIRIFLAGS="-Zmiri-disable-isolation -Zmiri-no-extra-rounding-error -Zmiri-seed=${miri_seed}" \
              cargo +nightly miri test --locked -p vokra-math --lib --no-fail-fast -- --nocapture --test-threads=1; then
              rc=0
              echo "NO_EXTRA_CONTROL: observed math seed=${miri_seed} rc=${rc} (pass)"
            else
              rc=$?
              echo "NO_EXTRA_CONTROL: observed math seed=${miri_seed} rc=${rc} (failure)"
              failures+=("seed=${miri_seed}")
            fi
            results+=("seed=${miri_seed}:rc=${rc}")
            echo "::endgroup::"
          done
          if ((${#failures[@]} == 0)); then
            echo "NO_EXTRA_CONTROL: observed failures=none"
          else
            echo "NO_EXTRA_CONTROL: observed failures=${failures[*]}"
          fi
          {
            echo "No-extra-rounding observations: ${results[*]}"
            echo "This whole-math no-extra leg is diagnostic A/B evidence only; it is not the full Miri acceptance configuration."
          } >> "${GITHUB_STEP_SUMMARY}"
          if ((${#failures[@]} != 0)); then
            echo "NO_EXTRA_CONTROL failed for one or more seeds; retain the diagnostic failure." >&2
            exit 1
          fi

  address-sanitizer:
    name: address-sanitizer
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (github.event_name != 'workflow_dispatch' || inputs.focus == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install nightly with rust-src
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action implementation
        with:
          toolchain: nightly
          components: rust-src
      - name: Run unsafe-boundary tests under AddressSanitizer
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          RUSTFLAGS: -Zsanitizer=address
          RUSTDOCFLAGS: -Zsanitizer=address
        run: >-
          cargo +nightly test -Zbuild-std
          --target x86_64-unknown-linux-gnu
          -p vokra-mmap -p vokra-ops -p vokra-backend-cpu

  fuzz:
    name: fuzz-${{ matrix.target }}
    if: github.event_name != 'workflow_dispatch' || inputs.focus == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [gguf_parse, json_parse, safetensors_parse]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install nightly
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action implementation
        with:
          toolchain: nightly
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-fuzz
      - name: Fuzz untrusted parser input
        working-directory: fuzz
        env:
          FUZZ_TARGET: ${{ matrix.target }}
        run: >-
          cargo fuzz run --target x86_64-unknown-linux-gnu "${FUZZ_TARGET}" --
          -max_total_time=300
          -max_len=1048576
          -rss_limit_mb=3072
          -print_final_stats=1
      - name: Upload crash and timeout reproducers
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}-artifacts
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 30
