name: Kyutai Candle cache observer compatibility (one-shot)

on:
  pull_request:
    types: [labeled]
    paths:
      - '.github/workflows/kyutai-candle-cache-observer-compatibility.yml'
      - '.github/workflows/kyutai-candle-cpu-compatibility.yml'
      - '.github/workflows/kyutai-candle-paste-application.yml'
      - '.gitattributes'
      - 'tools/parity/kyutai_candle_reference/asr_observer_patch.py'
      - 'tools/parity/kyutai_candle_reference/cache_observer_patch.py'
      - 'tools/parity/kyutai_candle_reference/check_cpu_compatibility.py'
      - 'tools/parity/kyutai_candle_reference/check_cache_observer_compatibility.py'
      - 'tools/parity/kyutai_candle_reference/test_cpu_compatibility.py'
      - 'tools/parity/kyutai_candle_reference/test_asr_observer_patch.py'
      - 'tools/parity/kyutai_candle_reference/test_cache_observer_patch.py'
      - 'tools/parity/kyutai_candle_reference/test_cache_observer_compatibility.py'
      - 'tools/parity/kyutai_candle_reference/test_cache_observer_workflow.py'
      - 'tools/parity/kyutai_candle_reference/apply_paste_overlay.py'
      - 'tools/parity/kyutai_candle_reference/collect_metadata.py'
      - 'tools/parity/kyutai_candle_reference/pin_remediation_diagnostic.py'
      - 'tools/parity/kyutai_candle_reference/prepare_paste_overlay.py'
      - 'tools/parity/kyutai_candle_reference/pinned-asr.rs'
      - 'tools/parity/kyutai_candle_reference/pinned-LICENSE'
      - 'tools/parity/kyutai_candle_reference/pinned-transformer.rs'
      - 'tools/parity/kyutai_candle_reference/pinned-lm.rs'
      - 'tools/parity/kyutai_candle_reference/application-evidence-89/application_receipt.json'
      - 'tools/parity/kyutai_candle_reference/application-evidence-89/baseline_cpu_metadata.json'
      - 'tools/parity/kyutai_candle_reference/application-evidence-89/baseline_whole_metadata.json'
      - 'tools/parity/kyutai_candle_reference/application-evidence-89/candidate.lock'
      - 'tools/parity/kyutai_candle_reference/application-evidence-89/final.lock'
      - 'tools/parity/kyutai_candle_reference/application-evidence-89/overlay_cpu_metadata.json'
      - 'tools/parity/kyutai_candle_reference/application-evidence-89/overlay_whole_metadata.json'
      - 'tools/parity/kyutai_candle_reference/application-evidence-89/source_receipt.json'
      - 'docs/handoff/kyutai-candle-paste-parents-source-2026-10-15.json'
      - 'docs/handoff/kyutai-candle-pastey-source-2026-10-15.json'
      - 'docs/handoff/kyutai-candle-candidate-2026-10-15.lock'
      - 'docs/handoff/kyutai-candle-current-cpu-evidence-2026-10-16.json'

permissions:
  contents: read

concurrency:
  group: kyutai-candle-cache-observer-compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  cache-observer-compatibility:
    name: Linux cache observer source compatibility (one-shot, no model execution)
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'candle-cache-observer-compatibility-once-20261017' &&
      github.event.pull_request.number == 259 &&
      github.run_attempt == 1 &&
      github.repository == 'ayutaz/vokra' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact compatibility inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .gitattributes
            .github/workflows/kyutai-candle-cache-observer-compatibility.yml
            .github/workflows/kyutai-candle-cpu-compatibility.yml
            .github/workflows/kyutai-candle-paste-application.yml
            tools/parity/kyutai_candle_reference/asr_observer_patch.py
            tools/parity/kyutai_candle_reference/cache_observer_patch.py
            tools/parity/kyutai_candle_reference/check_cpu_compatibility.py
            tools/parity/kyutai_candle_reference/check_cache_observer_compatibility.py
            tools/parity/kyutai_candle_reference/test_cpu_compatibility.py
            tools/parity/kyutai_candle_reference/test_asr_observer_patch.py
            tools/parity/kyutai_candle_reference/test_cache_observer_patch.py
            tools/parity/kyutai_candle_reference/test_cache_observer_compatibility.py
            tools/parity/kyutai_candle_reference/test_cache_observer_workflow.py
            tools/parity/kyutai_candle_reference/apply_paste_overlay.py
            tools/parity/kyutai_candle_reference/collect_metadata.py
            tools/parity/kyutai_candle_reference/pin_remediation_diagnostic.py
            tools/parity/kyutai_candle_reference/prepare_paste_overlay.py
            tools/parity/kyutai_candle_reference/pinned-asr.rs
            tools/parity/kyutai_candle_reference/pinned-LICENSE
            tools/parity/kyutai_candle_reference/pinned-transformer.rs
            tools/parity/kyutai_candle_reference/pinned-lm.rs
            tools/parity/kyutai_candle_reference/application-evidence-89/application_receipt.json
            tools/parity/kyutai_candle_reference/application-evidence-89/baseline_cpu_metadata.json
            tools/parity/kyutai_candle_reference/application-evidence-89/baseline_whole_metadata.json
            tools/parity/kyutai_candle_reference/application-evidence-89/candidate.lock
            tools/parity/kyutai_candle_reference/application-evidence-89/final.lock
            tools/parity/kyutai_candle_reference/application-evidence-89/overlay_cpu_metadata.json
            tools/parity/kyutai_candle_reference/application-evidence-89/overlay_whole_metadata.json
            tools/parity/kyutai_candle_reference/application-evidence-89/source_receipt.json
            docs/handoff/kyutai-candle-paste-parents-source-2026-10-15.json
            docs/handoff/kyutai-candle-pastey-source-2026-10-15.json
            docs/handoff/kyutai-candle-candidate-2026-10-15.lock
            docs/handoff/kyutai-candle-current-cpu-evidence-2026-10-16.json

      - name: Verify sparse source boundary
        shell: bash
        run: |
          set -euo pipefail
          test ! -e tools/parity/cosyvoice2_llm_reference
          test ! -e tests/parity/silero_vad
          evidence_root="$GITHUB_WORKSPACE/tools/parity/kyutai_candle_reference/application-evidence-89"
          test -d "$evidence_root"
          test ! -e "$evidence_root/README.md"
          test ! -e "$evidence_root/.git"
          test "$(find "$evidence_root" -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 8
          test -f "$evidence_root/application_receipt.json"
          test -f "$evidence_root/baseline_cpu_metadata.json"
          test -f "$evidence_root/baseline_whole_metadata.json"
          test -f "$evidence_root/candidate.lock"
          test -f "$evidence_root/final.lock"
          test -f "$evidence_root/overlay_cpu_metadata.json"
          test -f "$evidence_root/overlay_whole_metadata.json"
          test -f "$evidence_root/source_receipt.json"
          test -f .gitattributes
          test -f tools/parity/kyutai_candle_reference/asr_observer_patch.py
          test -f tools/parity/kyutai_candle_reference/cache_observer_patch.py
          test -f tools/parity/kyutai_candle_reference/check_cpu_compatibility.py
          test -f tools/parity/kyutai_candle_reference/check_cache_observer_compatibility.py
          test -f tools/parity/kyutai_candle_reference/test_cpu_compatibility.py
          test -f tools/parity/kyutai_candle_reference/test_asr_observer_patch.py
          test -f tools/parity/kyutai_candle_reference/test_cache_observer_patch.py
          test -f tools/parity/kyutai_candle_reference/test_cache_observer_compatibility.py
          test -f tools/parity/kyutai_candle_reference/test_cache_observer_workflow.py
          test -f tools/parity/kyutai_candle_reference/pinned-asr.rs
          test -f tools/parity/kyutai_candle_reference/pinned-LICENSE
          test -f tools/parity/kyutai_candle_reference/pinned-transformer.rs
          test -f tools/parity/kyutai_candle_reference/pinned-lm.rs
          git check-attr filter diff merge text -- \
            tools/parity/kyutai_candle_reference/pinned-asr.rs \
            tools/parity/kyutai_candle_reference/pinned-LICENSE \
            tools/parity/kyutai_candle_reference/pinned-transformer.rs \
            tools/parity/kyutai_candle_reference/pinned-lm.rs

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Set up uv 0.8.17
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: '0.8.17'

      - name: Install pinned Rust 1.99 toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.99.0

      - name: Run source-only tests
        shell: bash
        env:
          UV_OFFLINE: '1'
          UV_CACHE_DIR: ${{ runner.temp }}/vokra-kyutai-candle-observer-uv-cache
        run: |
          set -euo pipefail
          uv run --no-project --offline --python 3.12 python -m unittest discover -s tools/parity/kyutai_candle_reference -p 'test_cache_observer_patch.py' -v
          uv run --no-project --offline --python 3.12 python -m unittest discover -s tools/parity/kyutai_candle_reference -p 'test_asr_observer_patch.py' -v

      - name: Run cache observer self-test
        shell: bash
        env:
          UV_OFFLINE: '1'
          UV_CACHE_DIR: ${{ runner.temp }}/vokra-kyutai-candle-observer-uv-cache
        run: >-
          uv run --no-project --offline --python 3.12 python
          tools/parity/kyutai_candle_reference/cache_observer_patch.py
          --self-test

      - name: Run compatibility runner offline tests
        shell: bash
        env:
          UV_OFFLINE: '1'
          UV_CACHE_DIR: ${{ runner.temp }}/vokra-kyutai-candle-observer-uv-cache
        run: >-
          uv run --no-project --offline --python 3.12 python -m unittest
          discover -s tools/parity/kyutai_candle_reference
          -p 'test_cache_observer_compatibility.py' -v

      - name: Run workflow contract tests
        shell: bash
        env:
          UV_OFFLINE: '1'
          UV_CACHE_DIR: ${{ runner.temp }}/vokra-kyutai-candle-observer-uv-cache
        run: >-
          uv run --no-project --offline --python 3.12 python -m unittest
          discover -s tools/parity/kyutai_candle_reference
          -p 'test_cache_observer_workflow.py' -v

      - name: Prepare fresh bounded output root
        shell: bash
        run: |
          set -euo pipefail
          run_root="$RUNNER_TEMP/candle-cache-observer-compatibility-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$run_root"
          mkdir "$run_root"

      - name: Build and probe actual cache observer library once
        env:
          UV_OFFLINE: '1'
          UV_CACHE_DIR: ${{ runner.temp }}/vokra-kyutai-candle-observer-uv-cache
          VOKRA_KYUTAI_CANDLE_OBSERVER_REMOTE_LINUX: '1'
          VOKRA_CANDLE_WORKFLOW_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: >-
          uv run --no-project --offline --python 3.12 python
          tools/parity/kyutai_candle_reference/check_cache_observer_compatibility.py
          --application-root "$GITHUB_WORKSPACE/tools/parity/kyutai_candle_reference/application-evidence-89"
          --output "$RUNNER_TEMP/candle-cache-observer-compatibility-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/compatibility.json"
          --deadline-seconds 900

      - name: Upload bounded compatibility receipt and evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kyutai-candle-cache-observer-compatibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/candle-cache-observer-compatibility-${{ github.run_id }}-${{ github.run_attempt }}/compatibility.json
            ${{ runner.temp }}/candle-cache-observer-compatibility-${{ github.run_id }}-${{ github.run_attempt }}/evidence
          if-no-files-found: error
          retention-days: 7
