name: Lightning checkpoint security

on:
  pull_request:
    paths:
      - ".github/workflows/lightning-checkpoint-security.yml"
      - "scripts/check-lightning-checkpoint-security.py"
      - "tools/parity/pyannote_diarization/pyproject.toml"
      - "tools/parity/pyannote_diarization/uv.lock"
      - "tools/parity/pyannote_segmentation/pyproject.toml"
      - "tools/parity/pyannote_segmentation/uv.lock"
      - "tools/parity/nanocodec/pyproject.toml"
      - "tools/parity/nanocodec/uv.lock"
  workflow_dispatch:

concurrency:
  group: lightning-checkpoint-security-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  checkpoint-regression:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project:
          - tools/parity/pyannote_diarization
          - tools/parity/pyannote_segmentation
          - tools/parity/nanocodec
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Sync locked ${{ matrix.project }} environment
        run: uv sync --project "${{ matrix.project }}" --frozen --python 3.12

      - name: Run static security regression self-test
        run: uv run --project "${{ matrix.project }}" --frozen python scripts/check-lightning-checkpoint-security.py --self-test

      - name: Run checkpoint _instantiator regression
        run: uv run --project "${{ matrix.project }}" --frozen python scripts/check-lightning-checkpoint-security.py
