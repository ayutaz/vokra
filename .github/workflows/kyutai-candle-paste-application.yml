name: Kyutai Candle paste overlay source-only application

on:
  pull_request:
    paths:
      - '.github/workflows/kyutai-candle-paste-application.yml'
      - 'tools/parity/kyutai_candle_reference/apply_paste_overlay.py'
      - 'tools/parity/kyutai_candle_reference/test_apply_paste_overlay.py'
      - 'tools/parity/kyutai_candle_reference/collect_metadata.py'
      - 'tools/parity/kyutai_candle_reference/pin_remediation_diagnostic.py'
      - 'tools/parity/kyutai_candle_reference/prepare_paste_overlay.py'
      - 'docs/handoff/kyutai-candle-paste-parents-source-2026-10-15.json'
      - 'docs/handoff/kyutai-candle-pastey-source-2026-10-15.json'
      - 'docs/handoff/kyutai-candle-candidate-2026-10-15.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kyutai-candle-paste-application-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-only-application:
    name: source-only paste overlay metadata application (not build/parity)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source-only inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/kyutai-candle-paste-application.yml
            tools/parity/kyutai_candle_reference/apply_paste_overlay.py
            tools/parity/kyutai_candle_reference/test_apply_paste_overlay.py
            tools/parity/kyutai_candle_reference/collect_metadata.py
            tools/parity/kyutai_candle_reference/pin_remediation_diagnostic.py
            tools/parity/kyutai_candle_reference/prepare_paste_overlay.py
            docs/handoff/kyutai-candle-paste-parents-source-2026-10-15.json
            docs/handoff/kyutai-candle-pastey-source-2026-10-15.json
            docs/handoff/kyutai-candle-candidate-2026-10-15.lock

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: 0.8.17

      - name: Bootstrap Python 3.12
        shell: bash
        run: |
          set -euo pipefail
          uv python install 3.12

      - name: Offline stdlib tests
        env:
          UV_OFFLINE: '1'
          UV_CACHE_DIR: ${{ runner.temp }}/vokra-uv-cache
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-project --offline --python 3.12 python -m unittest discover \
            -s tools/parity/kyutai_candle_reference \
            -p 'test_apply_paste_overlay.py' -v

      - name: Install pinned Rust toolchain for metadata only
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.99.0

      - name: Source-only metadata application
        id: application
        env:
          VOKRA_CANDLE_REMOTE_LINUX: '1'
          UV_OFFLINE: '1'
          UV_CACHE_DIR: ${{ runner.temp }}/vokra-uv-cache
        shell: bash
        run: |
          set -u
          run_root="$RUNNER_TEMP/candle-application-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          packet_root="$run_root/packet"
          output_root="$run_root/output"
          workspace_root="$run_root/workspace"
          uv run --no-project --python 3.12 python \
            tools/parity/kyutai_candle_reference/apply_paste_overlay.py \
            "$packet_root" "$output_root" "$workspace_root" \
            --deadline-seconds 480

      - name: Validate complete success evidence bounds
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          output_root="$RUNNER_TEMP/candle-application-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/output"
          files=(
            source_receipt.json candidate.lock final.lock
            baseline_cpu_metadata.json baseline_whole_metadata.json
            overlay_cpu_metadata.json overlay_whole_metadata.json
            application_receipt.json
          )
          total=0
          for name in "${files[@]}"; do
            path="$output_root/$name"
            test -f "$path"
            test ! -L "$path"
            size=$(stat -c '%s' "$path")
            test "$size" -le 2097152
            total=$((total + size))
          done
          test "$total" -le 16777216

      - name: Upload bounded diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kyutai-candle-paste-application-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 1
          path: |
            ${{ runner.temp }}/candle-application-${{ github.run_id }}-${{ github.run_attempt }}/output/source_receipt.json
            ${{ runner.temp }}/candle-application-${{ github.run_id }}-${{ github.run_attempt }}/output/candidate.lock
            ${{ runner.temp }}/candle-application-${{ github.run_id }}-${{ github.run_attempt }}/output/final.lock
            ${{ runner.temp }}/candle-application-${{ github.run_id }}-${{ github.run_attempt }}/output/baseline_cpu_metadata.json
            ${{ runner.temp }}/candle-application-${{ github.run_id }}-${{ github.run_attempt }}/output/baseline_whole_metadata.json
            ${{ runner.temp }}/candle-application-${{ github.run_id }}-${{ github.run_attempt }}/output/overlay_cpu_metadata.json
            ${{ runner.temp }}/candle-application-${{ github.run_id }}-${{ github.run_attempt }}/output/overlay_whole_metadata.json
            ${{ runner.temp }}/candle-application-${{ github.run_id }}-${{ github.run_attempt }}/output/application_receipt.json
