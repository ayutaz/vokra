name: Release candidate CPU smoke

# This workflow is intentionally manual-only.  It is a hosted Linux functional
# smoke, not numerical parity, Metal validation, or a performance benchmark.
on:
  workflow_dispatch:
    inputs:
      pins_json:
        description: >-
          Reviewed JSON records for exactly whisper-base and silero-vad-v5;
          each record must include repo, 40-hex revision, safe GGUF filename,
          SHA-256, and positive size_bytes below the script's bound.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-candidate-cpu-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-smoke:
    name: hosted Linux CPU functional smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - name: Checkout exact dispatch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # Keep the two protected trees out of this workflow's worktree.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/tools/parity/cosyvoice2_llm_reference/**
            !/tests/parity/silero_vad/**

      - name: Verify protected trees are excluded
        run: |
          set -euo pipefail
          test ! -e tools/parity/cosyvoice2_llm_reference
          test ! -e tests/parity/silero_vad

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.8.22"

      - name: Validate reviewed pins before build
        env:
          PIN_RECORDS: ${{ inputs.pins_json }}
          PINS_PATH: ${{ runner.temp }}/vokra-release-cpu-smoke/pins.json
          UV_CACHE_DIR: ${{ runner.temp }}/vokra-release-cpu-smoke-uv
        run: |
          set -euo pipefail
          test -n "${PIN_RECORDS}"
          mkdir -p "$(dirname "${PINS_PATH}")"
          printf '%s' "${PIN_RECORDS}" > "${PINS_PATH}"
          uv run --no-project --python 3.12 python tools/parity/release_candidate_cpu_smoke.py \
            --pins-json "${PINS_PATH}" --validate-pins-only

      - name: Offline smoke-driver tests
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/vokra-release-cpu-smoke-uv
        run: uv run --no-project --python 3.12 python tools/parity/test_release_candidate_cpu_smoke.py

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Build first-party CPU CLI
        run: cargo build --locked --release -p vokra-cli --no-default-features

      - name: Run pinned model smoke
        env:
          GITHUB_ACTIONS: "true"
          VOKRA_RELEASE_CPU_SMOKE: "1"
          PINS_PATH: ${{ runner.temp }}/vokra-release-cpu-smoke/pins.json
          EXPECTED_HEAD: ${{ github.sha }}
          RECEIPT: ${{ runner.temp }}/vokra-release-cpu-smoke/receipt.json
          UV_CACHE_DIR: ${{ runner.temp }}/vokra-release-cpu-smoke-uv
        run: |
          set -euo pipefail
          test -s "${PINS_PATH}"
          mkdir -p "$(dirname "${RECEIPT}")"
          uv run --no-project --python 3.12 python tools/parity/release_candidate_cpu_smoke.py \
            --pins-json "${PINS_PATH}" \
            --cli target/release/vokra-cli \
            --audio tests/fixtures/audio/jfk-30s.wav \
            --receipt "${RECEIPT}" \
            --expected-head "${EXPECTED_HEAD}"

      # Only the bounded receipt is recoverable.  Model files live under the
      # driver's temporary directory and are never cached or uploaded.
      - name: Upload bounded smoke receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-candidate-cpu-smoke-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/vokra-release-cpu-smoke/receipt.json
          if-no-files-found: ignore
          retention-days: 3
