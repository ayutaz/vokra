# Vokra UTMOS parity (M4-18 T12 CI wiring; the M4-18 defer was lifted
# 2026-07-18 and M5-15 landed the implementation side).
#
# Purpose: validate the UTMOS parity boundary without deserializing the
# historical Lightning pickle. The committed reference fixture and converter
# remain useful artifacts, but the current safe loader intentionally refuses
# this checkpoint because it contains unsupported pickle globals. Therefore
# this workflow must not claim a numeric parity result until an owner-approved
# safe state-dict source is available.
#
# The model-free job always exercises both explicit self-tests. When the pinned
# checkpoint source is present, the boundary job downloads it and treats the
# safe-loader refusal as the expected, passing outcome. It also proves that no
# safetensors or config output was emitted. This keeps the refusal visible and
# prevents an unsafe fallback or a fabricated parity pass.
#
# Artifacts the setup job requires:
#   1. tests/parity/utmos/source.env with at least one non-comment line —
#      owner-supplied as:
#          CKPT_URL=<https url of the upstream UTMOS checkpoint>
#          CKPT_SHA256=<sha256 of that file>
#   2. tests/parity/utmos/score.json — the historical upstream-generated
#      reference fixture. It is checked for presence, but is not consumed by
#      a numeric job while the checkpoint cannot be safely prepared.
#
# The boundary uses only a temporary Python environment for the offline
# checkpoint inspection; it does not invoke Cargo or modify the runtime
# dependency set. Numeric parity remains explicitly unclaimed.
#
# NOT a required check: workflow_dispatch + weekly cron + narrow PR path
# filter only, matching the Kokoro/Whisper real-parity workflows (promote to
# required only after weeks of consecutive green, owner decision).

name: parity-utmos

on:
  workflow_dispatch:
  # Weekly cadence alongside the other real-parity workflows; offset to
  # Monday 08:00 UTC — its own slot in the weekly stagger (Kokoro 04:00,
  # Whisper 05:00, Vulkan 05:30, CUDA-RTF 06:00, CSM 06:30, web-wasm 07:00,
  # Moshi 07:30, UTMOS 08:00, Godot 08:30).
  schedule:
    - cron: "0 8 * * 1"
  pull_request:
    # Phase 5a-3 (2026-07-23): UTMOS metric / harness / fixtures / converter /
    # dumper / this workflow に加え、共有依存 (vokra-core / vokra-ops =
    # metric NN op が乗る座) を追加。setup job は boundary artifact の
    # 有無を明示し、欠落時は safe-loader boundary を clean-skip する
    # (fabricated pass 禁止 NFR-QL-04)。
    paths:
      - ".github/workflows/parity-utmos.yml"
      - "crates/vokra-convert/src/models/utmos.rs"
      - "crates/vokra-core/**"
      - "crates/vokra-eval/src/metrics/utmos.rs"
      - "crates/vokra-eval/tests/parity_utmos.rs"
      - "crates/vokra-ops/**"
      - "tests/parity/utmos/**"
      - "tools/parity/utmos_dump_reference.py"
      - "tools/parity/utmos_env_probe.sh"
      - "tools/parity/utmos_prepare_checkpoint.py"

permissions:
  contents: read

concurrency:
  group: parity-utmos-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Preflight: detect whether the pinned source and historical fixture exist.
  # Missing inputs remain a visible boundary skip; they never become a
  # fabricated pass.
  setup:
    name: setup
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      ready: ${{ steps.flip.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Detect safe-loader boundary artifacts
        id: flip
        shell: bash
        run: |
          set -euo pipefail
          SRC=tests/parity/utmos/source.env
          FIX=tests/parity/utmos/score.json
          src_has_content=0
          if [ -f "$SRC" ] && grep -vE '^\s*(#|$)' "$SRC" | grep -q .; then
            src_has_content=1
          fi
          if [ "$src_has_content" -eq 1 ] && [ -f "$FIX" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            {
              echo "### parity-utmos"
              echo ""
              echo "boundary artifacts: **present** (\`$SRC\` + \`$FIX\`) — checking the safe-loader refusal."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            missing_reason="unknown"
            expected=1
            if [ ! -f "$SRC" ]; then
              missing_reason="source.env missing (checkpoint source unavailable)"
            elif [ "$src_has_content" -eq 0 ]; then
              missing_reason="source.env has no pinned checkpoint source"
            elif [ ! -f "$FIX" ]; then
              # Not the expected cause: score.json is committed, so its
              # absence is a regression rather than the pending blocker.
              missing_reason="score.json reference fixture MISSING (unexpected — it is committed; did something delete it?)"
              expected=0
            fi
            {
              echo "### parity-utmos"
              echo ""
              echo "Safe-loader boundary skipping — \`$missing_reason\`."
              echo ""
              if [ "$expected" -eq 1 ]; then
                echo "The source or fixture is not available, so the checkpoint boundary"
                echo "cannot be exercised on this run. The model-free self-tests still run."
              else
                echo "This is NOT the expected blocker and should be investigated."
              fi
              echo ""
              echo "Skipping rather than substituting anything is the honest posture"
              echo "(NFR-QL-04). Recipe: \`tests/parity/utmos/README.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning file=tests/parity/utmos/README.md::parity-utmos safe-loader boundary skipping: $missing_reason (FR-EX-08 explicit skip, not a synthetic fallback)"
          fi

  model-free-selftests:
    name: model-free-selftests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
      - name: Check safe-loader self-tests
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-project --python 3.12 python \
            tools/parity/utmos_prepare_checkpoint.py --self-test
          uv run --no-project --python 3.12 python \
            tools/parity/utmos_dump_reference.py --self-test
      - name: Announce numeric parity boundary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### parity-utmos"
            echo ""
            echo "Model-free safe-loader/reference self-tests passed."
            echo ""
            echo "Numeric parity is not claimed: the historical Lightning checkpoint"
            echo "requires an owner-approved safe state-dict source."
          } >> "$GITHUB_STEP_SUMMARY"

  parity-utmos:
    name: parity-utmos safe-loader-boundary
    needs: [setup, model-free-selftests]
    if: needs.setup.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
      - name: Download + verify the pinned checkpoint source
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source tests/parity/utmos/source.env
          : "${CKPT_URL:?source.env must define CKPT_URL}"
          : "${CKPT_SHA256:?source.env must define CKPT_SHA256}"
          curl -fL --retry 3 -o /tmp/utmos-checkpoint "$CKPT_URL"
          echo "${CKPT_SHA256}  /tmp/utmos-checkpoint" | sha256sum -c -
      - name: Verify expected safe-loader refusal (no output or parity claim)
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          # The prepare step uses torch only as an offline bridge. Installing
          # it here does not add anything to the runtime Cargo dependency set.
          uv venv --python 3.12 "$workdir/venv"
          uv pip install --python "$workdir/venv/bin/python" \
            "torch==2.8.0" "numpy>=1.26,<3" safetensors
          set +e
          uv run --no-project --python "$workdir/venv/bin/python" \
            python tools/parity/utmos_prepare_checkpoint.py \
            --ckpt /tmp/utmos-checkpoint \
            --output "$workdir/utmos.safetensors" \
            --config-out "$workdir/utmos-config.json" \
            >"$workdir/prepare.log" 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -Fq "weights_only=True refused checkpoint" "$workdir/prepare.log"
          grep -Fq "unsafe pickle deserialization is not permitted" "$workdir/prepare.log"
          test ! -e "$workdir/utmos.safetensors"
          test ! -e "$workdir/utmos-config.json"
          cat "$workdir/prepare.log"
          {
            echo "### UTMOS safe-loader boundary: PASS"
            echo ""
            echo "The pinned Lightning checkpoint was refused by weights_only=True."
            echo "No safetensors/config output was created; numeric parity was not claimed."
          } >> "$GITHUB_STEP_SUMMARY"
