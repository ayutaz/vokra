# Vokra UTMOS parity (safe state-dict boundary; current 2026-09-12 posture).
#
# Purpose: validate the UTMOS safe state-dict boundary without deserializing
# the historical Lightning pickle. The canonical input is an authenticated
# tensor-only `.safetensors` state-dict. The legacy `.ckpt` URL remains in the
# historical source manifest for provenance, but is never a CI input.
#
# The model-free job always exercises both explicit self-tests. When the pinned
# tensor-only source is present, the boundary job downloads it and prepares the
# sidecar. This keeps the safe route visible and prevents an unsafe fallback or
# a fabricated parity pass.
#
# Artifacts the setup job requires:
#   1. tests/parity/utmos/source.env with both state-dict fields —
#      owner-supplied as:
#          STATE_DICT_URL=<https url of an upstream/exported safetensors file>
#          STATE_DICT_SHA256=<sha256 of that file>
#   2. tests/parity/utmos/score.json — the historical upstream-generated
#      reference fixture. It is checked for presence, but is not consumed by
#      a numeric job while the checkpoint cannot be safely prepared.
#
# The boundary uses only a temporary Python environment for offline
# safetensors inspection; it does not invoke Cargo or modify the runtime
# dependency set. Numeric parity remains explicitly unclaimed until the
# independent upstream dumper also receives a safe state-dict route.
#
# NOT a required check: workflow_dispatch + weekly cron + narrow PR path
# filter only, matching the Kokoro/Whisper real-parity workflows (promote to
# required only after weeks of consecutive green, owner decision).

name: parity-utmos

on:
  workflow_dispatch:
  # Weekly cadence alongside the other real-parity workflows; offset to
  # Monday 08:00 UTC — its own slot in the weekly stagger (Kokoro 04:00,
  # Whisper 05:00, Vulkan 05:30, CUDA-RTF 06:00, CSM 06:30, web-wasm 07:00,
  # Moshi 07:30, UTMOS 08:00, Godot 08:30).
  schedule:
    - cron: "0 8 * * 1"
  pull_request:
    # Phase 5a-3 (2026-07-23): UTMOS metric / harness / fixtures / converter /
    # dumper / this workflow に加え、共有依存 (vokra-core / vokra-ops =
    # metric NN op が乗る座) を追加。setup job は boundary artifact の
    # 有無を明示し、欠落時は safe state-dict boundary を clean-skip する
    # (fabricated pass 禁止 NFR-QL-04)。
    paths:
      - ".github/workflows/parity-utmos.yml"
      - "crates/vokra-convert/src/models/utmos.rs"
      - "crates/vokra-core/**"
      - "crates/vokra-eval/src/metrics/utmos.rs"
      - "crates/vokra-eval/tests/parity_utmos.rs"
      - "crates/vokra-ops/**"
      - "tests/parity/utmos/**"
      - "tools/parity/utmos_dump_reference.py"
      - "tools/parity/utmos_env_probe.sh"
      - "tools/parity/utmos_prepare_checkpoint.py"

permissions:
  contents: read

concurrency:
  group: parity-utmos-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Preflight: detect whether the pinned UTMOS state-dict and historical
  # fixture exist. `ready=true` means only the UTMOS preparation boundary;
  # it is not a numeric-parity readiness signal (wav2vec is separate).
  # Missing inputs remain a visible boundary skip; they never become a
  # fabricated pass.
  setup:
    name: setup
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      ready: ${{ steps.flip.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Detect safe state-dict boundary artifacts
        id: flip
        shell: bash
        run: |
          set -euo pipefail
          SRC=tests/parity/utmos/source.env
          FIX=tests/parity/utmos/score.json
          state_has_content=0
          if [ -f "$SRC" ] && grep -qE '^STATE_DICT_URL=https?://' "$SRC" \
            && grep -qE '^STATE_DICT_SHA256=[0-9a-fA-F]{64}$' "$SRC"; then
            state_has_content=1
          fi
          if [ "$state_has_content" -eq 1 ] && [ -f "$FIX" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            {
              echo "### parity-utmos"
              echo ""
              echo "safe UTMOS state-dict source: **present** (\`$SRC\` + \`$FIX\`) — checking tensor-only preparation only."
              echo "Numeric parity remains blocked until W2V_STATE_DICT_URL + W2V_STATE_DICT_SHA256 are also fixed."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            missing_reason="unknown"
            expected=1
            if [ ! -f "$SRC" ]; then
              missing_reason="source.env missing (safe state-dict source unavailable)"
            elif [ "$state_has_content" -eq 0 ]; then
              missing_reason="source.env has no pinned STATE_DICT_URL + STATE_DICT_SHA256"
            elif [ ! -f "$FIX" ]; then
              # Not the expected cause: score.json is committed, so its
              # absence is a regression rather than the pending blocker.
              missing_reason="score.json reference fixture MISSING (unexpected — it is committed; did something delete it?)"
              expected=0
            fi
            {
              echo "### parity-utmos"
              echo ""
              echo "Safe state-dict boundary skipping — \`$missing_reason\`."
              echo ""
              if [ "$expected" -eq 1 ]; then
              echo "The safe state-dict source or fixture is not available, so the boundary"
                echo "cannot be exercised on this run. The model-free self-tests still run."
              else
                echo "This is NOT the expected blocker and should be investigated."
              fi
              echo ""
              echo "Skipping rather than substituting anything is the honest posture"
              echo "(NFR-QL-04). Recipe: \`tests/parity/utmos/README.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning file=tests/parity/utmos/README.md::parity-utmos safe state-dict boundary skipping: $missing_reason (FR-EX-08 explicit skip, not a synthetic fallback)"
          fi

  model-free-selftests:
    name: model-free-selftests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Sync pinned UTMOS parity environment
        run: uv sync --project tools/parity/utmos --frozen
      - name: Check safe state-dict self-tests
        shell: bash
        run: |
          set -euo pipefail
          uv run --project tools/parity/utmos --frozen python \
            tools/parity/utmos_prepare_checkpoint.py --self-test
          uv run --project tools/parity/utmos --frozen python \
            tools/parity/utmos_dump_reference.py --self-test
      - name: Announce numeric parity boundary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### parity-utmos"
            echo ""
            echo "Model-free safe state-dict/reference self-tests passed."
            echo ""
            echo "Numeric parity is not claimed: both UTMOS and wav2vec safe state-dicts"
            echo "with fixed SHA-256 manifests are required."
          } >> "$GITHUB_STEP_SUMMARY"

  parity-utmos:
    name: parity-utmos safe-state-dict-boundary
    needs: [setup, model-free-selftests]
    if: needs.setup.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Sync pinned UTMOS parity environment
        run: uv sync --project tools/parity/utmos --frozen
      - name: Download + verify the pinned tensor-only state-dict source
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source tests/parity/utmos/source.env
          : "${STATE_DICT_URL:?source.env must define STATE_DICT_URL}"
          : "${STATE_DICT_SHA256:?source.env must define STATE_DICT_SHA256}"
          curl -fL --retry 3 -o /tmp/utmos-state-dict.safetensors "$STATE_DICT_URL"
          echo "${STATE_DICT_SHA256}  /tmp/utmos-state-dict.safetensors" | sha256sum -c -
      - name: Prepare tensor-only state-dict (no pickle or parity claim)
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          # The pinned project contains only offline bridge dependencies; none
          # enter the runtime Cargo dependency set.
          uv run --project tools/parity/utmos --frozen \
            python tools/parity/utmos_prepare_checkpoint.py \
            --state-dict /tmp/utmos-state-dict.safetensors \
            --output "$workdir/utmos.safetensors" \
            --config-out "$workdir/utmos-config.json"
          test -s "$workdir/utmos.safetensors"
          test -s "$workdir/utmos-config.json"
          {
            echo "### UTMOS safe state-dict boundary: PASS"
            echo ""
            echo "The pinned tensor-only state-dict was prepared without pickle deserialization."
            echo "Numeric parity was not claimed; the independent upstream reference route remains required."
          } >> "$GITHUB_STEP_SUMMARY"
