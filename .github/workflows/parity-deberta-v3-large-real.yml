# DeBERTa v3 Large real-checkpoint parity CI (SBV2 v2 plan Task 31
# follow-up, 2026-07-28). Isolates the EN BERT encoder path — a sibling of
# parity-sbv2-real.yml (which exercises DeBERTa v2/v3 as part of the full
# multi-checkpoint SBV2 pipeline) that stands alone against the
# `microsoft/deberta-v3-large` upstream release. Same posture as
# parity-deepfilternet3-real.yml: two-phase design (Phase A = reproducible
# conversion; Phase B = numerical parity vs the reference dumper), each
# behind its own explicit gate, no fabricated pass.
#
# The Python reference dumper (`tools/parity/deberta_v3_dump_reference.py`,
# clean-room per HF transformers Apache-2.0 + arXiv:2111.09543 — no AGPL
# Style-Bert-VITS2 / Bert-VITS2 code referenced) writes per-layer
# hidden_states + attention tensors to `reference_dump/*.bin`. The landed
# Rust harness (`crates/vokra-bert/tests/deberta_v3_real.rs`) consumes the
# real `input_ids` + `final_hidden` bytes and compares
# `DebertaV3Encoder::from_gguf(...).forward(&ids)` against the independent
# upstream `transformers` forward. Per-layer hidden/attention taps remain a
# separately documented extension because the Rust encoder does not expose
# them today; the final-hidden numerical gate is active and must not be
# described as a missing consumer.
#
# Distribution shape (verified 2026-07-28 via HF Hub API): the
# `microsoft/deberta-v3-large` repo ships `pytorch_model.bin` only — no
# `model.safetensors` — so this workflow additionally runs
# `tools/parity/bin_to_safetensors.py` (owner Task 3 Wave 2b) between
# download and convert. `vokra-convert` is safetensors-only by design
# (NFR-DS-02: no pickle parser in the Rust runtime; `torch.load` +
# `safetensors.torch.save_file` is the offline sidecar bridge).
#
# Design (parity-deepfilternet3-real.yml discipline):
#
#   * Trigger: workflow_dispatch (owner-driven initial dispatch) + weekly
#     cron `0 13 * * 1` (Monday 13:00 UTC — the first free slot after
#     parity-deepfilternet3-real (12:30) in the staggered weekly parity
#     roster documented in that workflow's own header) + a NARROW
#     pull_request paths filter that only fires on deberta-v3-adjacent
#     code.
#
#   * Repository-variable gate `VOKRA_DEBERTA_V3_ENABLE=1` (or a
#     workflow_dispatch run) is required for the parity job to fire on
#     schedule / PR. The cron path clean-skips with a `::notice::` when
#     the variable is not set — fabricated pass 禁止 (FR-EX-08).
#
#   * Two-phase design: CONVERSION always runs when gated in (Phase A —
#     bin → safetensors → GGUF via `vokra-cli convert --model deberta-v3`).
#     Matching PRs and enabled schedules run the locked upstream DUMPER plus
#     a `DebertaV3Encoder::from_gguf` final-hidden NUMERICAL PARITY load. Manual
#     dispatch defaults to the same full gate; `run_dumper=false` retains an
#     explicit conversion-only diagnostic mode. The obsolete
#     `VOKRA_DEBERTA_V3_HARNESS_READY` gate is removed because the consumer
#     landed on 2026-07-29.
#
#   * Python runs only through the Linux-x86_64 Python 3.12 uv lock under
#     `tools/parity/deberta_v3/` (root Cargo.lock untouched — NFR-DS-02;
#     the final `git diff --exit-code Cargo.lock` step is the tripwire).
#     The lock pins a CPU-only torch oracle plus transformers,
#     huggingface_hub, safetensors, sentencepiece, and numpy.
#
#   * NOT registered as a required check. HF hub flakiness must not block
#     PRs (same posture as every other parity-*-real workflow). Promotion
#     to required is an explicit owner decision after weeks of consecutive
#     greens.
#
#   * Initial workflow_dispatch = owner. Fabricated-pass 禁止 — this CI
#     never fires until the owner explicitly opts in.
#
# Handoff (Phase B / harness enablement):
# docs/handoff/parity-deberta-v3-large-real.md.

name: parity-deberta-v3-large-real

on:
  workflow_dispatch:
    inputs:
      run_dumper:
        description: >-
          When "true", run the locked upstream dumper and final-hidden
          numerical parity after conversion. Set false only for an explicit
          conversion-only diagnostic dispatch. Default: true.
        required: false
        default: "true"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    # Weekly Monday 13:00 UTC — the first free slot after
    # parity-deepfilternet3-real (12:30) in the staggered weekly parity
    # roster (see parity-deepfilternet3-real.yml header for the full
    # roster). Check-workflow-hygiene.sh guards against collisions.
    - cron: "0 13 * * 1"
  pull_request:
    # Fires ONLY on deberta-v3-adjacent code. Non-matching PRs run the
    # unit tests (deberta_v3_synthetic.rs + deberta_convert.rs'
    # convert_report_fields_exist) via the per-PR required jobs in ci.yml.
    paths:
      - ".github/workflows/parity-deberta-v3-large-real.yml"
      - "crates/vokra-bert/src/deberta_v3.rs"
      - "crates/vokra-bert/src/deberta_v2.rs"
      - "crates/vokra-bert/src/bert_base.rs"
      - "crates/vokra-bert/src/lib.rs"
      - "crates/vokra-bert/tests/deberta_v3_real.rs"
      - "crates/vokra-cli/src/convert.rs"
      - "crates/vokra-convert/src/lib.rs"
      - "crates/vokra-convert/src/models/deberta_v3.rs"
      - "crates/vokra-convert/src/models/deberta_v2.rs"
      - "crates/vokra-convert/tests/deberta_convert.rs"
      - "tools/parity/deberta_v3_dump_reference.py"
      - "tools/parity/bin_to_safetensors.py"
      - "tools/parity/extract_spm_metadata.py"
      - "tools/parity/deberta_v3/pyproject.toml"
      - "tools/parity/deberta_v3/uv.lock"
      # Shared dependencies whose regressions could reach the deberta-v3
      # convert/load path:
      - "crates/vokra-core/src/gguf/**"
      - "crates/vokra-core/src/compliance/**"

concurrency:
  group: parity-deberta-v3-large-real-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned upstream revision on microsoft/deberta-v3-large. Verified live
  # via https://huggingface.co/api/models/microsoft/deberta-v3-large
  # (2026-07-28 primary source — the `sha` field of the model API record).
  # License MIT (docs/license-audit.md §3.1 sign-off row `deberta-v3-large`
  # dated 2026-07-27 = ☑ Commercial, primary source github.com/microsoft/
  # DeBERTa/master/LICENSE).
  DEBERTA_V3_REPO: microsoft/deberta-v3-large
  DEBERTA_V3_REVISION: "64a8c8eab3e352a784c658aef62be1662607476f"
  DEBERTA_V3_LICENSE: MIT
  # Architecture facts (from raw config.json at the pinned revision, cross-
  # referenced with `deberta_v3_dump_reference.py`'s own module doc): 1024
  # hidden / 24 layers / 16 heads / 128100 vocab. Not used programmatically
  # here (`vokra-cli convert --model deberta-v3` reads them from the
  # safetensors metadata + checkpoint config.json), but recorded for the
  # audit trail.
  PARITY_PROJECT: tools/parity/deberta_v3
  UV_PROJECT_ENVIRONMENT: /tmp/vokra-deberta-v3-parity
  CARGO_TERM_COLOR: always

jobs:
  setup:
    name: gate (deberta-v3 opt-in)
    runs-on: ubuntu-latest
    outputs:
      run_conversion: ${{ steps.decide.outputs.run_conversion }}
      run_dumper: ${{ steps.decide.outputs.run_dumper }}
    steps:
      - id: decide
        env:
          ENABLE_VAR: ${{ vars.VOKRA_DEBERTA_V3_ENABLE }}
          FORCE_DUMPER: ${{ inputs.run_dumper }}
        run: |
          set -euo pipefail

          # workflow_dispatch: full numerical parity is the default; an
          # explicit run_dumper=false requests conversion-only diagnostics.
          # pull_request: paths are already narrowly scoped, so run both.
          # schedule: both phases remain gated on ENABLE_VAR=1.
          case "${{ github.event_name }}" in
            workflow_dispatch)
              echo "run_conversion=true" >> "$GITHUB_OUTPUT"
              if [ "${FORCE_DUMPER:-false}" = "true" ]; then
                echo "run_dumper=true" >> "$GITHUB_OUTPUT"
                echo "workflow_dispatch: locked reference + numerical parity ENABLED"
              else
                echo "run_dumper=false" >> "$GITHUB_OUTPUT"
                echo "::notice title=parity-deberta-v3-large-real conversion-only dispatch::run_dumper=false — final-hidden numerical parity was deliberately not requested. This is a clean skip of Phase B, not a pass (fabricated pass 禁止, FR-EX-08)."
              fi
              ;;
            pull_request)
              echo "run_conversion=true" >> "$GITHUB_OUTPUT"
              echo "run_dumper=true" >> "$GITHUB_OUTPUT"
              echo "pull_request: conversion + locked real numerical parity ENABLED"
              ;;
            schedule|*)
              if [ "${ENABLE_VAR}" = "1" ]; then
                echo "run_conversion=true" >> "$GITHUB_OUTPUT"
                echo "run_dumper=true" >> "$GITHUB_OUTPUT"
                echo "VOKRA_DEBERTA_V3_ENABLE=1: proceeding with conversion + locked real numerical parity"
              else
                echo "run_conversion=false" >> "$GITHUB_OUTPUT"
                echo "run_dumper=false" >> "$GITHUB_OUTPUT"
                echo "::notice title=parity-deberta-v3-large-real clean skip::VOKRA_DEBERTA_V3_ENABLE is not '1' — this family opt-in is off. Set the repository variable to 1 or dispatch manually to run conversion + final-hidden parity. Fabricated pass 禁止 (FR-EX-08)."
              fi
              ;;
          esac

  parity:
    name: parity (deberta-v3-large)
    needs: setup
    if: needs.setup.outputs.run_conversion == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HOME: ${{ github.workspace }}/.deberta-v3-cache
      HF_HUB_CACHE: ${{ github.workspace }}/.deberta-v3-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free hosted-runner disk (bin + safetensors + venv need headroom)
        # pytorch_model.bin is ~1.7 GB; safetensors copy is comparable; venv
        # with torch CPU is ~2 GB. Same trim as parity-tts-continuous-vae.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Cache DeBERTa v3 HF checkpoint (per pinned revision)
        uses: actions/cache@v6
        with:
          path: ${{ env.HF_HOME }}
          # Key on the pinned revision so a Microsoft upstream re-upload
          # (would change bytes) invalidates the cache automatically.
          key: deberta-v3-large-hf-${{ env.DEBERTA_V3_REVISION }}-v1

      - name: Provision locked DeBERTa-v3 upstream oracle
        run: |
          set -euo pipefail
          uv sync --project "${PARITY_PROJECT}" --frozen --python 3.12
          uv run --project "${PARITY_PROJECT}" --frozen python - <<'PY'
          import torch, numpy, safetensors, huggingface_hub, transformers
          print(
              f"deberta-v3 locked oracle: "
              f"torch={torch.__version__} numpy={numpy.__version__} "
              f"safetensors={safetensors.__version__} "
              f"huggingface_hub={huggingface_hub.__version__} "
              f"transformers={transformers.__version__}"
          )
          PY

      - name: Record numerical environment (non-gating)
        if: always() && needs.setup.outputs.run_dumper == 'true'
        continue-on-error: true
        run: |
          set +e
          {
            echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "git_commit=${GITHUB_SHA}"
            echo "uname=$(uname -a)"
            echo "nproc=$(nproc)"
            lscpu
            awk '$1 == "MemTotal:" { print "mem_total_kib=" $2; exit }' /proc/meminfo
            rustc --version --verbose
            cargo --version
            uv --version
            uv run --project "${PARITY_PROJECT}" --frozen python -c \
              'import platform, torch; print(f"python={platform.python_version()}"); print(f"torch={torch.__version__}"); print(f"torch_cpu_capability={torch.backends.cpu.get_cpu_capability()}")'
          } 2>&1 | tee "${RUNNER_TEMP}/environment.txt"

      - name: Download microsoft/deberta-v3-large @ pinned SHA (HF hub)
        # snapshot_download at the pinned revision. Fetch pytorch_model.bin
        # + config.json + tokenizer_config.json + spm.model. `.bin` is the
        # only weights format upstream ships (no safetensors mirror at
        # source, verified 2026-07-28 via HF Hub API).
        env:
          HF_HUB_DISABLE_XET: "1"
        run: |
          set -euo pipefail
          # `python -c` through uv (not a heredoc): a heredoc inside $() cannot be
          # closed from column 0 in a `run: |` block, which
          # `scripts/check-workflow-hygiene.sh` catches via `bash -n`.
          # Same pattern as parity-tts-continuous-vae-real.yml.
          SNAPSHOT_STDOUT="$(uv run --project "${PARITY_PROJECT}" --frozen python -c "
          import os
          from huggingface_hub import snapshot_download
          repo = os.environ['DEBERTA_V3_REPO']
          rev = os.environ['DEBERTA_V3_REVISION']
          local = snapshot_download(
              repo_id=repo,
              revision=rev,
              allow_patterns=[
                  'pytorch_model.bin',
                  'config.json',
                  'tokenizer_config.json',
                  'spm.model',
              ],
          )
          print(f'snapshot: {local}')
          ")"
          echo "${SNAPSHOT_STDOUT}"
          CKPT_DIR="$(echo "${SNAPSHOT_STDOUT}" | awk -F'snapshot: ' '/^snapshot: /{print $2; exit}')"
          if [ -z "${CKPT_DIR}" ] || [ ! -d "${CKPT_DIR}" ]; then
            echo "::error::snapshot_download did not print a resolvable path (got: ${SNAPSHOT_STDOUT})"
            exit 1
          fi
          BIN="${CKPT_DIR}/pytorch_model.bin"
          if [ ! -f "${BIN}" ]; then
            echo "::error::expected pytorch_model.bin under ${CKPT_DIR}"
            ls -la "${CKPT_DIR}"
            exit 1
          fi
          echo "CKPT_DIR=${CKPT_DIR}" >> "$GITHUB_ENV"
          {
            echo "### DeBERTa v3 checkpoint"
            echo ""
            echo "- Repo: \`${DEBERTA_V3_REPO}\`"
            echo "- Revision: \`${DEBERTA_V3_REVISION}\`"
            echo "- Local dir: \`${CKPT_DIR}\`"
            echo "- License: \`${DEBERTA_V3_LICENSE}\`"
            echo "- pytorch_model.bin: $(wc -c < "${BIN}" | numfmt --to=iec)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Convert pytorch_model.bin → safetensors (bin_to_safetensors.py)
        # `vokra-convert` is safetensors-only by design (NFR-DS-02 — no
        # pickle parser in the Rust runtime, and no arbitrary-code-exec
        # risk on load). Owner Task 3 Wave 2b landed
        # `tools/parity/bin_to_safetensors.py` as the offline sidecar
        # bridge; torch.load(weights_only=True) + safetensors.torch.save_file.
        id: st_convert
        run: |
          set -euo pipefail
          ST_DIR="${RUNNER_TEMP}/deberta-v3-large-st"
          set +e
          uv run --project "${PARITY_PROJECT}" --frozen python \
            tools/parity/bin_to_safetensors.py \
            --hf-repo "${DEBERTA_V3_REPO}" \
            --revision "${DEBERTA_V3_REVISION}" \
            --output-dir "${ST_DIR}" \
            2>&1 | tee "${RUNNER_TEMP}/bin2st-log.txt"
          BIN2ST_EXIT=${PIPESTATUS[0]}
          set -e
          if [ "${BIN2ST_EXIT}" -ne 0 ]; then
            {
              echo "### bin_to_safetensors: FAILED"
              echo ""
              echo '```'
              tail -c 4096 "${RUNNER_TEMP}/bin2st-log.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "${BIN2ST_EXIT}"
          fi
          # bin_to_safetensors.py writes model.safetensors alongside a
          # sha256 line into $ST_DIR. Locate the safetensors file, which
          # the script prints via its own log; be defensive against name
          # drift (accept model.safetensors or the first *.safetensors).
          SAFETENSORS="${ST_DIR}/model.safetensors"
          if [ ! -f "${SAFETENSORS}" ]; then
            SAFETENSORS="$(find "${ST_DIR}" -maxdepth 2 -type f -name '*.safetensors' | head -1)"
          fi
          if [ -z "${SAFETENSORS:-}" ] || [ ! -f "${SAFETENSORS}" ]; then
            echo "::error::bin_to_safetensors.py did not produce a *.safetensors file under ${ST_DIR}"
            ls -la "${ST_DIR}"
            exit 1
          fi
          echo "DEBERTA_V3_SAFETENSORS=${SAFETENSORS}" >> "$GITHUB_ENV"
          {
            echo "### DeBERTa v3 safetensors"
            echo ""
            echo "- Path: \`${SAFETENSORS}\`"
            echo "- Size: $(wc -c < "${SAFETENSORS}" | numfmt --to=iec)"
            echo ""
            echo '```'
            tail -c 4096 "${RUNNER_TEMP}/bin2st-log.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Extract pinned SentencePiece metadata for the GGUF
        run: |
          set -euo pipefail
          SPM_MODEL="$(dirname "${DEBERTA_V3_SAFETENSORS}")/spm.model"
          SPM_JSON="${RUNNER_TEMP}/deberta-v3-spm.json"
          test -f "${SPM_MODEL}"
          uv run --project "${PARITY_PROJECT}" --frozen python \
            tools/parity/extract_spm_metadata.py \
              --input "${SPM_MODEL}" \
              --output "${SPM_JSON}"
          test -s "${SPM_JSON}"
          echo "DEBERTA_V3_TOKENIZER_JSON=${SPM_JSON}" >> "$GITHUB_ENV"

      - name: Build vokra-cli (release)
        run: cargo build --locked --release -p vokra-cli

      - name: Convert safetensors → GGUF (vokra-cli convert --model deberta-v3)
        # `--model deberta-v3` (canonical `ModelKind::as_arg()` spelling,
        # per `crates/vokra-cli/src/convert.rs` L1157) reads shapes/config
        # from the safetensors shapes. The later Rust real-parity harness
        # reparses the emitted bytes through `DebertaV3Encoder::from_gguf`.
        id: convert
        run: |
          set -euo pipefail
          GGUF="${RUNNER_TEMP}/deberta-v3-large.gguf"
          set +e
          ./target/release/vokra-cli convert \
            --model deberta-v3 \
            --input "${DEBERTA_V3_SAFETENSORS}" \
            --tokenizer "${DEBERTA_V3_TOKENIZER_JSON}" \
            --output "${GGUF}" \
            2>&1 | tee "${RUNNER_TEMP}/convert-log.txt"
          CONVERT_EXIT=${PIPESTATUS[0]}
          set -e
          if [ "${CONVERT_EXIT}" -ne 0 ]; then
            {
              echo "### deberta-v3: conversion FAILED"
              echo ""
              echo '```'
              tail -c 4096 "${RUNNER_TEMP}/convert-log.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "converted=false" >> "$GITHUB_OUTPUT"
            exit "${CONVERT_EXIT}"
          fi
          echo "DEBERTA_V3_GGUF=${GGUF}" >> "$GITHUB_ENV"
          echo "converted=true" >> "$GITHUB_OUTPUT"
          {
            echo "### deberta-v3: conversion OK"
            echo ""
            echo "- GGUF: \`${GGUF}\`"
            echo "- Size: $(wc -c < "${GGUF}" | numfmt --to=iec)"
            echo "- Runtime re-load: exercised by the real-parity harness below"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Regenerate reference dump (deberta_v3_dump_reference.py --do-dump)
        # Produces reference_dump.manifest.json + per-tensor `.bin` files
        # under $REF_DIR for the landed Rust numerical parity harness.
        id: dump
        if: needs.setup.outputs.run_dumper == 'true'
        run: |
          set -euo pipefail
          REF_DIR="${RUNNER_TEMP}/deberta-v3-refdata"
          mkdir -p "${REF_DIR}"
          set +e
          uv run --project "${PARITY_PROJECT}" --frozen python \
            tools/parity/deberta_v3_dump_reference.py \
            --hf-repo "${DEBERTA_V3_REPO}" \
            --revision "${DEBERTA_V3_REVISION}" \
            --output-dir "${REF_DIR}" \
            --do-dump 2>&1 | tee "${RUNNER_TEMP}/dump-log.txt"
          DUMP_EXIT=${PIPESTATUS[0]}
          set -e
          echo "DUMP_EXIT=${DUMP_EXIT}" >> "$GITHUB_ENV"
          echo "REF_DIR=${REF_DIR}" >> "$GITHUB_ENV"
          {
            echo "### deberta-v3: reference dump (exit ${DUMP_EXIT})"
            echo ""
            echo '```'
            tail -c 4096 "${RUNNER_TEMP}/dump-log.txt"
            echo '```'
            if [ "${DUMP_EXIT}" = "0" ] && [ -f "${REF_DIR}/reference_dump.manifest.json" ]; then
              echo ""
              echo "- Manifest: \`${REF_DIR}/reference_dump.manifest.json\`"
              echo "- Tensor count: $(find "${REF_DIR}/reference_dump" -maxdepth 1 -type f -print 2>/dev/null | wc -l)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Phase B status (informational, per-run)
        # NFR-QL-04 / FR-EX-08 audit trail: on every run, emit an explicit,
        # visible-in-summary record of which Phase B legs ran vs why they
        # honestly skipped. Downgraded 2026-07-29 from an unconditional
        # "SKIPPED (harness not landed)" notice to a status snapshot when
        # `crates/vokra-bert/tests/deberta_v3_real.rs` landed.
        run: |
          set -euo pipefail
          {
            echo "### deberta-v3: numerical parity status"
            echo ""
            echo "* Rust harness (\`crates/vokra-bert/tests/deberta_v3_real.rs\`): LANDED 2026-07-29."
            echo "  Compares \`final_hidden\` (\`[1, T, 1024]\`) against the dumper's"
            echo "  reference bytes at an architectural-floor atol (see harness"
            echo "  module doc for the derivation)."
            echo "* Per-layer \`layer_NN_output\` + \`layer_NN_attention\` legs: DEFERRED."
            echo "  The Rust encoder does not expose per-layer taps today"
            echo "  (\`DebertaV3Encoder::forward\` returns final hidden only);"
            echo "  enabling those requires an additive"
            echo "  \`forward_with_layer_taps()\` API. Not fabricated as a"
            echo "  reachable assertion path — see harness module doc's Coverage"
            echo "  note."
            if [ "${{ needs.setup.outputs.run_dumper }}" = "true" ]; then
              echo "* This run: reference dump PRODUCED; final_hidden parity leg RUNNING."
            else
              echo "* This run: reference dump NOT PRODUCED (\`run_dumper=false\`);"
              echo "  final_hidden parity leg will honest-skip (env vars absent by design)."
              echo "  Re-dispatch with \`-f run_dumper=true\` to exercise the numerical leg."
            fi
            echo ""
            echo "See \`docs/handoff/parity-deberta-v3-large-real.md\` for the full flow."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run deberta_v3 numerical parity + tokenizer harness
        # Landed 2026-07-29 (M5 gap A-1). Gated on run_dumper=true because
        # the reference dump is a prerequisite input — no dump means no
        # bytes to compare against; env-var absence makes the harness
        # honest-skip inside the test itself as a second line of defence.
        if: needs.setup.outputs.run_dumper == 'true'
        env:
          VOKRA_DEBERTA_V3_GGUF: ${{ env.DEBERTA_V3_GGUF }}
          VOKRA_DEBERTA_V3_REFDIR: ${{ env.REF_DIR }}/reference_dump
        run: |
          set -euo pipefail
          set +e
          cargo test --locked --release -p vokra-bert \
            --test deberta_v3_real -- --nocapture \
            2>&1 | tee "${RUNNER_TEMP}/parity-log.txt"
          PARITY_EXIT=${PIPESTATUS[0]}
          set -e
          if grep -Eq '^(skipping: set VOKRA_DEBERTA_V3|SKIP: VOKRA_DEBERTA_V3)' \
            "${RUNNER_TEMP}/parity-log.txt"; then
            echo "::error::deberta_v3_real skipped despite a requested full run — env/artifact plumbing bug"
            PARITY_EXIT=1
          fi
          echo "PARITY_EXIT=${PARITY_EXIT}" >> "$GITHUB_ENV"
          {
            echo "### deberta-v3: numerical parity leg (final_hidden)"
            echo ""
            echo '```'
            tail -c 4096 "${RUNNER_TEMP}/parity-log.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${PARITY_EXIT}" -ne 0 ]; then
            echo "::error::deberta_v3_real_weight_final_hidden_parity failed — see step summary + artifacts"
            exit "${PARITY_EXIT}"
          fi

      - name: Run deberta_v3_convert_smoke (--ignored) against fresh safetensors
        # Structural smoke on the converter's public surface. Runs the
        # `#[ignore]`d `deberta_v3_convert_smoke` test in
        # `crates/vokra-convert/tests/deberta_convert.rs`, which expects
        # `tests/fixtures/sbv2/deberta-v3-large.safetensors` at repo root.
        # We symlink the just-produced safetensors into place so the test
        # sees the real, freshly-converted checkpoint (never a stale
        # committed fixture). The symlink is scoped to this job and does
        # not persist across runs.
        run: |
          set -euo pipefail
          FIX_DIR="tests/fixtures/sbv2"
          mkdir -p "${FIX_DIR}"
          FIX_LINK="${FIX_DIR}/deberta-v3-large.safetensors"
          rm -f "${FIX_LINK}"
          ln -sf "${DEBERTA_V3_SAFETENSORS}" "${FIX_LINK}"
          ls -l "${FIX_LINK}"
          set +e
          cargo test --locked --release -p vokra-convert \
            --test deberta_convert \
            deberta_v3_convert_smoke -- --ignored --nocapture \
            2>&1 | tee "${RUNNER_TEMP}/smoke-log.txt"
          SMOKE_EXIT=${PIPESTATUS[0]}
          set -e
          echo "SMOKE_EXIT=${SMOKE_EXIT}" >> "$GITHUB_ENV"
          rm -f "${FIX_LINK}"
          {
            echo "### deberta-v3: convert smoke (--ignored) leg"
            echo ""
            echo '```'
            tail -c 4096 "${RUNNER_TEMP}/smoke-log.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${SMOKE_EXIT}" -ne 0 ]; then
            echo "::error::deberta_v3_convert_smoke failed — see step summary + artifacts"
            exit "${SMOKE_EXIT}"
          fi

      - name: Zero-dep tripwire — root Cargo.lock unchanged (NFR-DS-02)
        # Belt-and-suspenders: the isolated uv oracle must not move the root
        # Rust lockfile.
        run: git diff --exit-code Cargo.lock

      - name: Upload parity artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deberta-v3-large-parity-artifacts
          path: |
            ${{ runner.temp }}/bin2st-log.txt
            ${{ runner.temp }}/convert-log.txt
            ${{ runner.temp }}/dump-log.txt
            ${{ runner.temp }}/parity-log.txt
            ${{ runner.temp }}/smoke-log.txt
            ${{ runner.temp }}/environment.txt
            ${{ runner.temp }}/deberta-v3-spm.json
            ${{ runner.temp }}/deberta-v3-large.gguf
            ${{ runner.temp }}/deberta-v3-refdata/reference_dump.manifest.json
            ${{ runner.temp }}/deberta-v3-refdata/reference_dump/**
          retention-days: 7
          if-no-files-found: warn

      - name: Propagate dumper exit code (if dumper was enabled)
        # Placed after artifact upload (artifacts-first, exit-last — same
        # ordering DFN3 / SBV2 use) so a failing job still ships the
        # diagnostic bundle. `DUMP_EXIT` is only set when the dumper step
        # ran; guard against unset to keep the gate honest.
        if: needs.setup.outputs.run_dumper == 'true' && env.DUMP_EXIT != '0' && env.DUMP_EXIT != ''
        run: |
          echo "::error::deberta_v3_dump_reference.py exited with ${DUMP_EXIT} — see summary + artifacts"
          exit "${DUMP_EXIT}"
