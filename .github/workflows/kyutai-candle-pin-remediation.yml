name: kyutai-candle-pin-remediation

on:
  pull_request:
    paths:
      - ".github/workflows/kyutai-candle-pin-remediation.yml"
      - "tools/parity/kyutai_candle_reference/collect_metadata.py"
      - "tools/parity/kyutai_candle_reference/pin_remediation_diagnostic.py"
      - "tools/parity/kyutai_candle_reference/test_pin_remediation_diagnostic.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kyutai-candle-pin-remediation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-only-pin-diagnostic:
    name: source-only four-pin Cargo diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/workflows/kyutai-candle-pin-remediation.yml
            tools/parity/kyutai_candle_reference/collect_metadata.py
            tools/parity/kyutai_candle_reference/pin_remediation_diagnostic.py
            tools/parity/kyutai_candle_reference/test_pin_remediation_diagnostic.py
          sparse-checkout-cone-mode: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.8.17"

      - name: Install Python 3.12 for stdlib diagnostics
        run: uv python install 3.12

      - name: Run offline stdlib diagnostics
        env:
          UV_OFFLINE: "1"
          UV_CACHE_DIR: ${{ runner.temp }}/vokra-uv-cache
        run: |
          set -euo pipefail
          uv run --no-project --python 3.12 python -m py_compile \
            tools/parity/kyutai_candle_reference/collect_metadata.py \
            tools/parity/kyutai_candle_reference/pin_remediation_diagnostic.py \
            tools/parity/kyutai_candle_reference/test_pin_remediation_diagnostic.py
          uv run --no-project --python 3.12 python -m unittest discover \
            -s tools/parity/kyutai_candle_reference \
            -p 'test_pin_remediation_diagnostic.py' -v

      - name: Install the minimal pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.99.0

      - name: Verify the Linux host and toolchain
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(rustc --version | cut -d' ' -f2)" = 1.99.0
          test "$(rustc -vV | awk '$1 == "host:" { print $2 }')" = x86_64-unknown-linux-gnu

      - name: Capture and run the bounded four-pin source-only diagnostic
        env:
          VOKRA_CANDLE_REMOTE_LINUX: "1"
        run: |
          set -euo pipefail
          capture_root="$RUNNER_TEMP/vokra-candle-pin-capture-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          pin_root="$RUNNER_TEMP/vokra-candle-pin-result-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          pin_workspace="$RUNNER_TEMP/vokra-candle-pin-workspace-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$pin_root"
          test ! -L "$pin_root"
          test ! -e "$pin_workspace"
          test ! -L "$pin_workspace"
          uv run --no-project --python 3.12 python \
            tools/parity/kyutai_candle_reference/pin_remediation_diagnostic.py \
            "$capture_root" "$pin_root" "$pin_workspace" --capture-source --deadline-seconds 480

      - name: Check the exact bounded evidence set
        if: always()
        run: |
          set -euo pipefail
          capture_root="$RUNNER_TEMP/vokra-candle-pin-capture-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          pin_root="$RUNNER_TEMP/vokra-candle-pin-result-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          missing=0
          for relative in \
            source_receipt.json \
            source/rust/Cargo.lock \
            base/Cargo.lock \
            patched/Cargo.lock \
            initial_metadata.json \
            whole_lock_metadata.json \
            metadata.json; do
            if [ ! -f "$capture_root/$relative" ]; then
              echo "::error file=$relative::missing required source packet evidence"
              missing=1
            fi
          done
          for relative in candidate.lock candidate_cpu_metadata.json candidate_whole_metadata.json pin_diagnostic.json baseline_cpu_metadata.json baseline_whole_metadata.json; do
            if [ ! -f "$pin_root/$relative" ]; then
              echo "::error file=$relative::missing required pin diagnostic evidence"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Upload exact bounded evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kyutai-candle-pin-remediation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/vokra-candle-pin-capture-${{ github.run_id }}-${{ github.run_attempt }}/source_receipt.json
            ${{ runner.temp }}/vokra-candle-pin-capture-${{ github.run_id }}-${{ github.run_attempt }}/source/rust/Cargo.lock
            ${{ runner.temp }}/vokra-candle-pin-capture-${{ github.run_id }}-${{ github.run_attempt }}/base/Cargo.lock
            ${{ runner.temp }}/vokra-candle-pin-capture-${{ github.run_id }}-${{ github.run_attempt }}/patched/Cargo.lock
            ${{ runner.temp }}/vokra-candle-pin-capture-${{ github.run_id }}-${{ github.run_attempt }}/initial_metadata.json
            ${{ runner.temp }}/vokra-candle-pin-capture-${{ github.run_id }}-${{ github.run_attempt }}/whole_lock_metadata.json
            ${{ runner.temp }}/vokra-candle-pin-capture-${{ github.run_id }}-${{ github.run_attempt }}/metadata.json
            ${{ runner.temp }}/vokra-candle-pin-result-${{ github.run_id }}-${{ github.run_attempt }}/candidate.lock
            ${{ runner.temp }}/vokra-candle-pin-result-${{ github.run_id }}-${{ github.run_attempt }}/candidate_cpu_metadata.json
            ${{ runner.temp }}/vokra-candle-pin-result-${{ github.run_id }}-${{ github.run_attempt }}/candidate_whole_metadata.json
            ${{ runner.temp }}/vokra-candle-pin-result-${{ github.run_id }}-${{ github.run_attempt }}/pin_diagnostic.json
            ${{ runner.temp }}/vokra-candle-pin-result-${{ github.run_id }}-${{ github.run_attempt }}/baseline_cpu_metadata.json
            ${{ runner.temp }}/vokra-candle-pin-result-${{ github.run_id }}-${{ github.run_attempt }}/baseline_whole_metadata.json
          if-no-files-found: error
          retention-days: 1
