# Model-free guard for whisper-extras real-weight parity.
#
# GitHub-hosted runners must not download, convert, or execute the >=2 GiB
# Whisper checkpoints. The authoritative real-weight route is
# tools/parity/whisper_extras/run_vast_validation.sh on a disposable VAST
# Linux/x86_64 worker. This workflow only checks the locked reference project,
# shell/static contracts, and Rust formatting; it cannot claim model parity.

name: parity-whisper-extras-real

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/parity-whisper-extras-real.yml"
      - "crates/vokra-models/tests/parity_whisper_extras.rs"
      - "crates/vokra-models/src/distil_whisper/**"
      - "crates/vokra-models/src/kotoba_whisper/**"
      - "crates/vokra-models/src/whisper/**"
      - "crates/vokra-convert/src/models/kotoba_whisper.rs"
      - "crates/vokra-convert/src/lib.rs"
      - "crates/vokra-convert/src/main.rs"
      - "crates/vokra-cli/src/convert.rs"
      - "tools/parity/whisper_extras/**"

permissions:
  contents: read

jobs:
  model-free-gates:
    name: model-free gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Forward pins for the two official HF repositories; this job remains
      # model-free and does not download either checkpoint.
      DISTIL_LARGE_V3_5_HF_ID: "distil-whisper/distil-large-v3.5"
      KOTOBA_WHISPER_V2_2_HF_ID: "kotoba-tech/kotoba-whisper-v2.2"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.8.17"

      - name: Verify CPU-only locked reference environment
        run: |
          set -euo pipefail
          uv lock --check --project tools/parity/whisper_extras
          uv run --no-project --python 3.12 python -c "print('model-free uv runtime: OK')"
          if grep -nE '^name = "nvidia-' tools/parity/whisper_extras/uv.lock; then
            echo "nvidia/CUDA packages are forbidden in the reference lock" >&2
            exit 1
          fi
          lock_package_count="$(grep -cE '^name = ' tools/parity/whisper_extras/uv.lock || true)"
          test "$lock_package_count" -gt 0

      - name: Run model-free VAST runner self-test
        run: bash tools/parity/whisper_extras/run_vast_validation.sh --self-test

      - name: Check independent reference and fixed provenance pins
        run: |
          set -euo pipefail
          grep -F 'transformers.WhisperForConditionalGeneration' \
            tools/parity/whisper_extras/dump_reference.py
          grep -F '728a7691f3ff1d3d971528d3203a6e9559165d41' \
            crates/vokra-models/tests/parity_whisper_extras.rs \
            tools/parity/whisper_extras/dump_reference.py
          grep -F '9d33482a0eb9b57f1ad80708e8ac5538246d8355' \
            crates/vokra-models/tests/parity_whisper_extras.rs \
            tools/parity/whisper_extras/dump_reference.py
          grep -F '"language": "ja"' tools/parity/whisper_extras/dump_reference.py
          grep -F 'generation_config_sha256' tools/parity/whisper_extras/dump_reference.py
          grep -F 'tokenizer_sha256' tools/parity/whisper_extras/dump_reference.py
          grep -F '50_258, 50_266, 50_360, 50_364' \
            crates/vokra-models/tests/parity_whisper_extras.rs
          grep -F 'language="ja"' crates/vokra-models/src/kotoba_whisper/mod.rs \
            crates/vokra-convert/src/models/kotoba_whisper.rs
          ! grep -nE 'from vokra|import vokra|snapshot_download|vokra-cli convert' \
            tools/parity/whisper_extras/dump_reference.py

      - name: Shell and Rust static gates
        run: |
          set -euo pipefail
          bash -n tools/parity/whisper_extras/run_vast_validation.sh
          cargo fmt --all -- --check
          git diff --check

      - name: State authoritative execution route
        run: |
          {
            echo "## Whisper extras real-weight parity"
            echo
            echo "This job is model-free and does not establish parity."
            echo "Authoritative route: VAST runner with an explicit --work-dir."
            echo "Scaleway/Apple Metal validation is a separate follow-up gate."
          } >> "$GITHUB_STEP_SUMMARY"
