# tts-continuous-vae family — flip-the-switch real-checkpoint parity CI
# (SoTA Phase 1, 2026-07-25).
#
# Membership (docs/tickets/sota-coverage-plan-…):
#
#   * voxcpm2   → openbmb/VoxCPM2            (Apache 2.0, pinned SHA below)
#   * vibevoice → microsoft/VibeVoice-1.5B   (MIT,        pinned SHA below)
#
# The Rust harness (crates/vokra-models/tests/parity_tts_continuous_vae.rs)
# is env-gated: `VOKRA_<ARCH>_GGUF` toggles the shape/metadata leg on, and
# `VOKRA_<ARCH>_REFDIR` additionally toggles the byte-level reference
# comparison (atol = 0.01, NFR-QL-01). This workflow's job is to (a) fetch
# the pinned upstream release, (b) build vokra-cli, (c) convert to GGUF,
# (d) run the harness with the env vars pointing at the just-built GGUF —
# so the moment either weight-binding wave (T29-equivalent per each module
# rustdoc) lands, or the owner drops a reference dump, the leg fires.
#
# Design (mirrors parity-kokoro-real.yml + parity-moshi-real.yml discipline):
#
#   * Trigger: workflow_dispatch (owner-driven, per-arch matrix input) +
#     weekly cron `30 11 * * 1` (Monday 11:30 UTC — its own slot in the
#     staggered weekly parity roster: kokoro 04:00, whisper 05:00, vulkan
#     05:30, cuda-rtf 06:00, csm 06:30, web-wasm 07:00, moshi 07:30, utmos
#     08:00, godot 08:30, tts-continuous-vae 11:30) + a NARROW pull_request
#     paths filter that only fires on model-adjacent code.
#
#   * Repository-variable gate `VOKRA_TTS_CONT_VAE_ENABLE=1` (or a
#     workflow_dispatch run) is required for the parity job to fire on
#     schedule / PR. The cron path clean-skips with a `::notice::` when the
#     variable is not set, so a cron run that finds the family not yet
#     enabled produces a visible skip, not a fabricated pass (FR-EX-08).
#     workflow_dispatch bypasses the gate — the dispatcher opted in.
#
#   * Per-model matrix: the parity job runs one row per family member.
#     `fail-fast: false` so a voxcpm2 hub outage does not mask a vibevoice
#     regression (and vice versa).
#
#   * HF snapshot download at pinned SHA. A snapshot re-upload / SHA drift
#     is an ::warning:: (the SHA has changed upstream, we did not) — the
#     workflow still runs against the new SHA, but the summary flags it so
#     the owner can decide whether to bump the pin.
#
#   * Python is provisioned through uv (root Cargo.lock untouched — NFR-DS-02;
#     the final `git diff --exit-code Cargo.lock` step is the tripwire).
#
#   * NOT registered as a required check. HF flakiness must not block PRs
#     (same posture as every other parity-*-real workflow); promotion to
#     required is an explicit owner decision after consecutive greens.
#
#   * Initial workflow_dispatch = owner (fabricated-pass 禁止 — this CI
#     never fires until the owner explicitly opts in).

name: parity-tts-continuous-vae-real

on:
  workflow_dispatch:
    inputs:
      only:
        description: >-
          Matrix filter — one of "all", "voxcpm2", or "vibevoice".
          Useful when triaging one family member without
          re-running the (>= 2 GB) download for the other.
        required: false
        default: all
        type: choice
        options:
          - all
          - voxcpm2
          - vibevoice
  schedule:
    # Weekly Monday 11:30 UTC — see header for the full staggered roster.
    - cron: "30 11 * * 1"
  pull_request:
    # Fires ONLY on tts-continuous-vae-adjacent code. Non-matching PRs run
    # the fixture-only committed leg via the per-PR required `parity` job
    # in ci.yml (no HF download); this workflow adds the real-checkpoint
    # verification when it becomes reachable.
    paths:
      - ".github/workflows/parity-tts-continuous-vae-real.yml"
      - "crates/vokra-convert/src/models/vibevoice.rs"
      - "crates/vokra-convert/src/models/voxcpm2.rs"
      - "crates/vokra-core/**"
      - "crates/vokra-models/src/compute.rs"
      - "crates/vokra-models/src/vibevoice/**"
      - "crates/vokra-models/src/voxcpm2/**"
      - "crates/vokra-models/tests/parity_tts_continuous_vae.rs"
      - "crates/vokra-ops/**"
      - "tools/parity/firered_asr_llm_l/prepare_checkpoint.py"

concurrency:
  group: parity-tts-continuous-vae-real-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned upstream revisions (fetched 2026-07-25 via huggingface.co/api/models).
  # A drift here is an ::warning:: below, not a hard fail — Vokra does not own
  # byte-identity of the upstream publish.
  VOXCPM2_REPO: openbmb/VoxCPM2
  VOXCPM2_REVISION: bffb3df5a29440629464e5e839f4d214c8714c3d
  VIBEVOICE_REPO: microsoft/VibeVoice-1.5B
  VIBEVOICE_REVISION: c00898d257e6b46004e3e2866a47534085fb685a
  PARITY_VENV: /tmp/vokra-tts-cont-vae-parity
  CARGO_TERM_COLOR: always

jobs:
  setup:
    name: gate (family opt-in)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      run_parity: ${{ steps.decide.outputs.run_parity }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: decide
        env:
          ENABLE_VAR: ${{ vars.VOKRA_TTS_CONT_VAE_ENABLE }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_parity=true" >> "$GITHUB_OUTPUT"
            echo "dispatch run: proceeding (the dispatcher opted in)"
          elif [ "${ENABLE_VAR}" = "1" ]; then
            echo "run_parity=true" >> "$GITHUB_OUTPUT"
            echo "VOKRA_TTS_CONT_VAE_ENABLE=1: proceeding"
          else
            echo "run_parity=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=parity-tts-continuous-vae-real clean skip::family opt-in not enabled — set the repository variable VOKRA_TTS_CONT_VAE_ENABLE=1 (or workflow_dispatch) to run the real-checkpoint conversion + parity. This is a clean gated skip, not a pass (fabricated pass 禁止, FR-EX-08)."
          fi

      - id: matrix
        env:
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          case "${ONLY:-}" in
            voxcpm2)
              echo 'matrix={"arch":["voxcpm2"]}' >> "$GITHUB_OUTPUT"
              ;;
            vibevoice)
              echo 'matrix={"arch":["vibevoice"]}' >> "$GITHUB_OUTPUT"
              ;;
            all|"")
              echo 'matrix={"arch":["voxcpm2","vibevoice"]}' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::unknown matrix filter ${ONLY}"
              exit 1
              ;;
          esac

  parity:
    name: parity-${{ matrix.arch }}
    needs: setup
    if: needs.setup.outputs.run_parity == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    env:
      HF_HOME: ${{ github.workspace }}/.hf-cache
      HF_HUB_CACHE: ${{ github.workspace }}/.hf-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Free hosted-runner disk (the >= 2 GB downloads + venv need headroom)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Resolve per-arch pins
        id: pins
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          case "${ARCH}" in
            voxcpm2)
              echo "repo=${VOXCPM2_REPO}" >> "$GITHUB_OUTPUT"
              echo "revision=${VOXCPM2_REVISION}" >> "$GITHUB_OUTPUT"
              echo "env_gguf=VOKRA_VOXCPM2_GGUF" >> "$GITHUB_OUTPUT"
              ;;
            vibevoice)
              echo "repo=${VIBEVOICE_REPO}" >> "$GITHUB_OUTPUT"
              echo "revision=${VIBEVOICE_REVISION}" >> "$GITHUB_OUTPUT"
              echo "env_gguf=VOKRA_VIBEVOICE_GGUF" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::unknown matrix arch ${ARCH} — add a case here"
              exit 1
              ;;
          esac

      - name: Cache HF checkpoint (per revision)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.HF_HOME }}
          key: tts-cont-vae-${{ matrix.arch }}-${{ steps.pins.outputs.revision }}-v1

      - name: Provision parity environment with uv (torch + safetensors + huggingface_hub)
        run: |
          set -euo pipefail
          uv venv --python 3.12 "${PARITY_VENV}"
          # torch CPU keeps the runner lean; the conversion path is
          # deterministic and never spins up a CUDA kernel.
          uv pip install --python "${PARITY_VENV}/bin/python" \
            --index-url https://download.pytorch.org/whl/cpu \
            'torch==2.9.1'
          uv pip install --python "${PARITY_VENV}/bin/python" \
            'numpy>=2,<3' \
            'safetensors>=0.4' \
            'huggingface_hub>=0.36'
          uv pip install --python "${PARITY_VENV}/bin/python" \
            'hf_transfer>=0.1.9' || true
          uv run --no-project --python "${PARITY_VENV}/bin/python" python - <<'PY'
          import torch, numpy, safetensors, huggingface_hub
          print(f"parity venv: torch={torch.__version__} numpy={numpy.__version__} "
                f"safetensors={safetensors.__version__} "
                f"huggingface_hub={huggingface_hub.__version__}")
          PY

      # snapshot_download @ pinned SHA. Advisory posture: a SHA mismatch is
      # an ::warning::, not a hard fail (the pin might be stale, not the
      # checkpoint corrupted — that decision is the owner's).
      - name: Download ${{ matrix.arch }} @ pinned SHA (HF hub)
        env:
          HF_HUB_ENABLE_HF_TRANSFER: "1"
          REPO: ${{ steps.pins.outputs.repo }}
          REVISION: ${{ steps.pins.outputs.revision }}
          MATRIX_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          # GitHub Actions semantics: `$GITHUB_ENV` writes propagate to
          # the NEXT step, not the current one. Capture the path from
          # stdout and use it inline; also emit to $GITHUB_ENV so
          # downstream steps see it. (Same pattern as parity-tts-dac
          # SNAPSHOT_DIR fix, commit 856fb02.)
          # `python -c` (not a heredoc): a heredoc inside $() cannot be closed
          # from column 0 in a `run: |` block, which `scripts/check-workflow-
          # hygiene.sh` catches via `bash -n`. Mirror the parity-tts-dac
          # precedent — single-quoted Python string literals nested inside
          # the double-quoted `-c` argument.
          SNAPSHOT_STDOUT="$(uv run --no-project --python "${PARITY_VENV}/bin/python" python -c "
          import os
          from huggingface_hub import snapshot_download
          repo = os.environ['REPO']
          rev = os.environ['REVISION']
          # Only pull safetensors + config.json — no README / demo audio.
          local = snapshot_download(
              repo_id=repo,
              revision=rev,
              allow_patterns=['*.safetensors', '*.safetensors.index.json', 'config.json'],
          )
          print(f'snapshot: {local}')
          ")"
          echo "${SNAPSHOT_STDOUT}"
          CKPT_DIR="$(echo "${SNAPSHOT_STDOUT}" | awk -F'snapshot: ' '/^snapshot: /{print $2; exit}')"
          if [ -z "${CKPT_DIR}" ] || [ ! -d "${CKPT_DIR}" ]; then
            echo "::error::snapshot_download did not print a resolvable path (got: ${SNAPSHOT_STDOUT})"
            exit 1
          fi
          echo "CKPT_DIR=${CKPT_DIR}" >> "$GITHUB_ENV"
          {
            echo "### ${MATRIX_ARCH} checkpoint"
            echo ""
            echo "- Repo: \`${REPO}\`"
            echo "- Revision: \`${REVISION}\`"
            echo "- Local dir: \`${CKPT_DIR}\`"
            du -sh "${CKPT_DIR}" 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build vokra-cli (release)
        run: cargo build --release -p vokra-cli

      # The Rust converter consumes one safetensors file. For a sharded
      # checkpoint, merge every shard in index order through the existing
      # fail-loud sidecar. The sidecar preserves F32/F16/BF16, rejects
      # unexpected non-float state, and emits SHA/shared-storage audit files.
      # VAST 47955178 proved this exact path against all three pinned
      # VibeVoice-1.5B shards on 2026-08-18 (1,204 tensors; zero drops).
      - name: Prepare complete safetensors input for converter
        id: input
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          if [ -z "${CKPT_DIR:-}" ]; then
            echo "::error::CKPT_DIR not set — the snapshot_download step failed"
            exit 1
          fi
          if [ -f "${CKPT_DIR}/model.safetensors" ]; then
            echo "input=${CKPT_DIR}/model.safetensors" >> "$GITHUB_OUTPUT"
            echo "sharded=false" >> "$GITHUB_OUTPUT"
            echo "primary safetensors: ${CKPT_DIR}/model.safetensors"
          else
            shopt -s nullglob
            shards=("${CKPT_DIR}"/*.safetensors)
            if [ "${#shards[@]}" -eq 0 ]; then
              echo "::error::no *.safetensors under ${CKPT_DIR} — snapshot pattern miss?"
              exit 1
            fi
            if [ "${#shards[@]}" -eq 1 ]; then
              echo "input=${shards[0]}" >> "$GITHUB_OUTPUT"
              echo "sharded=false" >> "$GITHUB_OUTPUT"
              echo "single safetensors payload: ${shards[0]}"
            else
              merged="${RUNNER_TEMP}/${ARCH}.merged.safetensors"
              uv run --no-project --python "${PARITY_VENV}/bin/python" python \
                tools/parity/firered_asr_llm_l/prepare_checkpoint.py \
                --input-dir "${CKPT_DIR}" \
                --output "${merged}" \
                2>&1 | tee "${RUNNER_TEMP}/merge-log.txt"
              echo "input=${merged}" >> "$GITHUB_OUTPUT"
              echo "sharded=true" >> "$GITHUB_OUTPUT"
              {
                echo "### ${ARCH}: complete sharded checkpoint merged"
                echo ""
                echo "- Shards: ${#shards[@]}"
                echo "- Input: \`${merged}\`"
                echo "- SHA-256: \`$(cut -d' ' -f1 "${merged}.sha256")\`"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Convert to GGUF (vokra-cli convert --model ${{ matrix.arch }})
        id: convert
        env:
          ARCH: ${{ matrix.arch }}
          INPUT: ${{ steps.input.outputs.input }}
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/${ARCH}.gguf"
          set +e
          ./target/release/vokra-cli convert \
            --model "${ARCH}" \
            --input "${INPUT}" \
            --output "${OUT}" \
            2>&1 | tee "${RUNNER_TEMP}/convert-log.txt"
          CONVERT_EXIT=${PIPESTATUS[0]}
          set -e
          if [ "${CONVERT_EXIT}" -ne 0 ]; then
            # The BF16 unwidened source path prints a loud "no float tensors
            # passed through" note; the converter still exits non-zero
            # because the metadata-only GGUF is not useful.
            {
              echo "### ${ARCH}: conversion FAILED"
              echo ""
              echo '```'
              tail -c 4096 "${RUNNER_TEMP}/convert-log.txt"
              echo '```'
              echo ""
              echo "**Likely cause**: the upstream release is BF16 and the F32/F16"
              echo "pass-through arm does not widen it. Pre-widen offline (the"
              echo "CSM / Kokoro / VoxCPM recipe) or wait for the streaming BF16"
              echo "pass-through path to land (T29-equivalent, per each converter's"
              echo "rustdoc)."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "converted=false" >> "$GITHUB_OUTPUT"
            echo "gguf=" >> "$GITHUB_OUTPUT"
            exit "${CONVERT_EXIT}"
          fi
          echo "converted=true" >> "$GITHUB_OUTPUT"
          echo "gguf=${OUT}" >> "$GITHUB_OUTPUT"
          {
            echo "### ${ARCH}: conversion OK"
            echo ""
            echo "- Output: \`${OUT}\`"
            echo "- Size: $(wc -c < "${OUT}" | numfmt --to=iec)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run parity harness (VOKRA_${{ matrix.arch }}_GGUF)
        if: steps.convert.outputs.converted == 'true'
        env:
          ARCH: ${{ matrix.arch }}
          GGUF: ${{ steps.convert.outputs.gguf }}
          ENV_GGUF: ${{ steps.pins.outputs.env_gguf }}
        run: |
          set -euo pipefail
          # Export the arch-specific env var the harness reads. `env` avoids
          # dynamic-var syntax pitfalls in `bash`.
          env "${ENV_GGUF}=${GGUF}" \
            cargo test --release -p vokra-models \
              --test parity_tts_continuous_vae \
              "parity_${ARCH}" -- --exact --nocapture \
            2>&1 | tee "${RUNNER_TEMP}/parity-${ARCH}.txt"
          {
            echo "### ${ARCH}: parity leg"
            echo ""
            echo '```'
            grep -E "^\[parity/" "${RUNNER_TEMP}/parity-${ARCH}.txt" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Zero-dep tripwire — root Cargo.lock unchanged (NFR-DS-02)
        # Belt-and-suspenders: uv-installing torch inside the parity environment
        # must not have moved the root Rust lockfile.
        run: git diff --exit-code Cargo.lock

      - name: Upload parity artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tts-cont-vae-parity-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/merge-log.txt
            ${{ runner.temp }}/${{ matrix.arch }}.merged.safetensors.sha256
            ${{ runner.temp }}/${{ matrix.arch }}.merged.safetensors.shared_pairs.json
            ${{ runner.temp }}/convert-log.txt
            ${{ runner.temp }}/parity-*.txt
            ${{ runner.temp }}/${{ matrix.arch }}.gguf
          retention-days: 7
          if-no-files-found: warn
