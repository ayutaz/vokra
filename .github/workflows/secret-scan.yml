# Vokra secret scan (FQ-08 P0, 2026-07-31).
#
# Runs gitleaks (MIT-licensed OSS, github.com/gitleaks/gitleaks) against the
# working tree on every pull request, push to main, and manual dispatch.
# gitleaks is chosen over truffleHog because truffleHog v3 is AGPL-3.0 which
# is incompatible with Vokra's zero-copyleft ingest policy (CLAUDE.md §
# "License / cargo-deny"). gitleaks is MIT and only runs inside a GitHub
# Actions container image — it never links into the shipped Vokra binary,
# so the licence surface for downstream users is unaffected.
#
# What is scanned:
#   * The full working tree at the checked-out ref (`--source /repo
#     --no-git`). Working-tree scan catches stray secrets in files that
#     were force-added despite `.gitignore` (e.g. a paste-buffer `.env`
#     that a contributor `git add -f`'d, or an HF/OpenAI/Anthropic/AWS
#     token accidentally left inside a docstring or an ADR).
#   * `check-forbidden-symbols.sh` (in ci-quality.yml) is a *symbol* scan
#     that greps for banned crate names — it is NOT a secret scan and
#     would miss all of the leak shapes above. That is the coverage gap
#     FQ-08 closes.
#
# What is NOT scanned here:
#   * Full git history. Doing a full-history scan on every PR would be
#     expensive (this repo has 40+ commits/wk with several 8+GB fixture
#     branches) and, more importantly, upstream commits cannot be rewritten
#     from a PR — a hit would be information without a fix. A separate
#     nightly full-history sweep is a good follow-up once this workflow
#     has run green for the 4-week promotion window.
#
# Advisory posture:
#   * `continue-on-error: true` at the job level for the first 4 weeks of
#     consecutive green runs. During that window the job status will show
#     failure on any hit, but the workflow's overall status stays success
#     so branch-protection required checks are not blocked.
#   * Promotion criteria (owner decision, matches ci-quality advisory
#     posture in coverage.yml § "Promotion to required"):
#       - >= 4 consecutive weeks of green (no gitleaks findings) on main.
#       - Zero false-positive PRs during that window (each FP is a
#         `.gitleaks.toml` allowlist gap; fix in that file, not by
#         disabling the scan).
#       - Owner flips `continue-on-error: true` -> `false` (or removes
#         the line) and adds `secret-scan / gitleaks` to the required
#         checks list.
#
# Zero-dep (NFR-DS-02):
#   * gitleaks runs inside the pre-built `zricethezav/gitleaks:latest`
#     Docker image on GitHub-hosted `ubuntu-latest`. No `cargo` invocation
#     happens in this workflow, so the root `Cargo.lock` cannot drift. A
#     final `git diff --exit-code` on `Cargo.lock` guards against future
#     step additions accidentally invoking `cargo`.
#   * The image tag is `:latest` rather than a digest pin deliberately for
#     this advisory launch — gitleaks' MIT ruleset is updated frequently
#     with new provider regexes (Anthropic, OpenAI GPT-4o, etc.) and
#     stale rule sets are a bigger risk than tag drift for a secret
#     scanner. Once promoted to required, owner should switch to a
#     digest pin bumped weekly by dependabot (see `.github/dependabot.yml`
#     `production-actions` group for the same posture applied to Actions).

name: secret-scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Own concurrency group; cancel superseded PR runs on non-main refs so a
# fast follow-up push does not queue behind a stale scan.
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (advisory)
    runs-on: ubuntu-latest
    # Advisory for the first 4 weeks of green (see docstring above). Flip to
    # `false` after the promotion window closes.
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Working-tree scan only needs depth 1, but we keep depth 0 to
          # leave the door open for `--log-opts` history-diff scans in a
          # future promotion step without a second checkout.
          fetch-depth: 0

      # Belt-and-suspenders: reject any `.env`-shaped file that made it
      # into the git index even though `.gitignore` has `.env` and `.env.*`
      # entries (`git add -f .env` bypasses .gitignore). This runs BEFORE
      # gitleaks so a force-added .env is caught even if the .gitleaks.toml
      # path allowlist skips reading its contents.
      - name: Reject tracked .env files
        run: |
          set -euo pipefail
          tracked=$(git ls-files -z | tr '\0' '\n' | grep -E '^\.env(\..*)?$' || true)
          if [ -n "${tracked}" ]; then
            echo "ERROR: .env-style file(s) are tracked in git:"
            printf '  %s\n' ${tracked}
            echo ""
            echo "This is almost always a mistake — .env files usually"
            echo "contain HF_TOKEN, OPENAI_API_KEY or similar credentials."
            echo "Remove with:  git rm --cached <path> && git commit"
            exit 1
          fi
          echo "OK: no tracked .env-style files"

      # Config sanity: fail fast with a clear message if .gitleaks.toml is
      # syntactically broken, before spending a minute pulling the image.
      - name: Validate .gitleaks.toml syntax
        run: |
          set -euo pipefail
          if [ ! -f .gitleaks.toml ]; then
            echo "ERROR: .gitleaks.toml is missing at repo root"
            exit 1
          fi
          python3 - <<'PY'
          import sys
          try:
              import tomllib  # Python >= 3.11
          except ModuleNotFoundError:
              import tomli as tomllib  # ubuntu-latest ships tomli
          with open(".gitleaks.toml", "rb") as f:
              cfg = tomllib.load(f)
          # Minimal shape check — gitleaks itself does the deep validation
          # when it loads the file below. This guards against a truncated
          # or trivially malformed commit.
          if "allowlist" not in cfg and "rules" not in cfg and "extend" not in cfg:
              print("ERROR: .gitleaks.toml has no [allowlist], [[rules]], or [extend] table")
              sys.exit(1)
          print("OK: .gitleaks.toml parses and has recognised top-level tables")
          PY

      - name: gitleaks detect (working tree)
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/repo:ro" \
            zricethezav/gitleaks:latest \
            detect \
              --source /repo \
              --no-git \
              --config /repo/.gitleaks.toml \
              --verbose \
              --redact

      # NFR-DS-02 tripwire: this workflow must never touch Cargo.lock.
      - name: Cargo.lock unchanged
        run: |
          set -euo pipefail
          git diff --exit-code Cargo.lock
