[project]
name = "vokra-nanocodec-parity"
version = "0.1.0"
description = "Pinned official-NeMo preparation, Group-FSQ, and causal HiFi-GAN parity tools for NanoCodec"
requires-python = ">=3.12,<3.13"
dependencies = [
    "nemo_toolkit[tts] @ git+https://github.com/NVIDIA-NeMo/Speech.git@4fcff72febec9395fdbd4bfa0747bfda2ecd3cef",
    # The pinned TTS package's models/__init__.py imports EasyMagpieTTS
    # inference, whose import-time SpeechLM2 helper imports PEFT. Keep this
    # edge explicit because NeMo omits it from the tts extra metadata.
    "peft==0.20.0",
]

[tool.uv]
package = false
# NeMo declares text-unidecode unconditionally for text normalization, but the
# pinned AudioCodecModel oracle never imports that path.  Its license includes
# GPL alternatives, so fail closed and omit it instead of allowing a GPL
# package into the committed reference environment.
# NeMo pulls hydra-core 1.3.2 for its config plumbing; that release carries
# GHSA-2cp2-2r3c-7p7r and is fixed in 1.3.4. The AudioCodecModel oracle only
# reads the checkpoint's own config, so raising the floor is inert here.
override-dependencies = [
    # PEFT imports Accelerate at module import time. Keep the previously
    # audited exact version while its advisory remains unresolved; omitting
    # it would make the official NeMo package import fail.
    "accelerate==1.14.0",
    "text-unidecode ; python_version < '0'",
    # The pinned AudioCodecModel import-time path does not import the TTS
    # G2P modules that use NLTK.  Keep the upstream TTS extra for provenance,
    # but make this unused optional edge unsatisfiable for every supported
    # interpreter.  The lock/self-test fail closed if uv ever retains it.
    "nltk ; python_version < '0'",
    "hydra-core>=1.3.4",
    # The pinned NeMo TTS extra resolves Lightning transitively. Keep the
    # security-fixed pair synchronized so the official oracle never mixes
    # incompatible Lightning package releases.
    "lightning==2.6.6",
    "pytorch-lightning==2.6.6",
]
