[project]
name = "vokra-gigaam-v3-parity"
version = "0.1.0"
description = "Dedicated VAST-only GigaAM v3 reference/parity environment."
requires-python = ">=3.12,<3.13"

# This is the narrow closure for the fixed official GigaAM v3 remote-code
# reference and the safetensors preparer.  The fixed short-PCM AutoModel route
# only needs pyannote-core's top-level `pyannote` namespace for Transformers'
# remote-code import precheck.  It does not use the optional longform
# pyannote.audio/torchcodec stack; keeping those and Lightning out also keeps
# the checkpoint loader out of this environment.
# ONNX/onnxruntime are deliberately excluded: neither the reference dumper nor
# the preparer imports them.
# The exact resolved versions are recorded in the sibling uv.lock; this project
# must remain fail-closed until that lock is reviewed on the approved VAST host.
dependencies = [
    "hydra-core==1.3.*",
    "numpy==2.*",
    "omegaconf==2.3.*",
    "pyannote-core==6.0.*",
    "safetensors",
    "sentencepiece",
    "soundfile",
    # Torch 2.13.0 contains the GHSA-rrmf-rvhw-rf47 fix.  Torchaudio 2.11.0
    # is the official stable-ABI line for PyTorch 2.11 and newer:
    # https://docs.pytorch.org/audio/main/installation.html
    "torch==2.13.0",
    "torchaudio==2.11.0",
    "tqdm",
    "transformers==5.*",
]

[tool.uv]
package = false
environments = ["python_full_version == '3.12.*' and platform_machine == 'x86_64' and sys_platform == 'linux'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
