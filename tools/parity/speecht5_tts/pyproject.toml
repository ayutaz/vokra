[project]
name = "vokra-speecht5-tts-parity"
version = "0.1.0"
description = "Pinned independent Transformers 5.5.0 SpeechT5 TTS parity oracle"
requires-python = "==3.12.*"
dependencies = [
    "huggingface-hub==1.5.0",
    "numpy==1.26.4",
    "safetensors==0.8.0",
    "sentencepiece==0.2.2",
    "setuptools==83.0.0",
    "torch==2.4.1",
    "transformers==5.5.0",
    "typer==0.9.0",
]

[tool.uv]
package = false
no-binary-package = ["numpy"]
config-settings-package = { numpy = { setup-args = ["-Dblas=none", "-Dlapack=none"] } }
build-constraint-dependencies = [
    "Cython==3.0.12",
    "meson-python==0.15.0",
    "meson==1.12.0",
    "pyproject-metadata==0.12.1",
    "ninja==1.13.0",
    "patchelf==0.19.1.0",
    "packaging==26.3",
]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
