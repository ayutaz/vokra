[project]
name = "vokra-speecht5-tts-parity"
version = "0.1.0"
description = "Pinned independent Transformers 5.5.0 SpeechT5 TTS parity oracle"
requires-python = "==3.12.*"
dependencies = [
    "huggingface-hub==1.27.0",
    "numpy==1.26.4",
    "safetensors==0.8.0",
    "sentencepiece==0.2.2",
    "torch==2.13.0",
    "transformers==5.5.0",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
