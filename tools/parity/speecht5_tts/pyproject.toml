[project]
name = "vokra-speecht5-tts-parity"
version = "0.1.0"
description = "Pinned independent Transformers 4.45.2 SpeechT5 TTS parity oracle"
requires-python = "==3.12.*"
dependencies = [
    "huggingface-hub==0.25.2",
    "numpy==1.26.4",
    "safetensors==0.4.5",
    "sentencepiece==0.2.0",
    "torch==2.4.1",
    "transformers==4.45.2",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
