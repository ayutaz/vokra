[project]
name = "vokra-melotts-reference"
version = "0.1.0"
description = "Pinned independent upstream MeloTTS acoustic reference environment."
requires-python = ">=3.12,<3.13"
dependencies = [
    # Offline oracle only. None of these packages enter the zero-dependency
    # Rust runtime or its distribution.
    "huggingface-hub==0.29.3",
    "numpy==2.5.2",
    "torch==2.13.0",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
