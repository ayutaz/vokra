[project]
name = "vokra-bark-parity"
version = "0.1.0"
description = "Pinned independent Transformers 4.31.0 Bark reference; VAST only"
requires-python = "==3.12.*"
dependencies = [
    "huggingface-hub==0.24.7",
    "numpy==1.26.4",
    "safetensors==0.4.5",
    "torch==2.4.1",
    "transformers==4.31.0",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
