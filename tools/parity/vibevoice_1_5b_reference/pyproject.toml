[project]
name = "vokra-vibevoice-1-5b-reference"
version = "0.1.0"
description = "Dedicated, VAST-only official VibeVoice 1.5B reference adapter."
requires-python = ">=3.12,<3.13"
dependencies = [
    # This is the authenticated import closure of the pinned Microsoft
    # inference roles, not the full upstream demo environment.  In
    # particular, the reference writes raw PCM with stdlib ``struct`` and
    # therefore must not pull soundfile/libsndfile (or librosa/soxr).
    "diffusers==0.32.2",
    "numpy==2.2.6",
    "torch==2.7.1",
    "transformers==5.10.4",
    "tqdm==4.67.1",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.vokra.vibevoice_1_5b_reference]
source_import_closure = ["torch", "numpy", "tqdm", "transformers", "diffusers.DPMSolverMultistepScheduler"]
excluded_upstream_optional = ["accelerate", "gradio", "av", "aiortc", "ml-collections", "absl-py"]
