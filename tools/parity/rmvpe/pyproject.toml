[project]
name = "rmvpe-parity"
version = "0.2.0"
description = "Offline sidecar importing fixed yxlllc/RMVPE upstream code for the vokra-models RMVPE parity harness. Not shipped in the runtime."
requires-python = ">=3.12"
dependencies = [
    # The fixed upstream source is a PyTorch/torchaudio/librosa reference.
    # uv.lock pins the concrete offline sidecar environment; none of these
    # packages reaches root Cargo.lock or a Vokra runtime artifact.
    "torch>=2.0",
    "torchaudio>=2.0",
    "librosa>=0.10",
    # numpy: raw f32/u32 little-endian buffer materialisation (the parity
    #        harness reads via chunks_exact(4) and does not require an
    #        .npy header — see parity_rmvpe.rs L83-85).
    "numpy>=1.26",
    # WAV input is required to be 16 kHz so Rust and upstream receive the
    # same PCM without introducing a second resampler reference.
    "soundfile>=0.13",
]
