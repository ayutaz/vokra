[project]
name = "vokra-neutts-air-parity"
version = "0.1.0"
description = "Pinned independent official NeuTTS Air language-model reference"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate==1.12.0",
    "numpy>=1.26,<3",
    "torch==2.11.0",
    "transformers==4.57.6",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
