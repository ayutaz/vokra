[project]
name = "vokra-ultravox-parity"
version = "0.1.0"
description = "Pinned independent official Ultravox v0.5 reference"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate==1.3.0",
    "numpy>=1.26,<3",
    "peft==0.14.0",
    "torch==2.5.1",
    "transformers==4.48.1",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
