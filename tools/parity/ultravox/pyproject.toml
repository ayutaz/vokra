[project]
name = "vokra-ultravox-parity"
version = "0.1.0"
description = "Pinned independent official Ultravox v0.5 reference"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "torch==2.13.0",
    "transformers==5.10.4",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
