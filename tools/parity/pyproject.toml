[project]
name = "vokra-parity-tools"
version = "0.1.0"
description = "Offline sidecar tools for real-checkpoint prep, dump-reference, and fixture pipelines. NOT shipped as part of vokra-* runtime (see FR-LD-05, zero-dep NFR-DS-02)."
requires-python = ">=3.12"
dependencies = [
    "gguf>=0.19.0",
    "h5py>=3.16.0",
    "huggingface-hub>=1.24.0",
    "modelscope>=1.39.0",
    "mistral-common[soundfile]==1.8.5",
    "numpy>=1.26",
    "omegaconf>=2.3.1",
    "onnx>=1.22.0",
    "pyannote-audio>=4.0.7",
    "safetensors>=0.8.0",
    "sentencepiece>=0.2.2",
    "torch>=2.0",
    "torchaudio>=2.11.0",
    "transformers==5.14.1",
]

[project.optional-dependencies]
crepe = [
    "tensorflow>=2.20.0",
]

[tool.uv.workspace]
members = [
    "microwakeword",
    "rmvpe",
]
