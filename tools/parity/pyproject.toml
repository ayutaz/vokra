[project]
name = "vokra-parity-tools"
version = "0.1.0"
description = "Offline sidecar tools for real-checkpoint prep, dump-reference, and fixture pipelines. NOT shipped as part of vokra-* runtime (see FR-LD-05, zero-dep NFR-DS-02)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "gguf>=0.19.0",
    "h5py>=3.16.0",
    "huggingface-hub>=1.24.0",
    "librosa==0.11.0",
    "modelscope>=1.39.0",
    "mistral-common[soundfile]==1.11.7",
    "numpy>=1.26",
    "omegaconf==2.3.0",
    "onnx>=1.22.0",
    "onnxruntime>=1.23.0",
    "pandas>=2.2.0",
    "pyannote-audio>=4.0.7",
    "requests>=2.32.0",
    "safetensors>=0.8.0",
    "sentencepiece>=0.2.2",
    "snac @ git+https://github.com/hubertsiuzdak/snac@8f79a718f1ad71f94f79999f0071348227aff22e",
    "soundfile>=0.13.0",
    "speechbrain==1.0.3",
    "torch>=2.0",
    "torchaudio>=2.11.0",
    "transformers==5.15.0",
    "tqdm>=4.67.0",
    "vocos==0.1.0",
]

[project.optional-dependencies]
crepe = [
    "tensorflow>=2.20.0",
]
titanet = [
    "nemo-toolkit[asr]==3.0.0",
]

[tool.uv]
# hydra-core 1.3.2 arrives transitively through the SpeechBrain / pyannote
# config plumbing and carries GHSA-2cp2-2r3c-7p7r, fixed in 1.3.4. NeMo's asr
# extra declares an incompatible ceiling, so override rather than constrain; the
# sidecar
# tools only read each checkpoint's own config, so raising the floor is inert.
# NeMo also declares text-unidecode unconditionally for text normalization,
# but nothing under tools/ imports that path and its license offers only
# Artistic-1.0-Perl or GPL. Fail closed and omit it, matching the exclusion
# already carried by tools/parity/nanocodec.
override-dependencies = [
    "hydra-core>=1.3.4",
    "text-unidecode ; python_version < '0'",
]

[tool.uv.workspace]
members = ["."]
exclude = ["nanocodec", "conv_tasnet", "deepfake_detection", "microwakeword", "rmvpe", "pyannote_segmentation"]
