[project]
name = "vokra-csm-1b-reference"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.2.6",
    "torch==2.7.1",
    "transformers==4.52.1",
    # Transformers 4.52.1 metadata requires huggingface-hub >=0.30,<1.0.
    "huggingface-hub==0.36.2",
]

[tool.csm_reference]
dependency_status = "LOCKED_ADAPTED_SELECTION_LICENSE_AUDIT_PENDING"
transformers_compatibility = "transformers==4.52.1; huggingface-hub>=0.30,<1.0"
lock_sha256 = "32e3dffd8b21a6f39613ded211484dd95030e2889dd0c204f6e2b14ff72db50a"
selection_note = "Python 3.12 reference selection; torch/numpy/audio versions are adapted review pins, not upstream Sesame requirements."
license_status = "BLOCKED_LICENSE_METADATA_REVIEW"
license_evidence_lock_sha256 = "32e3dffd8b21a6f39613ded211484dd95030e2889dd0c204f6e2b14ff72db50a"
license_blocker = "The caller-owned PCM16 WAV decoder uses Python stdlib wave and NumPy only; soundfile/libsndfile and the forbidden librosa/soxr closure are excluded. The explicit PyTorch CPU index avoids NVIDIA/triton packages. The lock audit still has owner-policy blockers: certifi MPL-2.0, tqdm MPL-2.0 AND MIT, typing-extensions PSF-2.0, and NumPy bundled runtime notices (including GPL/LGPL components); every locked package row and source/marker identity must remain bound to the lock before installation or VAST execution."

# uv.lock is required and its SHA is bound above. The license gate remains
# fail-closed until the transitive package notices are reviewed.

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
