[project]
name = "vokra-t5-encoder-reference"
version = "0.1.0"
description = "Pinned official Transformers T5EncoderModel parity oracle for Vokra"
requires-python = "==3.12.*"
dependencies = [
    # VAST stock images require the repository's pre-0.30 mitigation; newer
    # hub clients can enter the broken xet-token/mirror route even after the
    # provisioning shim is removed. Transformers 4.45.2 is the established
    # in-tree pairing for this exact pin and contains the official T5 forward.
    "huggingface-hub==0.29.3",
    "numpy==2.5.2",
    "safetensors==0.8.0",
    "torch==2.13.0",
    "transformers==4.45.2",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
