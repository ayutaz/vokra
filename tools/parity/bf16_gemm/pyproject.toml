[project]
name = "vokra-bf16-gemm-reference"
version = "0.1.0"
description = "Pinned independent PyTorch BF16 GEMM reference for Vokra"
requires-python = "==3.12.*"
dependencies = [
    "torch==2.13.0",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
