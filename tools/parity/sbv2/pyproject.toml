[project]
name = "vokra-sbv2-reference"
version = "0.1.0"
description = "Pinned upstream SBV2 reference environment for Vokra parity."
requires-python = ">=3.12,<3.13"
dependencies = [
    # Offline/CI oracle only. These packages never enter a Vokra runtime or
    # distribution; the Rust workspace remains zero-dependency.
    "huggingface-hub==1.27.0",
    "loguru==0.7.3",
    "numpy==2.5.2",
    "protobuf==7.35.1",
    "pyopenjtalk==0.4.1",
    "safetensors==0.8.0",
    "sentencepiece==0.2.2",
    "torch==2.13.0",
    "transformers==5.5.0",
]

[tool.uv]
package = false
# pyopenjtalk 0.4.1 is sdist-only.  Keep its PEP 517 build environment
# reproducible without making these tools runtime dependencies.  The selected
# pins satisfy the authenticated v0.4.1 source's minimum/unversioned build
# requirements; they are project policy pins, not upstream exact versions.
build-constraint-dependencies = [
    "setuptools==80.9.0",
    "setuptools-scm==9.2.0",
    "cython==3.1.4",
    "cmake==4.1.0",
    "numpy==2.5.2",
]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
