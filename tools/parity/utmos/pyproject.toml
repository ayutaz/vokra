[project]
name = "vokra-utmos-parity"
version = "0.1.0"
description = "UTMOS safe state-dict preparation and reference-boundary tools"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "safetensors==0.8.0",
    "torch==2.8.0",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
