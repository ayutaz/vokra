[project]
name = "vokra-htdemucs-multi-parity"
version = "0.1.0"
description = "VAST-only independent HT-Demucs reference and provenance audit sidecar."
requires-python = "==3.12.*"
dependencies = [
    "einops",
    "julius>=0.2.3",
    "numpy",
    "pyyaml",
    "torch>=1.8.1",
    "tqdm",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
