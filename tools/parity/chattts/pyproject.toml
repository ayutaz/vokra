[project]
name = "vokra-chattts-reference"
version = "0.1.0"
description = "VAST-only official ChatTTS composite reference evidence"
requires-python = ">=3.12,<3.13"
dependencies = [
    # These are the minimal packages imported by the fixed source's custom
    # local-load path plus the authenticated inspection/reference harness.
    # The source setup.py constraints are intentionally looser; exact adapted
    # Python-3.12 selections are recorded in the lock and metadata below.
    # transformers 5.10.4 requires huggingface-hub>=1.5.0; the fixed source
    # uses snapshot_download-compatible APIs, so the minimum compatible hub
    # release is pinned here as part of the authenticated reference closure.
    "huggingface-hub==1.5.0",
    "numba==0.63.1",
    "numpy==2.3.5",
    "pybase16384==0.3.0",
    "pyyaml==6.0.3",
    "safetensors==0.7.0",
    "torch==2.7.1",
    "torchaudio==2.7.1",
    "tqdm==4.67.1",
    # The source declares transformers>=4.41.1. GHSA-xrqw-3rrv-vx5w is fixed
    # at 5.10.0; 5.10.4 is the current non-yanked isolated runtime pin.
    "transformers==5.10.4",
    "vector-quantize-pytorch==1.27.15",
    "vocos==0.1.0",
    # GHSA-gc5v-m9x4-r6x2 affects requests <2.33.0; keep the reference
    # environment on the first upstream patched release.
    "requests==2.33.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.vokra.chattts_reference]
source_repository = "https://github.com/2noise/ChatTTS.git"
source_revision = "77b89ee281cd479f5b1a787ada330dc975ca1f2a"
source_license = "AGPLv3+"
weight_license = "CC-BY-NC-4.0"
transformers_security_advisory = "GHSA-xrqw-3rrv-vx5w"
transformers_security_patched_minimum = "5.10.0"
isolated_transformers_pin = "5.10.4"
selection_status = "AUTHENTICATED_CPU_INDEX_METADATA_LOCKED"
selection_note = "Exact Python 3.12 adapted selections for the fixed source's local custom-load path and authenticated inspector; not a copy of upstream loose install_requires."
upstream_install_requires = [
    "numba",
    "numpy<3.0.0",
    "pybase16384",
    "torch>=2.1.0",
    "torchaudio",
    "tqdm",
    "transformers>=4.41.1",
    "vector_quantize_pytorch",
    "vocos",
]
excluded_upstream_optional = [
    "IPython",
    "gradio",
    "pynini",
    "WeTextProcessing",
    "nemo_text_processing",
    "av",
    "pydub",
]
torch_index = "https://download.pytorch.org/whl/cpu"
forbidden_packages = ["soxr", "rubberband", "triton", "nvidia-cuda-runtime-cu12", "nvidia-cublas-cu12"]
lock_sha256 = "6099870e3685fec99e8ae68745d37ce4e71138d353cf056540d092b3d55ac4c5"
package_inventory_sha256 = "74c0c3ef9afd095594e24afc48e0d2148717308aa317ea9762eb9b10d2f0ec7f"
lock_package_rows_sha256 = "19395b8e7796dc26af01df77e3b786299391c38f3f861d2e9b59e29175b1cb4c"

