[project]
name = "vokra-parler-tts-parity"
version = "0.1.0"
description = "Pinned independent official Parler-TTS reference; VAST only"
requires-python = "==3.12.*"
dependencies = [
    "numpy==1.26.4",
    "parler-tts @ git+https://github.com/huggingface/parler-tts.git@d108732cd57788ec86bc857d99a6cabd66663d68",
    "torch==2.5.1",
    "transformers==4.46.1",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
