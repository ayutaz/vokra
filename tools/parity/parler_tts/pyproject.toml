[project]
name = "vokra-parler-tts-parity"
version = "0.1.0"
description = "Pinned independent official Parler-TTS reference closure; VAST only"
requires-python = "==3.12.*"
dependencies = [
    "numpy==1.26.4",
    # The official source is loaded from the separately authenticated checkout
    # via PARLER_TTS_SOURCE_DIR; its setup metadata declares audiotools/protobuf,
    # but this fixed inference path never imports those modules.
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "transformers==5.10.4",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
# The fixed inference route never imports setuptools.  Keep the transitive
# build-tool requirement impossible so uv omits setuptools, including its
# forbidden LGPLv3 vendored autocommand payload, from the frozen runtime
# closure.  Do not replace this with a newer setuptools pin: the payload is
# still bundled there.
override-dependencies = ["setuptools ; python_version < '0'"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
