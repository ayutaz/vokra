[project]
name = "vokra-audioldm2-reference"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
# This intentionally has no installable dependency set yet.  The official
# Diffusers v0.21.0 setup.py at SOURCE_COMMIT declares broad lower bounds
# (`torch>=1.4`, `transformers>=4.25.1`, `huggingface-hub>=0.13.2`,
# `numpy`, `safetensors`, `Pillow`, `filelock`, `requests`, `regex`, and
# `importlib_metadata`), while the AudioLDM2 pipeline imports torch/numpy and
# the Transformers CLAP/T5/GPT-2/SpeechT5 classes.  It only conditionally
# imports librosa for audio scoring; scipy is used by the official example
# writer, not by the pipeline module itself.  Those source declarations do
# not select exact Python-3.12-compatible torch/transformers builds or their
# transitive graph.  Do not turn this into a runnable reference environment
# by guessing versions.
#
# The fixed source is executed from its authenticated checkout via sys.path,
# never from an unpinned PyPI diffusers wheel.  A reviewed uv.lock containing
# exact versions, hashes, and license evidence is a prerequisite before any
# source/model acquisition; until then the reference and validation scripts
# remain fail-closed.

[tool.vokra.audioldm2_reference]
source_repository = "https://github.com/huggingface/diffusers.git"
source_revision = "29f15673ed5c14e4843d7c837890910207f72129"
source_version = "0.21.0"
source_execution = "authenticated checkout via sys.path"
dependency_selection_status = "UNRESOLVED_EXACT_PYTHON312_GRAPH"
lock_status = "REQUIRED_BEFORE_DOWNLOAD_OR_REFERENCE"
runtime_imports = ["numpy", "torch", "transformers", "huggingface-hub", "Pillow", "filelock", "requests", "regex", "safetensors", "tqdm"]
optional_route_imports = ["accelerate>=0.17.0 (only enable_model_cpu_offload)", "librosa (automatic audio scoring)", "scipy (official example output writer)"]
