[project]
name = "vokra-qwen3-tts-parity"
version = "0.1.0"
description = "Pinned independent official Qwen3-TTS reference dumper"
requires-python = ">=3.12,<3.13"
dependencies = [
    # The official source tree is staged at the fixed Git revision and loaded
    # through PYTHONPATH; installing qwen-tts would also install its demo and
    # ONNX extras (gradio, onnxruntime, protobuf, and sox).
    "accelerate==1.12.0",
    "einops==0.8.2",
    "librosa==1.0.0",
    "numpy==2.5.2",
    "soundfile==0.14.0",
    "torch==2.7.1",
    "torchaudio==2.11.0",
    "transformers==4.57.3",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
