[project]
name = "vokra-qwen3-asr-parity"
version = "0.1.0"
description = "Pinned independent official Qwen3-ASR reference dumper"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "qwen-asr==0.0.6",
    "torch==2.11.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
