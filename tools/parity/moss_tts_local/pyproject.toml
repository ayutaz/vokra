[project]
name = "vokra-moss-tts-local-parity"
version = "0.1.0"
description = "Pinned official MOSS-TTS Local reference environment; VAST only"
requires-python = "==3.12.*"
dependencies = [
    "huggingface-hub==1.27.0",
    "numpy==2.3.5",
    "safetensors==0.8.0",
    "torch==2.7.1",
    "transformers==5.10.4",
]

[tool.uv]
package = false
environments = ["python_full_version == '3.12.*' and platform_machine == 'x86_64' and sys_platform == 'linux'"]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cuda" }

[tool.moss_tts_local]
# This is the prior isolated reference pin, not an upstream requirement.  The
# current isolated reference pin is security-remediated, but API compatibility
# remains unverified because model execution is VAST-only.
previous_isolated_transformers_pin = "transformers==5.5.0"
transformers_security_advisory = "GHSA-xrqw-3rrv-vx5w"
transformers_security_patched_minimum = "5.10.0"
isolated_transformers_pin = "5.10.4"
transformers_compatibility_status = "BLOCKED_UNVERIFIED_API_SMOKE"
