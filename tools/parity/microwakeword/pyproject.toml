[project]
name = "microwakeword-prep"
version = "0.1.0"
description = "Offline sidecar: kahrendt/microWakeWord TFLite → Vokra GGUF (vokra.kws.* metadata). NOT shipped as part of vokra-* runtime (FR-LD-05, zero-dep NFR-DS-02)."
requires-python = "==3.12.*"
dependencies = [
    # NumPy is imported only by the authenticated conversion path (the direct
    # GGUF writer and --self-test remain standard-library-only).
    "numpy==2.5.2",
    # ai-edge-litert: the current TFLite runtime (Google renamed `tflite-runtime`
    #       to `ai-edge-litert` in 2024-Q3; the old name has no py3.12 wheels).
    #       Provides `Interpreter.get_tensor_details()` for topology + weights.
    #       Apache-2.0.
    "ai-edge-litert==2.2.0",
]
