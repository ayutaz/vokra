[project]
name = "vokra-canary-1b-reference"
version = "0.1.0"
description = "VAST-only official NVIDIA NeMo Canary-1B reference and model-free closure audit"
requires-python = "==3.12.*"
dependencies = [
    "hydra-core==1.3.6",
    "nemo-toolkit[asr]==3.0.0",
    "torch==2.13.0",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
# NeMo's Linux metadata declares CUDA bindings even for a CPU reference.
# This override is intentionally impossible to satisfy and therefore removes
# only that optional host integration; the official NeMo Python package remains
# the executed oracle.  The audit records the resulting closure as blocked.
override-dependencies = [
    "cuda-bindings ; python_version < '0'",
    "hydra-core==1.3.6",
    # NeMo 3.0.0 caps its Lightning requirement at 2.4.0, but that release
    # contains GHSA-qqmf-gpg7-g8gw (CVE-2026-58659).  Keep the official NeMo
    # oracle while replacing only this transitive runtime package with the
    # first released security fix; the lock records the resulting override.
    "lightning==2.6.6",
    "text-unidecode ; python_version < '0'",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
