[project]
name = "cosyvoice2-hift-reference"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "numpy==2.3.5",
    "scipy==1.16.3",
    "torch==2.7.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
