[project]
name = "vokra-zonos-v0-1-reference"
version = "0.1.0"
description = "VAST-only adapter environment for the pinned official Zonos-v0.1 transformer reference"
requires-python = ">=3.12,<3.13"
dependencies = [
    # This is the minimum import/runtime closure for Zonos.from_local plus its
    # official transformer/DAC path.  Text phonemization is intentionally not
    # included: the packet path supplies IDs and must never pull eSpeak.
    "huggingface-hub==1.5.0",
    "numpy==2.2.2",
    "safetensors==0.5.3",
    "setuptools==84.0.0",
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "tqdm==4.67.1",
    "transformers==5.10.4",
]

[tool.uv]
package = false
# Torch 2.11.0's wheel metadata still declares the vulnerable build-time
# setuptools<82 range. The dedicated worker does not build Torch from source;
# this explicit override keeps the installed runtime on patched setuptools
# 84.0.0 while leaving the upstream metadata conflict visible in
# the dependency audit/README.
override-dependencies = ["setuptools==84.0.0"]
# The dedicated lock is generated by uv and is mandatory for every worker.
# The explicit CPU index prevents a Linux resolution from adding a CUDA
# runtime closure to this model-free readiness project.
no-build-isolation-package = []

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.vokra.reference]
lock_schema = "uv-lock-v1-python312"
dependency_license_audit = "BLOCKED_UNREVIEWED_TRANSITIVE"
publication = "NO_UPLOAD"
source_repository = "https://github.com/Zyphra/Zonos.git"
source_revision = "bc40d98e1e1ab54fc65c483be127a90e3c7c0645"
fixed_path = "Zonos.from_local + official conditioner modules + official generate + official DAC decode"
phonemizer_policy = "LOUD_ABORT_PACKET_IDS_ONLY"
