[project]
name = "vokra-magnet-medium-30secs-reference"
version = "0.1.0"
description = "VAST-only AudioCraft MAGNeT Medium checkpoint bridge; no runtime dependency."
requires-python = "==3.12.*"
dependencies = ["huggingface-hub==1.27.0", "safetensors==0.7.0", "torch==2.7.1"]

[tool.uv]
package = false
environments = ["python_full_version == '3.12.*' and platform_machine == 'x86_64' and sys_platform == 'linux'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

