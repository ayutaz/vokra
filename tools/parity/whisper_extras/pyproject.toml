[project]
name = "vokra-whisper-extras-reference"
version = "0.1.0"
description = "Pinned independent Transformers reference for distil/kotoba Whisper"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==1.26.4",
  "torch==2.6.0",
  "transformers==5.10.4",
  "safetensors>=0.4,<1",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
