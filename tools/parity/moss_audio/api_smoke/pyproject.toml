[project]
name = "vokra-moss-audio-api-smoke"
version = "0.1.0"
description = "Model-free official MOSS-Audio Transformers API smoke"
requires-python = "==3.12.*"
dependencies = [
    "numpy==2.3.5",
    "torch==2.11.0",
    "transformers==5.10.4",
]

[tool.uv]
package = false
environments = [
    "python_full_version == '3.12.*' and platform_machine == 'x86_64' and sys_platform == 'linux'",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
