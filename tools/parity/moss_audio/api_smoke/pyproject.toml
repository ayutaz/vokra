[project]
name = "vokra-moss-audio-api-smoke"
version = "0.1.0"
description = "Model-free official MOSS-Audio Transformers API smoke"
requires-python = "==3.12.*"
dependencies = [
    "accelerate==1.12.0",
    "einops==0.8.1",
    "numpy==2.3.5",
    "safetensors==0.7.0",
    "scipy==1.16.3",
    "soundfile==0.13.1",
    "tiktoken==0.12.0",
    "torch==2.9.1",
    "torchaudio==2.9.1",
    "transformers==5.10.4",
]

[tool.uv]
package = false
environments = [
    "python_full_version == '3.12.*' and platform_machine == 'x86_64' and sys_platform == 'linux'",
]
# torch declares an unbounded `setuptools` runtime requirement and the resolver
# settles on 81.0.0, which carries GHSA-h35f-9h28-mq5c (fixed in 83.0.0). Nothing in this oracle
# imports setuptools at run time; raise the transitive floor rather than adding
# it as a direct dependency.
constraint-dependencies = ["setuptools>=83.0.0"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
