[project]
name = "vokra-moss-audio-parity"
version = "0.1.0"
description = "Pinned independent official MOSS-Audio reference dumper"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate==1.12.0",
    "einops==0.8.1",
    "numpy==2.3.5",
    "safetensors==0.7.0",
    "scipy==1.16.3",
    "soundfile==0.13.1",
    "tiktoken==0.12.0",
    "torch==2.9.1",
    "torchaudio==2.9.1",
    "transformers==4.57.1",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
