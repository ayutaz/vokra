[project]
name = "vokra-dfn3-reference"
version = "0.1.0"
description = "Pinned upstream DeepFilterNet3 reference environment for Vokra parity."
requires-python = ">=3.11,<3.12"
dependencies = [
    # Keep an exact, security-maintained upstream stack and revalidate the
    # committed Rust parity bounds whenever these pins move. This project runs
    # only as an offline reference oracle; none of these packages enter a
    # Vokra runtime or distribution.
    "deepfilternet==0.5.6",
    "numpy==1.26.4",
    "soundfile==0.14.0",
    "torch==2.13.0",
    # torchaudio releases are currently decoupled from torch. 2.11.0 removes
    # the legacy backend metadata namespace that DeepFilterNet imports; the
    # reference scripts restore that import-only type via
    # dfn3_torchaudio_compat without changing any numerical operation.
    "torchaudio==2.11.0",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
