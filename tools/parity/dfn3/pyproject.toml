[project]
name = "vokra-dfn3-reference"
version = "0.1.0"
description = "Pinned upstream DeepFilterNet3 reference environment for Vokra parity."
requires-python = ">=3.11,<3.12"
dependencies = [
    # Keep the exact upstream stack used to establish the committed Rust
    # parity bounds. This project runs only as an offline reference oracle;
    # none of these packages enter a Vokra runtime or distribution.
    "deepfilternet==0.5.6",
    "numpy==1.26.4",
    "soundfile==0.14.0",
    "torch==2.1.2",
    # torchaudio ships a compiled extension and must match torch's major/minor.
    "torchaudio==2.1.2",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
