[project]
name = "vokra-vibevoice-realtime-0-5b-reference"
version = "0.1.0"
description = "VAST-only official VibeVoice Realtime 0.5B reference runner"
requires-python = "==3.12.*"
dependencies = [
    "diffusers==0.32.2",
    "numpy==2.3.5",
    "safetensors==0.5.3",
    "torch==2.13.0 ; platform_machine == 'x86_64' and sys_platform == 'linux'",
    "tqdm==4.67.1",
    "transformers==5.10.4",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    # The runner is VAST-only; this marker keeps metadata tooling on the
    # maintainer Mac from trying to resolve a nonexistent Linux-only Torch
    # reference wheel. The actual reference environment remains Linux-only in
    # practice.
    "sys_platform == 'darwin' and platform_machine == 'aarch64'",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# This security lock intentionally installs the CPU-only wheel.  It avoids
# pulling any CUDA 13 native payload until the separate owner/legal dependency
# review is complete.  A GPU timing run requires a separately approved lock;
# this model-free API/closure gate must never infer that approval.

[tool.vokra.reference]
execution = "VAST_ONLY"
publication = "NO_UPLOAD"
