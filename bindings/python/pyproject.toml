[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "vokra"
dynamic = ["version"]
description = "Vokra — audio-specialized inference runtime (Python binding, pre-1.0)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9,<3.13"
authors = [{ name = "ayutaz" }]
keywords = ["speech", "tts", "asr", "audio", "inference", "runtime"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# NFR-DS-02 zero-dep: runtime dependencies MUST remain empty.
# numpy is optional caller-side interop only. Stream.push accepts contiguous
# float32 arrays through duck typing; vokra itself never imports numpy.
dependencies = []

[project.optional-dependencies]
numpy = ["numpy>=1.23,<2"]
dev = [
    # GHSA-6w46-j5rx-g56g is fixed in pytest 9.0.3. pytest 9 requires
    # Python 3.10; Python 3.9 remains a supported runtime target, but its
    # dependency-free wheel is not a supported contributor test environment.
    "pytest>=9.0.3; python_version >= '3.10'",
    "pip-licenses>=4.3",
]

[project.urls]
Homepage = "https://github.com/ayutaz/vokra"
Repository = "https://github.com/ayutaz/vokra"
Issues = "https://github.com/ayutaz/vokra/issues"

# The metadata hook reads VOKRA_BUILD_VERSION in release jobs and falls back to
# 0.1.0.dev0 for source checkouts. This prevents a release-tag build from
# silently publishing development-version metadata.
[tool.hatch.metadata.hooks.custom]
path = "hatch_build.py"

# --- hatchling: package under src/ layout ---
# Each native job builds vokra-capi on its real target and stages exactly one
# shared library under src/vokra/_lib/. Hatchling includes that file because
# the whole src/vokra package is selected.
[tool.hatch.build.targets.wheel]
packages = ["src/vokra"]

# The custom hook emits py3-none-<platform>: ctypes does not bind to a CPython
# ABI, while the bundled library is platform- and architecture-specific. It
# also rejects a missing library and any tag that does not match the build
# host, preventing false manylinux or universal2 claims.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

# Source distribution: exclude prebuilt native libs (per-platform, CI-injected).
[tool.hatch.build.targets.sdist]
include = [
    "src/vokra/**/*.py",
    "src/vokra/_lib/.gitkeep",
    "README.md",
    "LICENSE",
    "NOTICE",
    "hatch_build.py",
    "pyproject.toml",
]
exclude = [
    "src/vokra/_lib/*.so",
    "src/vokra/_lib/*.dylib",
    "src/vokra/_lib/*.dll",
]
